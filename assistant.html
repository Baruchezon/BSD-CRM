<!DOCTYPE html>

<script>
(function(){
  try{
    var PAGE_BUILD = '202610270450';
    window.PAGE_BUILD = PAGE_BUILD;
    var guardKey = 'bsd_ver_reload_guard:' + (location.pathname.split('/').pop() || 'index');
    function readGuard(){ try { return localStorage.getItem(guardKey); } catch(e){ try { return sessionStorage.getItem(guardKey); } catch(e2){ return 'storage-blocked'; } } }
    function writeGuard(v){ try { localStorage.setItem(guardKey, v); return true; } catch(e){ try { sessionStorage.setItem(guardKey, v); return true; } catch(e2){ return false; } } }
    var loopGuard = readGuard();
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        var serverBuild = (v.version || '').replace(/\D/g,'');
        if (serverBuild && serverBuild !== PAGE_BUILD && loopGuard !== serverBuild){
          if (!writeGuard(serverBuild)) return;
          var url = new URL(location.href);
          url.searchParams.set('_cb', Date.now());
          location.replace(url.toString());
        }
      })
      .catch(function(){});
  } catch(e){}
})();
</script>

  .pa-msg.user{display:flex;justify-content:flex-start;}
  .pa-user{background:var(--navy);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:80%;line-height:1.55;white-space:pre-wrap;}
  .pa-bot{background:#fbfaf6;border:1px solid #efe8d4;border-radius:14px;padding:12px 14px;}
  .pa-prose{color:#1c2333;line-height:1.65;font-size:.95rem;}
  .pa-cards{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .pa-card{background:#fff;border:1px solid #ece6d4;border-radius:12px;padding:10px 12px;}
  .pa-card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .pa-k{font-size:.72rem;color:#8a651e;font-weight:800;}
  .pa-t{font-weight:800;color:var(--navy);font-size:1rem;}
  .pa-s{color:#5d6577;font-size:.8rem;margin-top:2px;}
  .pa-line{font-size:.84rem;color:#2f3647;line-height:1.55;margin-top:5px;}
  .pa-open{background:var(--gold);color:#1c2333;text-decoration:none;border-radius:9px;padding:7px 10px;font-size:.78rem;font-weight:800;white-space:nowrap;}
  .pa-open:hover{filter:brightness(.97);}
  .pa-form{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
    min-width:0;
    position:relative;
    z-index:5;
    background:var(--bg);
    padding-top:10px;
    padding-bottom:max(8px, env(safe-area-inset-bottom));
    pointer-events:auto;
  }
  .pa-form textarea{
    display:block;
    width:100%;
    min-width:0;
    max-width:100%;
    min-height:120px;
    max-height:36dvh;
    resize:vertical;
    box-sizing:border-box;
    border:1px solid #d8d3c4;
    border-radius:14px;
    padding:14px 16px;
    margin:0;
    font-family:inherit;
    font-size:16px;
    line-height:1.5;
    background:#fff;
    color:var(--text);
    pointer-events:auto;
    touch-action:manipulation;
    user-select:text;
    -webkit-user-select:text;
    position:relative;
    z-index:6;
  }
  .pa-form textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.25);}
  .pa-form button{
    min-height:46px;
    width:100%;

    color:#fff;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    pointer-events:auto;

  .pa-wait{color:#7b8293;font-size:.85rem;}
  .no-access{max-width:520px;margin:80px auto;text-align:center;background:#fff;border-radius:14px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.15);}

    .pa-card-top{flex-direction:column;}
    .pa-user{max-width:100%;}

<script>
// 27.10.2026 (בקשת ברוך): עוזר אישי. קריאה בלבד דרך supabaseClient של המשתמש המחובר.
const chat = [];
let context = { cards: [] };
let busy = false;

function esc(s){ if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  const log = document.getElementById('paLog');
  log.innerHTML = chat.map(msg => {
    if (msg.role === 'user') return '<div class="pa-msg user"><div class="pa-user">' + esc(msg.text) + '</div></div>';
    if (msg.role === 'wait') return '<div class="pa-msg"><div class="pa-wait">מחפש בנתונים שגלויים לך…</div></div>';
    return '<div class="pa-msg"><div class="pa-bot">' + window.BSDAssistant.renderAnswerHtml(msg.result) + '</div></div>';
  }).join('');
  log.scrollTop = log.scrollHeight;
}

function syncViewport(){
  const vv = window.visualViewport;
  const h = vv ? Math.round(vv.height) : window.innerHeight;
  document.documentElement.style.setProperty('--pa-vh', h + 'px');
}
syncViewport();
if (window.visualViewport){
  visualViewport.addEventListener('resize', syncViewport);
  visualViewport.addEventListener('scroll', syncViewport);
}
window.addEventListener('resize', syncViewport);

async function ask(text){
  const q = String(text || '').trim();
  if (!q || busy) return;
  busy = true;
  chat.push({ role:'user', text:q });
  chat.push({ role:'wait' });
  render();
  let result;
  try {
    result = await window.BSDAssistant.answerQuestion(q, { db: window.supabaseClient, context });
  } catch (e) {
    result = { prose: 'לא הצלחתי להשלים את החיפוש.', cards: [] };
  }
  chat.pop();
  chat.push({ role:'assistant', result });
  if (chat.length > 24) chat.splice(0, chat.length - 24);
  context = { cards: (result && result.cards) || [] };
  busy = false;
  render();
}

const paInput = document.getElementById('paInput');
paInput.disabled = false;
paInput.readOnly = false;
document.getElementById('paForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const value = paInput.value;
  if (!String(value || '').trim() || busy) return;
  paInput.value = '';
  ask(value);
  paInput.focus();
});
paInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    document.getElementById('paForm').requestSubmit();
  }
});
paInput.addEventListener('focus', syncViewport);

(async function init(){
  const profile = await requireAuth();
  if (!profile) return;
  const allowed = typeof canUsePersonalAssistant === 'function'
    ? canUsePersonalAssistant(profile)
    : ((profile.role === 'admin' || profile.role === 'manager' || profile.can_use_ai_match === true) && profile.status !== 'blocked');
  if (!allowed){
    document.getElementById('noAccess').style.display = 'block';
    return;
  }
  document.getElementById('headerUserInfo').textContent = (profile.full_name && profile.full_name.trim()) ? profile.full_name : profile.email;
  const wrap = document.getElementById('mainWrap');
  wrap.style.display = 'flex';
  syncViewport();
  paInput.disabled = false;
  paInput.readOnly = false;
  paInput.focus();
})();
</script>
