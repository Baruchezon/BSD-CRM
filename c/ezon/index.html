<script>
"use strict";
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const CARD_API="https://zcdlegcvfirwzitfxjcs.supabase.co/functions/v1/public-digital-card";
let card = null;
function clean(v){return String(v||"").trim()}
function webUrl(v){try{const u=new URL(clean(v));return ["https:","http:"].includes(u.protocol)?u.href:""}catch(_){return ""}}
function phone(v){let p=clean(v).replace(/[^\d+]/g,"");if(p.startsWith("00"))p="+"+p.slice(2);if(p.startsWith("0"))p="+972"+p.slice(1);return p.replace(/[^\d]/g,"")}
function formatPhone(v){
 const original=clean(v);if(!original)return "";
 let digits=original.replace(/[\s().-]/g,"");
 const local=digits.match(/^(?:\+972|00972|972)0?([1-9]\d{7,8})$/);
 if(local)digits="0"+local[1];
 if(/^0(?:5\d|7\d)\d{7}$/.test(digits))return digits.slice(0,3)+"-"+digits.slice(3);
 if(/^0[2-9]\d{7}$/.test(digits))return digits.slice(0,2)+"-"+digits.slice(2);
 return original;
}
function icon(name,size=""){const el=document.createElementNS(NS,"svg");el.classList.add("icon");if(size)el.classList.add(size);el.setAttribute("aria-hidden","true");const u=document.createElementNS(NS,"use");u.setAttribute("href","#ic-"+name);el.append(u);return el}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=clean(text);return node}
function spanWithIcon(name,label){const s=el("span","top");s.append(icon(name,"lg"),el("span","",label));return s}
function makeBig(label,value,href,iconName,cls){
 if(!href)return;
 const a=el("a","big "+cls);a.href=href;a.append(spanWithIcon(iconName,label),el("span","detail",value));
 if(href.startsWith("https:")){a.target="_blank";a.rel="noopener noreferrer"}
 $("mainActions").append(a);
}
function makeTile(label,value,href,iconName,cls=""){
 const a=el(href?"a":"div","tile "+cls+(href?"":" disabled"));
 if(href){a.href=href;if(href.startsWith("https:")){a.target="_blank";a.rel="noopener noreferrer"}}
 const bg=el("span","iconbox");bg.append(icon(iconName));a.append(bg,el("span","label",label),el("span","value",value||""));
 if(href)a.title=value||label;
 $("tiles").append(a);
}
function makeService(label,detail,href){
 if(!href)return;const a=el("a","service");a.href=href;a.target="_blank";a.rel="noopener noreferrer";const k=el("span","service-icon");k.append(icon(label.includes("מכור")||label.includes("למכור")?"sell":"buy"));a.append(k,el("span","label",label),el("span","value",detail));$("services").append(a);
}
function makeDetail(label,value,iconName){
 if(!value)return;const row=el("div","detailrow");const ico=el("span","detailicon");ico.append(icon(iconName,"sm"));row.append(ico,el("span","",label),el("span","detailtext",value));$("details").append(row);
}
function bottomButton(label,detail,fn,cls,iconName){
 const b=el("button",cls);b.type="button";b.append(icon(iconName),el("span","label",label),el("span","value",detail));b.addEventListener("click",fn);$("bottom").append(b);
}
function urlLabel(value){
 try{const u=new URL(value);return u.hostname.replace(/^www\./,"")+(u.pathname&&u.pathname!=="/" ? u.pathname:"")+(u.search||"")}catch(_){return value}
}
function vEscape(s){return clean(s).replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m)}
function cardLookup(){
 const fragment=location.hash.slice(1).trim().toLowerCase();
 const routeMatch=location.pathname.match(/\/c\/([a-z][a-z0-9-]{2,23})\/?$/);
 const alias=routeMatch?routeMatch[1]:fragment;
 if(/^[a-z][a-z0-9-]{2,23}$/.test(alias))return new URLSearchParams({short:alias});
 const token=new URLSearchParams(location.search).get("card")||"";
 if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token))return new URLSearchParams({card:token});
 return null;
}
function cardUrl(){
 const short=clean(card?.short_code);
 if(!/^[a-z][a-z0-9-]{2,23}$/.test(short))return location.href;
 const root=location.pathname.includes("/c/")
  ?location.pathname.slice(0,location.pathname.indexOf("/c/")+1)
  :new URL("./",location.href).pathname;
 const route=short==="ezon"?"c/ezon/":"c/#"+encodeURIComponent(short);
 return new URL(root+route,location.origin).href;
}
function vcardUrl(){
 const query=cardLookup();
 if(!query && card?.short_code){
   const p=new URLSearchParams({short:card.short_code,format:"vcard"});
   return CARD_API+"?"+p.toString();
 }
 if(!query)return "";
 query.set("format","vcard");
 return CARD_API+"?"+query.toString();
}
function makeVcard(){
 const parts=["BEGIN:VCARD","VERSION:3.0","N:;"+vEscape(card.full_name)+";;;",
   "FN:"+vEscape(card.full_name),"ORG:"+vEscape(card.company_name),"TITLE:"+vEscape(card.job_title)];
 if(card.phone_mobile)parts.push("TEL;TYPE=CELL:"+vEscape(formatPhone(card.phone_mobile)));
 if(card.phone_office)parts.push("TEL;TYPE=WORK:"+vEscape(formatPhone(card.phone_office)));
 if(card.email)parts.push("EMAIL;TYPE=WORK:"+vEscape(card.email));
 if(card.website_url)parts.push("URL:"+vEscape(card.website_url));
 if(card.office_address)parts.push("ADR;TYPE=WORK:;;"+vEscape(card.office_address)+";;;;");
 parts.push("END:VCARD");
 return "\ufeff"+parts.join("\r\n")+"\r\n";
}
function directVcardDownload(){
 const source=vcardUrl();
 if(!source){$("status").textContent="לא ניתן להוריד כרגע. נסה לרענן את הכרטיס.";return;}
 const a=el("a");a.href=source;a.download="BSD_Contact.vcf";
 document.body.append(a);a.click();a.remove();
 $("status").textContent="קובץ איש הקשר ירד למכשיר. פתח את BSD_Contact.vcf מתוך ההורדות או הקבצים, בחר ייבוא לאנשי הקשר ואשר שמירה.";
}
function saveContact(){
 if(!card)return;
 const status=$("status");
 status.textContent="כדי לסיים שמירה, בחר באנשי קשר במסך שייפתח ואשר שמירה.";
 let file;
 try{file=new File([makeVcard()],"BSD_Contact.vcf",{type:"text/vcard;charset=utf-8"});}catch(_){directVcardDownload();return;}
 if(typeof navigator.share==="function" && typeof navigator.canShare==="function"){
   try{
     if(navigator.canShare({files:[file]})){
       // Must be called synchronously from the click to retain user activation.
       navigator.share({files:[file],title:"איש קשר: "+card.full_name})
        .then(()=>{status.textContent="הקובץ הועבר לאפליקציה שבחרת. אם בחרת אנשי קשר, אשר שמירה. אם אינך רואה את איש הקשר, אפשר להוריד אותו שוב מהכרטיס.";})
        .catch(e=>{if(e.name==="AbortError")status.textContent="פעולת הייבוא בוטלה. אפשר ללחוץ שוב על הוסף לאנשי הקשר.";else directVcardDownload();});
       return;
     }
   }catch(_){}
 }
 directVcardDownload();
}
async function shareCard(){
 try{if(navigator.share){await navigator.share({title:card.full_name+" | BSD",text:"כרטיס הביקור הדיגיטלי שלי",url:cardUrl()});return;}
 await navigator.clipboard.writeText(cardUrl());$("status").textContent="קישור הכרטיס הועתק לשיתוף.";}
 catch(e){if(e.name!=="AbortError")$("status").textContent="ניתן לשתף באמצעות העתקת הקישור משורת הדפדפן."}
}
function show(c){
 card=c;document.title=clean(c.full_name)+" | כרטיס ביקור דיגיטלי | BSD";
 $("name").textContent=clean(c.full_name);$("job").textContent=clean(c.job_title);$("company").textContent=clean(c.company_name);
 const description=clean(c.description);$("description").textContent=description;$("description").hidden=!description;
 const photo=webUrl(c.photo_url),logo=webUrl(c.logo_url);
 if(photo){$("photo").src=photo;$("photo").hidden=false;$("portraitFallback").hidden=true;$("photo").onerror=()=>{$("photo").hidden=true;$("portraitFallback").hidden=false}}
 if(logo){$("logo").src=logo;$("logo").hidden=false;$("logo").onerror=()=>{$("logo").hidden=true}}
 const mobile=phone(c.phone_mobile),office=phone(c.phone_office),wa=phone(c.whatsapp_number||c.phone_mobile);
 makeBig("התקשר אליי",formatPhone(c.phone_office||c.phone_mobile),office?"tel:+"+office:(mobile?"tel:+"+mobile:""),"phone","call");

 const site=webUrl(c.website_url),fb=webUrl(c.facebook_url),ig=webUrl(c.instagram_url);
 if(wa)makeTile("וואטסאפ",formatPhone(c.whatsapp_number||c.phone_mobile),"https://wa.me/"+wa,"whatsapp","whatsapp");
 if(site)makeTile("אתר החברה",urlLabel(site),site,"globe");
 if(fb)makeTile("פייסבוק",urlLabel(fb),fb,"facebook","facebook");
 if(ig)makeTile("אינסטגרם",urlLabel(ig),ig,"instagram","instagram");
 else makeTile("אינסטגרם","טרם חובר",null,"instagram","instagram");
 if(c.email)makeTile("שלח אימייל",c.email,"mailto:"+encodeURIComponent(clean(c.email)),"email","mail");
 if(mobile)makeTile("נייד אישי",formatPhone(c.phone_mobile),"tel:+"+mobile,"phone","phone");
 if(clean(c.company_name).toLowerCase().includes("bsd") || clean(c.website_url).includes("bsd-bbi.co.il")){
   $("servicesSection").hidden=false;
   makeService("אני רוצה למכור עסק","ליווי והכנה מקצועית למכירה","https://www.bsd-bbi.co.il/%D7%9E%D7%95%D7%9B%D7%A8-%D7%A2%D7%A1%D7%A7/");
   makeService("מחפש עסק לרכישה","הזדמנויות עסקיות ועסקים למכירה","https://www.bsd-bbi.co.il/%D7%A2%D7%A1%D7%A7%D7%99%D7%9D-%D7%9C%D7%9E%D7%9B%D7%99%D7%A8%D7%94/");
 }
 makeDetail("משרד",formatPhone(c.phone_office),"phone");makeDetail("נייד",formatPhone(c.phone_mobile),"phone");
 makeDetail("דוא״ל",c.email,"email");makeDetail("כתובת משרד",c.office_address,"map");
 bottomButton("הוסף לאנשי הקשר","שמירת פרטים בטלפון",saveContact,"save","save");
 bottomButton("שתף כרטיס","קישור לכרטיס המעוצב",shareCard,"share","share");
 $("loading").hidden=true;$("cardPanel").hidden=false;
}
async function load(){
 const query=cardLookup();
 if(!query){$("loading").textContent="קישור הכרטיס אינו תקין";return;}
 try{
   const resp=await fetch(CARD_API+"?"+query.toString(),{cache:"no-store"});
   if(!resp.ok)throw Error("הכרטיס אינו זמין או אינו מפורסם");
   const data=await resp.json();if(!data.card)throw Error("לא נמצא כרטיס");show(data.card);
 }catch(e){$("loading").textContent=e.message}
}
load();
</script>
</body></html>
