<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BSD CRM - לקוחות VIP</title>
<link rel="stylesheet" href="css/style.css?v=202608251709">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#f5f3ed}.wrap{max-width:1450px;margin:0 auto;padding:24px}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.titlebar h1{margin:0;color:#0e1b34;font-size:1.5rem}.titlebar a{background:#0e1b34;color:#fff;text-decoration:none;border-radius:9px;padding:10px 16px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e2dfd6;border-radius:14px;padding:16px;box-shadow:0 5px 18px rgba(14,27,52,.06)}.stat b{display:block;font-size:1.6rem;color:#0e1b34}.stat span{font-size:.8rem;color:#70798a}.panel{background:#fff;border-radius:14px;border:1px solid #e2dfd6;box-shadow:0 7px 22px rgba(14,27,52,.06);overflow:hidden}.filters{display:flex;gap:10px;padding:14px;flex-wrap:wrap;border-bottom:1px solid #ece9df}.filters input,.filters select{padding:9px 11px;border:1px solid #d6d2c7;border-radius:8px;font-family:inherit}table{width:100%;border-collapse:collapse}th{background:#0e1b34;color:#fff;text-align:right;padding:11px 12px;font-size:.78rem;white-space:nowrap}td{padding:11px 12px;border-bottom:1px solid #efede7;font-size:.82rem;vertical-align:top}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-weight:800;font-size:.72rem}.active{background:#dff2e7;color:#1b6841}.blocked{background:#fde2e2;color:#9b2323}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;border-radius:7px;padding:6px 9px;font-family:inherit;font-size:.75rem;font-weight:700;cursor:pointer;background:#eef2f8;color:#0e1b34}.actions button.danger{background:#fff0f0;color:#a72a2a}.actions button.gold{background:#f4e8bf;color:#6d5313}.muted{color:#7d8799}.activity{display:grid;gap:6px;max-width:250px}.activity div{font-size:.72rem;color:#566176}.inquiry{background:#fff8e8;border:1px solid #f0dca3;border-radius:8px;padding:7px;margin-bottom:6px}.empty{text-align:center;padding:36px;color:#7a8494}.overlay{position:fixed;inset:0;background:rgba(14,27,52,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.modal{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:24px;box-shadow:0 22px 60px rgba(0,0,0,.35)}.modal h3{margin:0 0 14px;color:#0e1b34}.modal input{width:100%;padding:10px;border:1px solid #d6d2c7;border-radius:8px;margin-bottom:10px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions button{border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}.primary{background:#0e1b34;color:#fff}.ghost{background:#eee;color:#233}.toast{position:fixed;left:22px;bottom:22px;background:#0e1b34;color:#fff;border-radius:9px;padding:11px 16px;z-index:120}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.panel{overflow:auto}table{min-width:1150px}}@media(max-width:560px){.stats{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
<style>
.modal{max-width:960px;max-height:90vh;overflow:auto}.detail-table{min-width:760px}.client-link{color:#0e1b34;font-weight:800}.business-list{display:grid;gap:4px;min-width:180px}.business-list a{color:#1d4e89;font-weight:700}.yes{color:#187044;font-weight:800}.no{color:#8a93a3}.activity-modal-wrap{overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar"><div><h1>⭐ ניהול לקוחות VIP</h1><div class="muted">כניסות, פעילות, הורדות, התעניינויות ופניות</div></div><a id="vipBackLink" href="app.html">חזרה למסך הקודם</a></div>
  <div class="stats"><div class="stat"><b id="sTotal">0</b><span>לקוחות VIP</span></div><div class="stat"><b id="sActive">0</b><span>פעילים</span></div><div class="stat"><b id="sInterested">0</b><span>עסקים במועדפים</span></div><div class="stat"><b id="sInquiries">0</b><span>פניות VIP</span></div></div>
  <div class="panel">
    <div class="filters"><input id="q" placeholder="חיפוש לפי שם, טלפון, מספר לקוח או שם משתמש"><select id="statusFilter"><option value="all">כל הסטטוסים</option><option value="active">פעילים</option><option value="blocked">חסומים</option></select><button id="refresh" class="primary" style="border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer;">רענן</button></div>
    <div id="tableWrap"></div>
  </div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script src="js/config.js?v=202609241310-1"></script>
<script src="js/supabaseClient.js?v=202608111530"></script>
<script src="js/auth.js?v=202609241200"></script>
<script>
const API=(window.BSD_CONFIG&&window.BSD_CONFIG.VIP_API_URL)||'https://zcdlegcvfirwzitfxjcs.supabase.co/functions/v1/vip-api';
let rows=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString('he-IL'):'—';
const fmtDuration=s=>{s=Math.max(0,Number(s)||0);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h} ש׳ ${m} דק׳`:`${m} דק׳`};
function toast(t){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>r.innerHTML='',2600)}
async function adminApi(action,payload={}){const {data:{session}}=await window.supabaseClient.auth.getSession();if(!session)throw new Error('אין התחברות');const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});let d={};try{d=await res.json()}catch{}if(!res.ok||d.ok===false)throw new Error(d.message||d.error||'שגיאה');return d}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();const sf=document.getElementById('statusFilter').value;let f=rows.filter(r=>{const b=r.buyer||{};const hay=[b.full_name,b.phone,b.client_number,r.username].join(' ').toLowerCase();return(!q||hay.includes(q))&&(sf==='all'||r.status===sf)});document.getElementById('sTotal').textContent=rows.length;document.getElementById('sActive').textContent=rows.filter(r=>r.status==='active').length;document.getElementById('sInterested').textContent=rows.reduce((s,r)=>s+(r.stats?.interests||0),0);document.getElementById('sInquiries').textContent=rows.reduce((s,r)=>s+(r.stats?.inquiries||0),0);if(!f.length){document.getElementById('tableWrap').innerHTML='<div class="empty">אין לקוחות להצגה</div>';return}document.getElementById('tableWrap').innerHTML=`<table><thead><tr><th>לקוח</th><th>שם משתמש</th><th>סטטוס</th><th>כניסות</th><th>כניסה אחרונה</th><th>זמן באתר</th><th>צפיות</th><th>מסמכים</th><th>מעניין</th><th>פניות</th><th>פעילות אחרונה</th><th>פעולות</th></tr></thead><tbody>${f.map(r=>{const b=r.buyer||{};const act=(r.recent_activity||[]).slice(0,6).map(a=>`<div>${eventName(a.event_type)}${a.business_label?' · '+esc(a.business_label):''}${a.file_label?' · '+esc(a.file_label):''} · ${fmt(a.created_at)}</div>`).join('')||'<span class="muted">אין פעילות</span>';const sessions=(r.recent_sessions||[]).slice(0,2).map(x=>`<div style="margin-top:4px;font-size:.7rem;color:#657086">כניסה ${fmt(x.created_at)}<br>פעילות אחרונה ${fmt(x.last_activity_at)} · ${fmtDuration(x.active_seconds||0)}</div>`).join('');const inquiries=(r.recent_inquiries||[]).slice(0,2).map(i=>`<div class="inquiry"><b>${fmt(i.created_at)}</b><br>${esc(i.message||'פנייה לקבלת פרטים')}</div>`).join('');return `<tr><td><b>${esc(b.full_name||'')}</b><br><span class="muted">${esc(b.client_number||'')} · ${esc(b.phone||'')}</span><br><span class="muted">${esc(b.agreement_status||'')}</span></td><td><b>${esc(r.username)}</b></td><td><span class="badge ${r.status==='active'?'active':'blocked'}">${r.status==='active'?'פעיל':'חסום'}</span></td><td>${r.login_count||0}</td><td>${fmt(r.last_login_at)}</td><td><b>${fmtDuration(r.stats?.active_seconds||0)}</b></td><td>${r.stats?.business_views||0}</td><td>צפייה ${r.stats?.document_views||0}<br>הורדה ${r.stats?.document_downloads||0}</td><td>${r.stats?.interests||0}</td><td>${r.stats?.inquiries||0}${inquiries}</td><td><div class="activity">${act}${sessions}</div></td><td><div class="actions"><button class="gold" onclick="resetPwd('${r.id}')">איפוס סיסמה</button><button onclick="renameUser('${r.id}','${esc(r.username)}')">שינוי שם</button>${r.status==='active'?`<button onclick="accountAction('${r.id}','block')">חסום</button>`:`<button onclick="accountAction('${r.id}','unblock')">שחרר חסימה</button>`}<button class="danger" onclick="accountAction('${r.id}','delete')">מחק VIP</button></div></td></tr>`}).join('')}</tbody></table>`}
function agreementLabel(b){if(!b)return'לא ידוע';if(b.agreement_signed||b.agreement_status==='יש הסכם חתום')return'יש הסכם חתום';if(b.agreement_sent||b.agreement_status==='נשלח הסכם לחתימה')return'נשלח לחתימה';return b.agreement_status||'אין הסכם'}
function renderV2(){const q=document.getElementById('q').value.trim().toLowerCase(),sf=document.getElementById('statusFilter').value;const f=rows.filter(r=>{const b=r.buyer||{};const names=(r.recent_activity||[]).map(a=>a.business_label).join(' ');return(!q||[b.full_name,b.phone,b.client_number,r.username,names].join(' ').toLowerCase().includes(q))&&(sf==='all'||r.status===sf)});document.getElementById('sTotal').textContent=rows.length;document.getElementById('sActive').textContent=rows.filter(r=>r.status==='active').length;document.getElementById('sInterested').textContent=rows.reduce((s,r)=>s+(r.stats?.interests||0),0);document.getElementById('sInquiries').textContent=rows.reduce((s,r)=>s+(r.stats?.inquiries||0),0);if(!f.length){document.getElementById('tableWrap').innerHTML='<div class="empty">אין לקוחות להצגה</div>';return}document.getElementById('tableWrap').innerHTML=`<table><thead><tr><th>לקוח</th><th>סטטוס</th><th>זמן פעיל</th><th>עסקים שנצפו</th><th>קבצים</th><th>פניות</th><th>פעילות</th><th>פעולות</th></tr></thead><tbody>${f.map(r=>{const b=r.buyer||{};const unique=[...new Map((r.recent_activity||[]).filter(a=>a.business_id).map(a=>[a.business_id,a])).values()];const businesses=unique.length?unique.map(a=>`<a href="businesses.html?open=${encodeURIComponent(a.business_id)}">${esc(a.business_label||'עסק')}</a>`).join(''):'<span class="muted">אין צפיות</span>';return`<tr><td><a class="client-link" href="leads.html?open=${encodeURIComponent(r.buyer_id)}">${esc(b.full_name||'לקוח')}</a><br><span class="muted">${esc(b.client_number||'')} · ${esc(b.phone||'')}</span><br>${esc(agreementLabel(b))}</td><td><span class="badge ${r.status==='active'?'active':'blocked'}">${r.status==='active'?'פעיל':'חסום'}</span><br><span class="muted">${esc(r.username)}</span></td><td><b>${fmtDuration(r.stats?.active_seconds||0)}</b><br><span class="muted">${r.login_count||0} כניסות</span></td><td><div class="business-list">${businesses}</div></td><td>נצפו: <b>${r.stats?.document_views||0}</b><br>הורדו: <b>${r.stats?.document_downloads||0}</b></td><td><b>${r.stats?.inquiries||0}</b>${r.stats?.inquiries?`<br><a href="leads-hub.html?tab=vip" style="color:#1d4e89;">פתח לידי VIP</a>`:''}</td><td><button onclick="openActivity('${r.id}')" class="primary" style="border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:800;">פירוט מלא</button></td><td><div class="actions"><button class="gold" onclick="resetPwd('${r.id}')">איפוס סיסמה</button><button onclick="renameUser('${r.id}','${esc(r.username)}')">שינוי שם</button>${r.status==='active'?`<button onclick="accountAction('${r.id}','block')">חסום</button>`:`<button onclick="accountAction('${r.id}','unblock')">שחרר</button>`}<button class="danger" onclick="accountAction('${r.id}','delete')">מחק VIP</button></div></td></tr>`}).join('')}</tbody></table>`}
function openActivity(id){const r=rows.find(x=>x.id===id);if(!r)return;const b=r.buyer||{};const activity=(r.recent_activity||[]).map(a=>`<tr><td>${fmt(a.created_at)}</td><td>${esc(eventName(a.event_type))}</td><td>${a.business_id?`<a href="businesses.html?open=${encodeURIComponent(a.business_id)}">${esc(a.business_label||'עסק')}</a>`:'—'}</td><td>${esc(a.business?.business_number||'—')}</td><td>${esc(a.file_label||'—')}</td><td class="${a.event_type==='document_download'?'yes':'no'}">${a.event_type==='document_download'?'כן':'לא'}</td></tr>`).join('')||'<tr><td colspan="6">אין פעילות</td></tr>';const sessions=(r.recent_sessions||[]).map(s=>`<tr><td>${fmt(s.created_at)}</td><td>${fmt(s.last_activity_at)}</td><td>${fmtDuration(s.active_seconds||0)}</td><td>${s.revoked_at?'הסתיימה':new Date(s.expires_at)<new Date()?'פגה':'פעילה'}</td></tr>`).join('')||'<tr><td colspan="4">אין כניסות</td></tr>';document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h3>פעילות VIP · ${esc(b.full_name||'לקוח')}</h3><p><b>זמן פעיל כולל:</b> ${fmtDuration(r.stats?.active_seconds||0)} · <b>הסכם:</b> ${esc(agreementLabel(b))}</p><div class="activity-modal-wrap"><table class="detail-table"><thead><tr><th>מועד</th><th>פעולה</th><th>שם העסק בפועל</th><th>מספר עסק</th><th>קובץ</th><th>הורד</th></tr></thead><tbody>${activity}</tbody></table><h3 style="margin-top:22px;">זמני כניסה</h3><table class="detail-table"><thead><tr><th>כניסה</th><th>פעילות אחרונה</th><th>זמן פעיל</th><th>מצב</th></tr></thead><tbody>${sessions}</tbody></table></div><div class="modal-actions"><button class="primary" onclick="closeModal()">סגור</button></div></div></div>`}
function eventName(v){return({login:'כניסה',logout:'יציאה',business_view:'צפייה בעסק',document_view:'צפייה במסמך',document_download:'הורדת מסמך',interest_marked:'נוסף למועדפים',interest_removed:'הוסר מהמועדפים',inquiry_sent:'נשלחה פנייה',password_changed:'שינוי סיסמה'})[v]||v}
async function load(){try{const p=await requireAuth();if(!p||!['admin','manager'].includes(p.role)){document.body.innerHTML='<div class="empty">אין הרשאה למסך זה</div>';return}const d=await adminApi('admin_list');rows=d.accounts||[];renderV2()}catch(e){toast(e.message)}}
async function accountAction(id,a){if(a==='delete'&&!confirm('למחוק את חשבון ה VIP בלבד? כרטיס הקונה ב CRM לא יימחק.'))return;try{await adminApi('admin_account_action',{account_id:id,account_action:a});toast('עודכן בהצלחה');await load()}catch(e){toast(e.message)}}
async function resetPwd(id){try{const d=await adminApi('admin_account_action',{account_id:id,account_action:'reset_password'});const row=rows.find(x=>x.id===id)||{};const b=row.buyer||{};const phone=String(b.phone||'').replace(/\D/g,'');const waPhone=phone.startsWith('0')?'972'+phone.slice(1):phone;const msg=`שלום ${b.full_name||''},\n\nלבקשתך הופקה סיסמה זמנית חדשה לאזור לקוחות VIP של BSD.\n\nכניסה: https://www.bsd-bbi.co.il/vip/\nשם משתמש: ${d.username}\nסיסמה זמנית: ${d.temporary_password}\n\nלאחר הכניסה ניתן לשנות את הסיסמה.`;const wa=waPhone?`<p><a href="https://wa.me/${esc(waPhone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" style="display:inline-block;background:#1f9d55;color:#fff;text-decoration:none;border-radius:8px;padding:9px 13px;font-weight:800;">שלח ב WhatsApp</a></p>`:'';openInfo('סיסמה זמנית חדשה',`<p><b>שם משתמש:</b> ${esc(d.username)}</p><p><b>סיסמה זמנית:</b> <span style="font-family:monospace;font-size:1.1rem">${esc(d.temporary_password)}</span></p>${wa}<p class="muted">הסיסמה אינה נשמרת כטקסט גלוי.</p>`)}catch(e){toast(e.message)}}
function renameUser(id,current){document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h3>שינוי שם משתמש</h3><input id="newUsername" value="${esc(current)}"><div class="modal-actions"><button class="primary" onclick="saveRename('${id}')">שמור</button><button class="ghost" onclick="closeModal()">ביטול</button></div></div></div>`}
async function saveRename(id){try{await adminApi('admin_account_action',{account_id:id,account_action:'rename',username:document.getElementById('newUsername').value});closeModal();toast('שם המשתמש עודכן');await load()}catch(e){toast(e.message)}}
function openInfo(title,html){document.getElementById('modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h3>${esc(title)}</h3>${html}<div class="modal-actions"><button class="primary" onclick="closeModal()">סגור</button></div></div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function setupBackLink(){const link=document.getElementById('vipBackLink'),raw=new URLSearchParams(location.search).get('return')||'';let target='app.html';if(raw&&!/^[a-z][a-z0-9+.-]*:/i.test(raw)&&!raw.startsWith('//')&&!raw.includes('\\')&&/^[a-z0-9_-]+\.html(?:[?#].*)?$/i.test(raw))target=raw;else if(document.referrer){try{const u=new URL(document.referrer);if(u.origin===location.origin)target=u.pathname.split('/').pop()+u.search}catch(e){}}link.href=target;link.textContent=target.startsWith('businesses.html')?'חזרה לעסק האחרון':target.startsWith('leads.html')?'חזרה ללקוח האחרון':target.startsWith('leads-hub.html')?'חזרה ללידים':'חזרה למסך הקודם'}
document.getElementById('q').addEventListener('input',renderV2);document.getElementById('statusFilter').addEventListener('change',renderV2);document.getElementById('refresh').addEventListener('click',load);setupBackLink();load();
</script>
</body></html>
