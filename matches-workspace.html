<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<script>
(function(){
  try{
    var PAGE_BUILD = '202608281530';
    window.PAGE_BUILD = PAGE_BUILD;
    var loopGuard = sessionStorage.getItem('bsd_ver_reload_guard');
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        var serverBuild = (v.version || '').replace(/\D/g,'');
        if (serverBuild && serverBuild !== PAGE_BUILD && loopGuard !== serverBuild){
          sessionStorage.setItem('bsd_ver_reload_guard', serverBuild);
          var url = new URL(location.href);
          url.searchParams.set('_cb', Date.now());
          location.replace(url.toString());
        }
      }).catch(function(){});
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז ההתאמות | BSD CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<style>
  :root{
    --navy:#0e1b34; --navy-light:#16264a; --gold:#c9a24b; --gold-light:#e8cf8a;
    --bg:#f6f5ef; --card:#ffffff; --text:#1c2333; --muted:#6b7280; --line:#e3ddcf;
    --c-green-bg:#e2f6ea; --c-green-fg:#166534; --c-red-bg:#fbe2df; --c-red-fg:#a32d21;
    --c-orange-bg:#fdedcf; --c-orange-fg:#95590a; --c-blue-bg:#dfeafc; --c-blue-fg:#1d4e89;
    --c-gray-bg:#e7e7ea; --c-gray-fg:#54575f; --c-purple-bg:#ede3fb; --c-purple-fg:#5b2e97;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  .topbar{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;padding:14px 20px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:40;}
  .topbar h1{margin:0;font-size:17px;}
  .topbar .sub{margin:2px 0 0;font-size:11px;color:var(--gold-light);}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .who{font-size:12px;color:var(--gold-light);}
  .back-btn,.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;font-family:inherit;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;}
  .back-btn:hover,.logout-btn:hover{background:rgba(255,255,255,0.1);}

  .toolbar{max-width:1200px;margin:14px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:10px;}
  .search-row{display:flex;gap:8px;flex-wrap:wrap;}
  .search-row input, .search-row select{padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;background:#fff;}
  .search-row input#searchBox{flex:1;min-width:220px;}
  .search-row select{min-width:160px;}

  .quickviews{display:flex;gap:7px;flex-wrap:wrap;}
  .qv-chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text);white-space:nowrap;}
  .qv-chip .qv-count{background:var(--navy);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-inline-start:5px;}
  .qv-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .qv-chip.active .qv-count{background:var(--gold);color:var(--navy);}

  .page{max-width:1200px;margin:14px auto 40px;padding:0 16px;}
  .loading, .empty-state{text-align:center;color:var(--muted);padding:40px 20px;background:var(--card);border-radius:14px;border:1px dashed var(--line);font-size:14px;}

  .chip{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
  .chip-green{background:var(--c-green-bg);color:var(--c-green-fg);}
  .chip-red{background:var(--c-red-bg);color:var(--c-red-fg);}
  .chip-orange{background:var(--c-orange-bg);color:var(--c-orange-fg);}
  .chip-blue{background:var(--c-blue-bg);color:var(--c-blue-fg);}
  .chip-gray{background:var(--c-gray-bg);color:var(--c-gray-fg);}
  .chip-purple{background:var(--c-purple-bg);color:var(--c-purple-fg);}
  .biz-number{background:var(--navy);color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px;display:inline-block;}

  table.match-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(14,27,52,0.07);}
  table.match-table thead th{background:var(--navy);color:#fff;font-size:11.5px;padding:10px 8px;text-align:right;position:sticky;top:56px;z-index:5;}
  table.match-table tbody tr{border-bottom:1px solid var(--line);cursor:pointer;}
  table.match-table tbody tr:hover{background:#faf8f0;}
  table.match-table tbody tr.updated-now{background:#fdf8ea;}
  table.match-table td{padding:9px 8px;font-size:12.5px;vertical-align:top;}
  .mt-name{font-weight:800;color:var(--navy);}
  .mt-sub{color:var(--muted);font-size:11px;margin-top:2px;}
  .mt-action-btn{background:#f1eee2;border:none;color:var(--text);padding:5px 10px;border-radius:7px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .mt-action-btn:hover{background:var(--gold-light);}
  .overdue-flag{color:var(--c-red-fg);font-weight:800;}

  /* mobile: collapse table into cards */
  @media(max-width:820px){
    table.match-table thead{display:none;}
    table.match-table, table.match-table tbody, table.match-table tr, table.match-table td{display:block;width:100%;}
    table.match-table tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:10px 12px;background:#fff;}
    table.match-table td{padding:3px 0;border:none;}
    table.match-table td[data-label]:before{content:attr(data-label);display:block;font-size:10.5px;color:var(--muted);font-weight:700;}
  }

  .overlay{position:fixed;inset:0;background:rgba(14,27,52,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;}
  .modal-head h3{margin:0;font-size:15px;color:var(--navy);}
  .modal-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .modal-body{padding:16px 18px;}
  .modal-foot{padding:12px 18px 18px;display:flex;gap:8px;justify-content:flex-end;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700;}
  .field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;}
  .btn-primary{background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-ghost{background:#f1eee2;color:var(--text);border:none;padding:10px 18px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>📁 מרכז ההתאמות</h1>
    <p class="sub">כל ההתאמות במקום אחד · ממוין תמיד לפי עדכון אחרון</p>
  </div>
  <div class="topbar-right">
    <span class="who" id="whoAmI"></span>
    <a class="back-btn" href="app.html">🔙 ללוח הבקרה</a>
    <button class="logout-btn" onclick="bsdLogout()">יציאה</button>
  </div>
</div>

<div class="toolbar">
  <div class="search-row">
    <input type="text" id="searchBox" placeholder="חיפוש: שם עסק, מספר עסק, שם קונה, מספר קונה, טלפון, סוכן...">
    <select id="statusFilter"><option value="">כל הסטטוסים</option></select>
  </div>
  <div class="quickviews" id="quickviews"></div>
</div>

<div class="page" id="mainContent">
  <div class="loading">טוען נתונים…</div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
let CURRENT_PROFILE = null;
let ALL_LEADS = [], ALL_BUSINESSES = {}, ALL_MATCHES = [], ALL_PROFILES = {}, ALL_TASKS = [];
let searchTerm = "", statusTerm = "", activeQuickView = "";

const STATUS_COLOR = {
  'התאמה חדשה':'blue', 'ממתין לחתימת סודיות':'orange', 'נחתמה סודיות':'green',
  'מידע ראשוני נשלח':'blue', 'תקציר נשלח':'blue', 'חומרים מלאים נשלחו':'blue',
  'ממתין לתגובה':'orange', 'הקונה מעוניין':'green', 'הקונה לא מעוניין':'red',
  'נקבעה פגישה':'purple', 'התקיימה פגישה':'purple', 'בבדיקת נתונים':'orange',
  'במשא ומתן':'purple', 'הוקפא':'gray', 'נסגר ללא עסקה':'red', 'עסקה הושלמה':'green',
  'נדרש עדכון':'red'
};
const STATUS_LIST = ['התאמה חדשה','ממתין לחתימת סודיות','נחתמה סודיות','מידע ראשוני נשלח','תקציר נשלח',
  'חומרים מלאים נשלחו','ממתין לתגובה','הקונה מעוניין','הקונה לא מעוניין','נקבעה פגישה','התקיימה פגישה',
  'בבדיקת נתונים','במשא ומתן','הוקפא','נסגר ללא עסקה','עסקה הושלמה','נדרש עדכון'];

function esc(s){ return (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){ if(!iso) return "—"; const d = new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString('he-IL'); }
function fmtDateTime(iso){ if(!iso) return "—"; const d = new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString('he-IL')+" "+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.getElementById('toastRoot').appendChild(el); setTimeout(()=>el.remove(),3000); }
function userName(id){ if(!id) return null; const p = ALL_PROFILES[id]; return p ? (p.full_name||p.role) : null; }
function leadById(id){ return ALL_LEADS.find(l=>l.id===id); }
function bizLabel(bizId){
  const b = ALL_BUSINESSES[bizId];
  if(!b) return "—";
  return `${b.business_number?`<span class="biz-number">#${esc(b.business_number.replace('BSD-B-',''))}</span> `:""}${esc(b.internal_name||"")}`;
}

async function loadEverything(){
  const sb = window.supabaseClient;
  const [{data: leads}, {data: businesses}, {data: matches}, {data: profiles}, {data: tasks}] = await Promise.all([
    sb.from('leads').select('id,full_name,phone,phone2,client_number,agreement_status,created_by,handled_by,type').eq('type','buyer'),
    sb.from('businesses').select('id,internal_name,business_number,field,agreement_status,created_by,handled_by'),
    sb.from('matches').select('*'),
    sb.from('profiles').select('id,full_name,role'),
    sb.from('tasks').select('id,match_id,business_id,buyer_id,title,status,due_date,assigned_to')
  ]);
  ALL_LEADS = leads || [];
  (businesses||[]).forEach(b=> ALL_BUSINESSES[b.id]=b);
  ALL_MATCHES = matches || [];
  (profiles||[]).forEach(p=> ALL_PROFILES[p.id]=p);
  ALL_TASKS = tasks || [];
  buildStatusFilter();
  buildQuickViews();
  render();
}

function buildStatusFilter(){
  const sel = document.getElementById('statusFilter');
  const present = [...new Set(ALL_MATCHES.map(m=>m.status).filter(Boolean))];
  STATUS_LIST.concat(present.filter(s=>!STATUS_LIST.includes(s))).forEach(s=>{
    if(!present.includes(s)) return;
    const opt = document.createElement('option'); opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}

function matchesQuickView(m, key){
  const today = new Date(); today.setHours(0,0,0,0);
  switch(key){
    case 'today': {
      const t = ALL_TASKS.filter(t=>t.match_id===m.id && t.status!=='הושלמה' && t.due_date);
      return t.some(t=>{ const d=new Date(t.due_date); d.setHours(0,0,0,0); return d.getTime()===today.getTime(); })
        || (m.next_action_at && new Date(m.next_action_at).toDateString()===today.toDateString());
    }
    case 'overdue': {
      const t = ALL_TASKS.filter(t=>t.match_id===m.id && t.status!=='הושלמה' && t.due_date);
      const overdueTask = t.some(t=>{ const d=new Date(t.due_date); d.setHours(0,0,0,0); return d.getTime()<today.getTime(); });
      const overdueAction = m.next_action_at && new Date(m.next_action_at) < today;
      return overdueTask || overdueAction;
    }
    case 'waiting': return m.status === 'ממתין לתגובה';
    case 'interested': return m.status === 'הקונה מעוניין';
    case 'meetings': return m.status === 'נקבעה פגישה';
    case 'negotiation': return m.status === 'במשא ומתן';
    case 'stale': { const d = daysSince(m.updated_at); return d !== null && d >= 14 && !['עסקה הושלמה','נסגר ללא עסקה','הקונה לא מעוניין'].includes(m.status); }
    default: return true;
  }
}

function buildQuickViews(){
  const views = [
    {key:'', label:'הכל'},
    {key:'today', label:'📅 לטיפול היום'},
    {key:'overdue', label:'⏰ מעקבים באיחור'},
    {key:'waiting', label:'💬 ממתינים לתגובה'},
    {key:'interested', label:'✅ קונים מעוניינים'},
    {key:'meetings', label:'🤝 פגישות שנקבעו'},
    {key:'negotiation', label:'📈 במשא ומתן'},
    {key:'stale', label:'😴 ללא פעילות 14+ ימים'}
  ];
  const wrap = document.getElementById('quickviews');
  wrap.innerHTML = views.map(v=>{
    const count = v.key ? ALL_MATCHES.filter(m=>matchesQuickView(m, v.key)).length : ALL_MATCHES.length;
    return `<button class="qv-chip ${activeQuickView===v.key?'active':''}" data-qv="${v.key}">${v.label}<span class="qv-count">${count}</span></button>`;
  }).join("");
  wrap.querySelectorAll('[data-qv]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeQuickView = btn.dataset.qv; buildQuickViews(); render(); });
  });
}

function render(){
  const wrap = document.getElementById('mainContent');
  const q = searchTerm.trim();
  let rows = ALL_MATCHES.filter(m=>{
    if(activeQuickView && !matchesQuickView(m, activeQuickView)) return false;
    if(statusTerm && m.status !== statusTerm) return false;
    if(!q) return true;
    const b = ALL_BUSINESSES[m.business_id];
    const l = leadById(m.buyer_id);
    const handler = userName(m.current_handler) || "";
    const hay = [
      b?.internal_name, b?.business_number, l?.full_name, l?.client_number,
      l?.phone, l?.phone2, handler
    ].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q.toLowerCase());
  });

  // Always sorted by most recently updated first — the forced default order.
  rows.sort((a,b)=> new Date(b.updated_at) - new Date(a.updated_at));

  if(rows.length===0){ wrap.innerHTML = `<div class="empty-state">לא נמצאו התאמות תואמות לסינון.</div>`; return; }

  const mostRecentId = rows[0]?.id;

  wrap.innerHTML = `<table class="match-table">
    <thead><tr>
      <th>עסק</th><th>קונה</th><th>סטטוס</th><th>מטפל</th><th>פעולה הבאה</th><th>עודכן</th><th></th>
    </tr></thead>
    <tbody>
      ${rows.map(m=>{
        const b = ALL_BUSINESSES[m.business_id];
        const l = leadById(m.buyer_id);
        const color = STATUS_COLOR[m.status] || 'gray';
        const handler = userName(m.current_handler);
        const days = daysSince(m.updated_at);
        const overdue = m.next_action_at && new Date(m.next_action_at) < new Date();
        return `<tr data-match="${m.id}" class="${m.id===mostRecentId?'updated-now':''}">
          <td data-label="עסק"><div class="mt-name">${bizLabel(m.business_id)}</div><div class="mt-sub">${esc(b?.field||'')}</div></td>
          <td data-label="קונה"><div class="mt-name">${esc(l?.full_name||'—')}</div><div class="mt-sub">${esc(l?.phone||'')} ${l?.client_number?'· '+esc(l.client_number):''}</div></td>
          <td data-label="סטטוס"><span class="chip chip-${color}">${esc(m.status||'—')}</span></td>
          <td data-label="מטפל">${handler?esc(handler):'<span class="chip chip-red">ללא מטפל</span>'}</td>
          <td data-label="פעולה הבאה">${m.next_action?esc(m.next_action):'—'}${m.next_action_at?`<div class="mt-sub ${overdue?'overdue-flag':''}">${overdue?'⏰ ':''}${fmtDate(m.next_action_at)}</div>`:''}</td>
          <td data-label="עודכן"><div class="mt-sub">${fmtDateTime(m.updated_at)}${days!==null?' · לפני '+days+' ימים':''}</div></td>
          <td data-label=""><button class="mt-action-btn" data-task="${m.id}">➕ משימת מעקב</button></td>
        </tr>`;
      }).join("")}
    </tbody>
  </table>`;

  wrap.querySelectorAll('tr[data-match]').forEach(tr=>{
    tr.addEventListener('click', (e)=>{
      if(e.target.closest('[data-task]')) return;
      location.href = 'match-detail.html?id=' + tr.dataset.match;
    });
  });
  wrap.querySelectorAll('[data-task]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openTaskModal(btn.dataset.task); });
  });
}

function openTaskModal(matchId){
  const m = ALL_MATCHES.find(x=>x.id===matchId);
  const b = ALL_BUSINESSES[m.business_id];
  const l = leadById(m.buyer_id);
  const defaultDate = m.next_action_at ? new Date(m.next_action_at).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay">
      <div class="modal">
        <div class="modal-head"><h3>➕ משימת מעקב</h3><button class="modal-close" data-close>✕</button></div>
        <div class="modal-body">
          <div class="mt-sub" style="margin-bottom:10px;">${bizLabel(m.business_id)} ⇄ ${esc(l?.full_name||'—')}</div>
          <div class="field"><label>כותרת המשימה</label><input type="text" id="taskTitle" value="${esc(m.next_action || 'מעקב אחר ההתאמה')}"></div>
          <div class="field"><label>תאריך יעד</label><input type="date" id="taskDate" value="${defaultDate}"></div>
        </div>
        <div class="modal-foot">
          <button class="btn-ghost" data-close>ביטול</button>
          <button class="btn-primary" id="saveTaskBtn">שמור והתריע לי</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click', ()=> document.getElementById('modalRoot').innerHTML=""));
  document.getElementById('saveTaskBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('taskTitle').value.trim();
    const due = document.getElementById('taskDate').value;
    if(!title){ toast('נא להזין כותרת'); return; }
    const sb = window.supabaseClient;
    const { data, error } = await sb.from('tasks').insert({
      title, due_date: due || null, match_id: m.id, business_id: m.business_id, buyer_id: m.buyer_id,
      assigned_to: CURRENT_PROFILE.id, source: 'matches_workspace'
    }).select().single();
    if(error){ toast('שגיאה בשמירת המשימה: ' + error.message); return; }
    ALL_TASKS.push(data);
    document.getElementById('modalRoot').innerHTML = "";
    toast('המשימה נשמרה ותתריע לך ביום היעד');
    buildQuickViews(); render();
  });
}

document.getElementById('searchBox').addEventListener('input', e=>{ searchTerm = e.target.value; render(); });
document.getElementById('statusFilter').addEventListener('change', e=>{ statusTerm = e.target.value; render(); });

(async function init(){
  const profile = await requireAuth();
  if(!profile) return;
  CURRENT_PROFILE = profile;
  document.getElementById('whoAmI').textContent = `מחובר: ${profile.full_name || profile.email} (${profile.role})`;
  loadEverything();
})();
</script>
</body>
</html>
