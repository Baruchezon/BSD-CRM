<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<script>
(function(){
  try{
    var PAGE_BUILD = '202609021145';
    window.PAGE_BUILD = PAGE_BUILD;
    var loopGuard = sessionStorage.getItem('bsd_ver_reload_guard');
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        var serverBuild = (v.version || '').replace(/\D/g,'');
        if (serverBuild && serverBuild !== PAGE_BUILD && loopGuard !== serverBuild){
          sessionStorage.setItem('bsd_ver_reload_guard', serverBuild);
          var url = new URL(location.href);
          url.searchParams.set('_cb', Date.now());
          location.replace(url.toString());
        }
      }).catch(function(){});
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז ההתאמות | BSD CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/searchSelect.js?v=202608281900"></script>
<style>
  :root{
    --navy:#0e1b34; --navy-light:#16264a; --gold:#c9a24b; --gold-light:#e8cf8a;
    --bg:#f6f5ef; --card:#ffffff; --text:#1c2333; --muted:#6b7280; --line:#e3ddcf;
    --c-green-bg:#e2f6ea; --c-green-fg:#166534; --c-red-bg:#fbe2df; --c-red-fg:#a32d21;
    --c-orange-bg:#fdedcf; --c-orange-fg:#95590a; --c-blue-bg:#dfeafc; --c-blue-fg:#1d4e89;
    --c-gray-bg:#e7e7ea; --c-gray-fg:#54575f; --c-purple-bg:#ede3fb; --c-purple-fg:#5b2e97;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  .topbar{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;padding:14px 20px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:40;}
  .topbar h1{margin:0;font-size:17px;}
  .topbar .sub{margin:2px 0 0;font-size:11px;color:var(--gold-light);}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .who{font-size:12px;color:var(--gold-light);}
  .back-btn,.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;font-family:inherit;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;}
  .back-btn:hover,.logout-btn:hover{background:rgba(255,255,255,0.1);}

  .toolbar{max-width:1200px;margin:14px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:10px;}
  .view-toggle{display:flex;gap:6px;}
  .view-toggle-btn{padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);}
  .view-toggle-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .search-row{display:flex;gap:8px;flex-wrap:wrap;}
  .search-row input, .search-row select{padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;background:#fff;}
  .search-row input#searchBox{flex:1;min-width:220px;}

  .quickviews{display:flex;gap:7px;flex-wrap:wrap;}
  .qv-chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text);white-space:nowrap;}
  .qv-chip .qv-count{background:var(--navy);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-inline-start:5px;}
  .qv-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .qv-chip.active .qv-count{background:var(--gold);color:var(--navy);}

  .page{max-width:1200px;margin:14px auto 40px;padding:0 16px;}
  .loading, .empty-state{text-align:center;color:var(--muted);padding:40px 20px;background:var(--card);border-radius:14px;border:1px dashed var(--line);font-size:14px;}

  .chip{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
  .chip-green{background:var(--c-green-bg);color:var(--c-green-fg);}
  .chip-red{background:var(--c-red-bg);color:var(--c-red-fg);}
  .chip-orange{background:var(--c-orange-bg);color:var(--c-orange-fg);}
  .chip-blue{background:var(--c-blue-bg);color:var(--c-blue-fg);}
  .chip-gray{background:var(--c-gray-bg);color:var(--c-gray-fg);}
  .chip-purple{background:var(--c-purple-bg);color:var(--c-purple-fg);}
  .biz-number{background:var(--navy);color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px;display:inline-block;}

  .tree-node{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 4px rgba(14,27,52,0.07);margin-bottom:12px;overflow:hidden;}
  .tree-head{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .tree-head:hover{background:#faf8f0;}
  .tree-head .th-title{font-weight:800;color:var(--navy);font-size:14.5px;display:flex;align-items:center;gap:6px;}
  .tree-head .th-stats{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .tree-head .th-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .toggle-icon{transition:transform .15s;display:inline-block;}
  .tree-node.open .toggle-icon{transform:rotate(90deg);}
  .tree-body{display:none;border-top:1px solid var(--line);padding:8px 10px;}
  .tree-node.open .tree-body{display:block;}

  .branch-row{border:1px solid var(--line);border-inline-start-width:5px;border-inline-start-style:solid;border-radius:9px;padding:9px 11px;margin-bottom:7px;background:#fff;}
  .branch-row .br-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer;}
  .branch-row .br-name{font-weight:800;color:var(--navy);font-size:13px;}
  .branch-row .br-facts{font-size:11px;color:var(--muted);margin-top:4px;}
  .branch-row .br-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}

  .mini-btn{background:#f1eee2;border:none;color:var(--text);padding:7px 11px;border-radius:7px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:32px;}
  @media(max-width:600px){
    .th-title{font-size:13.5px;}
    .th-actions .mini-btn{flex:1;min-width:0;}
    .br-actions{gap:6px;}
    .br-actions .mini-btn{flex:1 1 calc(50% - 6px);text-align:center;}
    .toolbar{padding:0 12px;}
    .page{padding:0 12px;}
  }
  .mini-btn:hover{background:var(--gold-light);}
  .btn-ghost{background:#f1eee2;color:var(--text);border:none;padding:9px 16px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-primary[disabled]{opacity:.5;cursor:not-allowed;}
  .new-match-btn{background:var(--gold);color:var(--navy);border:none;padding:8px 16px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;}
  .new-match-btn:hover{background:var(--gold-light);}
  .nm-preview{background:#f6f5ef;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.8;margin-bottom:10px;}
  .nm-preview b{color:var(--navy);}
  .overdue-flag{color:var(--c-red-fg);font-weight:800;}

  .overlay{position:fixed;inset:0;background:rgba(14,27,52,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;}
  .modal-head h3{margin:0;font-size:15px;color:var(--navy);}
  .modal-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .modal-body{padding:16px 18px;}
  .modal-foot{padding:12px 18px 18px;display:flex;gap:8px;justify-content:flex-end;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700;}
  .field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>📁 מרכז ההתאמות</h1>
    <p class="sub">העסק הוא ראש העץ - מתחתיו כל הקונים הפוטנציאליים שלו</p>
  </div>
  <div class="topbar-right">
    <button class="new-match-btn" onclick="openNewMatchModal()">➕ התאמה חדשה</button>
    <span class="who" id="whoAmI"></span>
    <a class="back-btn" href="app.html">🔙 ללוח הבקרה</a>
    <button class="logout-btn" onclick="bsdLogout()">יציאה</button>
  </div>
</div>

<div class="toolbar">
  <div class="view-toggle">
    <button class="view-toggle-btn active" data-view="business">🏢 תצוגה לפי עסקים</button>
    <button class="view-toggle-btn" data-view="buyer">🧍 תצוגה לפי קונים</button>
  </div>
  <div class="search-row">
    <input type="text" id="searchBox" placeholder="חיפוש: שם עסק, מספר, שם קונה, מספר, טלפון, מטפל, סטטוס, הערה, משימה...">
  </div>
  <div class="quickviews" id="quickviews"></div>
</div>

<div class="page" id="mainContent">
  <div class="loading">טוען נתונים…</div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
let CURRENT_PROFILE = null;
let ALL_LEADS = [], ALL_BUSINESSES = {}, ALL_MATCHES = [], ALL_PROFILES = {}, ALL_TASKS = [], ALL_ACTIVITY = [];
let searchTerm = "", activeQuickView = "", currentView = "business";
const OPEN_NODES = new Set();

const STATUS_COLOR = {
  'התאמה חדשה':'blue', 'ממתין לחתימת סודיות':'orange', 'נחתמה סודיות':'green',
  'מידע ראשוני נשלח':'blue', 'תקציר נשלח':'blue', 'חומרים מלאים נשלחו':'blue',
  'ממתין לתגובה':'orange', 'הקונה מעוניין':'green', 'הקונה לא מעוניין':'red',
  'נקבעה פגישה':'purple', 'התקיימה פגישה':'purple', 'בבדיקת נתונים':'orange',
  'במשא ומתן':'purple', 'הוקפא':'gray', 'נסגר ללא עסקה':'red', 'עסקה הושלמה':'green',
  'נדרש עדכון':'red'
};
const CLOSED_STATUSES = ['נסגר ללא עסקה','הקונה לא מעוניין','הוקפא'];

function esc(s){ return (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){ if(!iso) return "—"; const d = new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString('he-IL'); }
function fmtDateTime(iso){ if(!iso) return "—"; const d = new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString('he-IL')+" "+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.getElementById('toastRoot').appendChild(el); setTimeout(()=>el.remove(),3000); }
function userName(id){ if(!id) return null; const p = ALL_PROFILES[id]; return p ? (p.full_name||p.role) : null; }
function leadById(id){ return ALL_LEADS.find(l=>l.id===id); }

async function loadEverything(){
  const sb = window.supabaseClient;
  const [{data: leads}, {data: businesses}, {data: matches}, {data: profiles}, {data: tasks}] = await Promise.all([
    sb.from('leads').select('id,full_name,phone,phone2,client_number,agreement_status,created_by,handled_by,type,is_archived').eq('type','buyer'),
    sb.from('businesses').select('id,internal_name,business_number,field,agreement_status,created_by,handled_by,is_archived'),
    sb.from('matches').select('*'),
    sb.from('profiles').select('id,full_name,role'),
    sb.from('tasks').select('id,match_id,business_id,buyer_id,title,status,due_date,assigned_to')
  ]);
  ALL_LEADS = leads || [];
  (businesses||[]).forEach(b=> ALL_BUSINESSES[b.id]=b);
  ALL_MATCHES = matches || [];
  (profiles||[]).forEach(p=> ALL_PROFILES[p.id]=p);
  ALL_TASKS = tasks || [];
  const matchIds = ALL_MATCHES.map(m=>m.id);
  if (matchIds.length){
    const { data: activity } = await sb.from('match_activity_log').select('match_id,description,note').in('match_id', matchIds).is('deleted_at', null);
    ALL_ACTIVITY = activity || [];
  }
  buildQuickViews();
  render();
}

function matchOpenTaskCount(matchId){
  return ALL_TASKS.filter(t=>t.match_id===matchId && t.status!=='הושלמה').length;
}
function matchMatchesQuickView(m, key){
  const today = new Date(); today.setHours(0,0,0,0);
  const openTasks = ALL_TASKS.filter(t=>t.match_id===m.id && t.status!=='הושלמה' && t.due_date);
  switch(key){
    case 'today': return openTasks.some(t=>{ const d=new Date(t.due_date); d.setHours(0,0,0,0); return d.getTime()===today.getTime(); }) || (m.next_action_at && new Date(m.next_action_at).toDateString()===new Date().toDateString());
    case 'overdue': return openTasks.some(t=>{ const d=new Date(t.due_date); d.setHours(0,0,0,0); return d.getTime()<today.getTime(); }) || (m.next_action_at && new Date(m.next_action_at) < today);
    case 'waiting': return m.status === 'ממתין לתגובה';
    case 'meetings': return m.status === 'נקבעה פגישה';
    case 'negotiation': return m.status === 'במשא ומתן';
    case 'checking': return m.status === 'בבדיקת נתונים';
    case 'not_interested': return m.status === 'הקונה לא מעוניין';
    case 'done': return m.status === 'עסקה הושלמה';
    case 'active': return !CLOSED_STATUSES.includes(m.status) && m.status !== 'עסקה הושלמה';
    default: return true;
  }
}
function buildQuickViews(){
  const views = [
    {key:'', label:'הכל'}, {key:'active', label:'✅ פעילות'}, {key:'waiting', label:'💬 ממתינות לתגובה'},
    {key:'today', label:'📅 משימות להיום'}, {key:'overdue', label:'⏰ משימות באיחור'},
    {key:'meetings', label:'🤝 פגישות שנקבעו'}, {key:'checking', label:'🔎 בבדיקת נתונים'},
    {key:'negotiation', label:'📈 במשא ומתן'}, {key:'not_interested', label:'🚫 לא מעוניינים'}, {key:'done', label:'🏁 עסקאות שהושלמו'}
  ];
  const wrap = document.getElementById('quickviews');
  wrap.innerHTML = views.map(v=>{
    const count = v.key ? ALL_MATCHES.filter(m=>matchMatchesQuickView(m, v.key)).length : ALL_MATCHES.length;
    return `<button class="qv-chip ${activeQuickView===v.key?'active':''}" data-qv="${v.key}">${v.label}<span class="qv-count">${count}</span></button>`;
  }).join("");
  wrap.querySelectorAll('[data-qv]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeQuickView = btn.dataset.qv; buildQuickViews(); render(); });
  });
}

function matchSearchHay(m){
  const b = ALL_BUSINESSES[m.business_id];
  const l = leadById(m.buyer_id);
  const handler = userName(m.current_handler) || "";
  const acts = ALL_ACTIVITY.filter(a=>a.match_id===m.id).map(a=>(a.description||'')+' '+(a.note||'')).join(' ');
  const openTasks = ALL_TASKS.filter(t=>t.match_id===m.id).map(t=>t.title).join(' ');
  return [b?.internal_name, b?.business_number, l?.full_name, l?.client_number, l?.phone, l?.phone2, handler, m.status, m.notes, acts, openTasks]
    .filter(Boolean).join(" ").toLowerCase();
}

function filteredMatches(){
  const q = searchTerm.trim().toLowerCase();
  return ALL_MATCHES.filter(m=>{
    if (activeQuickView && !matchMatchesQuickView(m, activeQuickView)) return false;
    if (q && !matchSearchHay(m).includes(q)) return false;
    return true;
  });
}

function render(){ currentView === 'business' ? renderByBusiness() : renderByBuyer(); }

function branchRowHtml(m, otherPartyLabel){
  const color = STATUS_COLOR[m.status] || 'gray';
  const handler = userName(m.current_handler);
  const overdue = m.next_action_at && new Date(m.next_action_at) < new Date();
  const openTasks = matchOpenTaskCount(m.id);
  return `<div class="branch-row" style="border-inline-start-color:var(--c-${color}-fg,#888);" data-match="${m.id}">
    <div class="br-top" data-open="${m.id}">
      <span class="br-name">${otherPartyLabel}</span>
      <span class="chip chip-${color}">${esc(m.status||'—')}</span>
    </div>
    <div class="br-facts">
      מטפל: ${handler?esc(handler):'<span class="chip chip-red">ללא מטפל</span>'}
      · פעילות אחרונה: ${fmtDate(m.updated_at)}
      ${m.next_action_at?` · מעקב: <span class="${overdue?'overdue-flag':''}">${overdue?'⏰ ':''}${fmtDate(m.next_action_at)}</span>`:''}
      ${openTasks?` · ${openTasks} משימות פתוחות`:''}
    </div>
    <div class="br-actions">
      <button class="mini-btn" data-open="${m.id}">📁 פתח תיק</button>
      <button class="mini-btn" data-task="${m.id}">➕ משימה</button>
      <button class="mini-btn" data-note="${m.id}">📝 הערה</button>
      <button class="mini-btn" data-call="${m.id}">☎️ תיעוד שיחה</button>
    </div>
  </div>`;
}

function wireBranchActions(container){
  container.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); location.href='match-detail.html?id='+el.dataset.open; }));
  container.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); openQuickTaskModal(el.dataset.task); }));
  container.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); openQuickNoteModal(el.dataset.note, 'נוספה הערה'); }));
  container.querySelectorAll('[data-call]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); openQuickNoteModal(el.dataset.call, 'התקיימה שיחת טלפון'); }));
}

function renderByBusiness(){
  const wrap = document.getElementById('mainContent');
  const rows = filteredMatches();
  const bizIds = [...new Set(rows.map(m=>m.business_id))];
  if (!bizIds.length){ wrap.innerHTML = `<div class="empty-state">לא נמצאו התאמות תואמות לסינון.</div>`; return; }

  const bizStats = bizIds.map(bid=>{
    const b = ALL_BUSINESSES[bid];
    const bizMatches = rows.filter(m=>m.business_id===bid);
    const lastActivity = bizMatches.reduce((max,m)=> new Date(m.updated_at) > new Date(max) ? m.updated_at : max, bizMatches[0].updated_at);
    return {
      bid, b, matches: bizMatches,
      active: bizMatches.filter(m=>!CLOSED_STATUSES.includes(m.status) && m.status!=='עסקה הושלמה').length,
      interested: bizMatches.filter(m=>m.status==='הקונה מעוניין').length,
      meetings: bizMatches.filter(m=>m.status==='נקבעה פגישה').length,
      negotiation: bizMatches.filter(m=>m.status==='במשא ומתן').length,
      openTasks: bizMatches.reduce((s,m)=>s+matchOpenTaskCount(m.id),0),
      lastActivity
    };
  });
  bizStats.sort((a,b)=> new Date(b.lastActivity) - new Date(a.lastActivity));

  wrap.innerHTML = bizStats.map(s=>{
    const isOpen = OPEN_NODES.has('biz:'+s.bid);
    return `<div class="tree-node ${isOpen?'open':''}" data-node="biz:${s.bid}">
      <div class="tree-head" data-toggle="biz:${s.bid}">
        <div>
          <div class="th-title"><span class="toggle-icon">▶</span> 🏢 ${s.b?.business_number?`<span class="biz-number">#${esc(s.b.business_number.replace('BSD-B-',''))}</span>`:''} ${esc(s.b?.internal_name||'—')}</div>
          <div class="th-stats">
            <span>מטפל: ${esc(userName(s.b?.handled_by)||'—')}</span>
            <span>${s.matches.length} קונים</span>
            <span class="chip chip-green">${s.active} פעילות</span>
            ${s.interested?`<span class="chip chip-blue">${s.interested} מעוניינים</span>`:''}
            ${s.meetings?`<span class="chip chip-purple">${s.meetings} פגישות</span>`:''}
            ${s.negotiation?`<span class="chip chip-orange">${s.negotiation} במו"מ</span>`:''}
            ${s.openTasks?`<span class="chip chip-gray">${s.openTasks} משימות פתוחות</span>`:''}
            <span>עודכן: ${fmtDate(s.lastActivity)}</span>
          </div>
        </div>
        <div class="th-actions">
          <button class="mini-btn" data-addbuyer="${s.bid}">➕ הוסף קונה</button>
          <button class="mini-btn" data-bizreport="${s.bid}">📊 הפק דוח ללקוח</button>
        </div>
      </div>
      <div class="tree-body">
        ${s.matches.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at)).map(m=>{
          const l = leadById(m.buyer_id);
          return branchRowHtml(m, esc(l?.full_name||'—') + (l?.client_number?` <span style="color:#999;">(${esc(l.client_number)})</span>`:''));
        }).join('')}
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click', (e)=>{
    if (e.target.closest('[data-addbuyer],[data-bizreport]')) return;
    const key = el.dataset.toggle;
    OPEN_NODES.has(key) ? OPEN_NODES.delete(key) : OPEN_NODES.add(key);
    render();
  }));
  wrap.querySelectorAll('[data-addbuyer]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); openAddBuyerModal(el.dataset.addbuyer); }));
  wrap.querySelectorAll('[data-bizreport]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); location.href='business-report-builder.html?business_id='+el.dataset.bizreport; }));
  wireBranchActions(wrap);
}

function renderByBuyer(){
  const wrap = document.getElementById('mainContent');
  const rows = filteredMatches();
  const buyerIds = [...new Set(rows.map(m=>m.buyer_id))];
  if (!buyerIds.length){ wrap.innerHTML = `<div class="empty-state">לא נמצאו התאמות תואמות לסינון.</div>`; return; }

  const buyerStats = buyerIds.map(lid=>{
    const l = leadById(lid);
    const buyerMatches = rows.filter(m=>m.buyer_id===lid);
    const lastActivity = buyerMatches.reduce((max,m)=> new Date(m.updated_at) > new Date(max) ? m.updated_at : max, buyerMatches[0].updated_at);
    return {
      lid, l, matches: buyerMatches,
      active: buyerMatches.filter(m=>!CLOSED_STATUSES.includes(m.status) && m.status!=='עסקה הושלמה').length,
      meetings: buyerMatches.filter(m=>m.status==='נקבעה פגישה').length,
      openTasks: buyerMatches.reduce((s,m)=>s+matchOpenTaskCount(m.id),0),
      lastActivity
    };
  });
  buyerStats.sort((a,b)=> new Date(b.lastActivity) - new Date(a.lastActivity));

  wrap.innerHTML = buyerStats.map(s=>{
    const isOpen = OPEN_NODES.has('buyer:'+s.lid);
    return `<div class="tree-node ${isOpen?'open':''}" data-node="buyer:${s.lid}">
      <div class="tree-head" data-toggle="buyer:${s.lid}">
        <div>
          <div class="th-title"><span class="toggle-icon">▶</span> 🧍 ${esc(s.l?.full_name||'—')} ${s.l?.client_number?`<span class="chip chip-gray">${esc(s.l.client_number)}</span>`:''}</div>
          <div class="th-stats">
            <span>מטפל: ${esc(userName(s.l?.handled_by)||'—')}</span>
            <span>${s.matches.length} עסקים</span>
            <span class="chip chip-green">${s.active} פעילות</span>
            ${s.meetings?`<span class="chip chip-purple">${s.meetings} פגישות</span>`:''}
            ${s.openTasks?`<span class="chip chip-gray">${s.openTasks} משימות פתוחות</span>`:''}
            <span>עודכן: ${fmtDate(s.lastActivity)}</span>
          </div>
        </div>
        <div class="th-actions">
          <button class="mini-btn" data-addbiz="${s.lid}">➕ הוסף עסק</button>
          <button class="mini-btn" data-buyerreport="${s.lid}">📊 דוח לקונה</button>
        </div>
      </div>
      <div class="tree-body">
        ${s.matches.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at)).map(m=>{
          const b = ALL_BUSINESSES[m.business_id];
          const bizLabel = (b?.business_number?`<span class="biz-number">#${esc(b.business_number.replace('BSD-B-',''))}</span> `:'') + esc(b?.internal_name||'—');
          return branchRowHtml(m, bizLabel);
        }).join('')}
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click', (e)=>{
    if (e.target.closest('[data-addbiz],[data-buyerreport]')) return;
    const key = el.dataset.toggle;
    OPEN_NODES.has(key) ? OPEN_NODES.delete(key) : OPEN_NODES.add(key);
    render();
  }));
  wrap.querySelectorAll('[data-addbiz]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); location.href='leads.html?open='+el.dataset.addbiz; }));
  wrap.querySelectorAll('[data-buyerreport]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); location.href='leads.html?open='+el.dataset.buyerreport; }));
  wireBranchActions(wrap);
}

async function openAddBuyerModal(bizId){
  const biz = ALL_BUSINESSES[bizId];
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay"><div class="modal">
      <div class="modal-head"><h3>➕ הוסף קונה — ${esc(biz?.internal_name||'')}</h3><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body">
        <div class="field"><label>בחר קונה</label><div id="addBuyerBox">טוען...</div></div>
        <div id="addBuyerStatus" style="min-height:20px;font-size:13px;font-weight:600;"></div>
      </div>
      <div class="modal-foot"><button class="btn-ghost" data-close>ביטול</button><button class="btn-primary" id="addBuyerBtn" onclick="confirmAddBuyer('${bizId}')">➕ צור התאמה</button></div>
    </div></div>`;
  document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click', ()=> document.getElementById('modalRoot').innerHTML=""));
  const box = document.getElementById('addBuyerBox');
  box.innerHTML = window.searchSelectHTML({ boxId: 'addBuyerSelect', placeholder: 'הקלד שם קונה לחיפוש...' });
  window.initSearchSelect('addBuyerSelect', ALL_LEADS.filter(l=>!l.is_archived), {
    getId: b => b.id,
    getLabel: b => (b.full_name||'קונה ללא שם') + (b.client_number?' ('+b.client_number+')':''),
    onChange: (id)=>{ window.WS_SELECTED_BUYER = ALL_LEADS.find(l=>l.id===id) || null; }
  });
}
async function confirmAddBuyer(bizId){
  const buyer = window.WS_SELECTED_BUYER;
  const statusBox = document.getElementById('addBuyerStatus');
  if (!buyer){ statusBox.style.color='#b3402c'; statusBox.textContent='יש לבחור קונה'; return; }
  try {
    const { data: existing } = await window.supabaseClient.from('matches').select('id,status').eq('business_id', bizId).eq('buyer_id', buyer.id).maybeSingle();
    if (existing){
      statusBox.style.color = '#8a5a00';
      statusBox.innerHTML = `כבר קיימת התאמה (סטטוס: ${esc(existing.status)}). <a href="match-detail.html?id=${existing.id}" style="color:#1d4e89;font-weight:700;">פתח אותה</a>`;
      return;
    }
    const { data: newMatch, error } = await window.supabaseClient.from('matches')
      .insert({ business_id: bizId, buyer_id: buyer.id, status: 'התאמה חדשה', match_source: 'ידני - מרכז ההתאמות', created_by: CURRENT_PROFILE.id })
      .select('id').single();
    if (error) throw new Error(error.message);
    document.getElementById('modalRoot').innerHTML = '';
    toast('ההתאמה נוצרה בהצלחה');
    location.href = 'match-detail.html?id=' + newMatch.id;
  } catch(e){ statusBox.style.color='#b3402c'; statusBox.textContent = 'שגיאה: ' + (e.message||String(e)); }
}

// ➕ התאמה חדשה — כפתור עליון במרכז ההתאמות (לא תלוי בעץ פתוח מראש):
// בחירת קונה קיים + עסק קיים משני קצות, בדיקת כפילות זהה לחלוטין למנגנון
// הקיים (openAddBuyerModal כאן ו-confirmAddBizToMatch ב-leads.html), אותה
// טבלת matches, אותו סטטוס ברירת מחדל, אותה התנהגות פתיחה לאחר שמירה.
function updateNewMatchUI(){
  const buyer = window.NM_SELECTED_BUYER, biz = window.NM_SELECTED_BIZ;
  const preview = document.getElementById('nmPreview');
  const btn = document.getElementById('nmSaveBtn');
  document.getElementById('nmStatus').textContent = '';
  if (!buyer || !biz){
    preview.style.display = 'none';
    if (btn) btn.disabled = true;
    return;
  }
  preview.style.display = 'block';
  preview.innerHTML = `
    <div>🧍 קונה: <b>${esc(buyer.full_name||'—')}</b>${buyer.client_number?' ('+esc(buyer.client_number)+')':''}</div>
    <div>📄 מצב הסכם קונה: <b>${esc(buyer.agreement_status||'אין הסכם')}</b></div>
    <div>🏢 עסק: <b>${esc(biz.internal_name||'—')}</b></div>
    <div>מספר עסק: <b>${esc(biz.business_number||'טרם הוקצה')}</b></div>`;
  if (btn) btn.disabled = false;
}
function openNewMatchModal(){
  window.NM_SELECTED_BUYER = null;
  window.NM_SELECTED_BIZ = null;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay"><div class="modal">
      <div class="modal-head"><h3>➕ התאמה חדשה</h3><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body">
        <div class="field"><label>בחר קונה</label><div id="nmBuyerBox"></div></div>
        <div class="field"><label>בחר עסק</label><div id="nmBizBox"></div></div>
        <div class="nm-preview" id="nmPreview" style="display:none;"></div>
        <div id="nmStatus" style="min-height:20px;font-size:13px;font-weight:600;"></div>
      </div>
      <div class="modal-foot"><button class="btn-ghost" data-close>ביטול</button><button class="btn-primary" id="nmSaveBtn" disabled onclick="confirmNewMatch()">➕ צור התאמה</button></div>
    </div></div>`;
  document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click', ()=> document.getElementById('modalRoot').innerHTML=""));
  document.getElementById('nmBuyerBox').innerHTML = window.searchSelectHTML({ boxId: 'nmBuyerSelect', placeholder: 'הקלד שם קונה לחיפוש...' });
  window.initSearchSelect('nmBuyerSelect', ALL_LEADS.filter(l=>!l.is_archived), {
    getId: b => b.id,
    getLabel: b => (b.full_name||'קונה ללא שם') + (b.client_number?' ('+b.client_number+')':''),
    onChange: (id)=>{ window.NM_SELECTED_BUYER = ALL_LEADS.find(l=>l.id===id) || null; updateNewMatchUI(); }
  });
  document.getElementById('nmBizBox').innerHTML = window.searchSelectHTML({ boxId: 'nmBizSelect', placeholder: 'הקלד שם עסק או מספר עסק לחיפוש...' });
  const bizList = Object.values(ALL_BUSINESSES).filter(b=>!b.is_archived);
  window.initSearchSelect('nmBizSelect', bizList, {
    getId: b => b.id,
    getLabel: b => (b.internal_name||'עסק ללא שם') + (b.business_number?' ('+b.business_number+')':'') + (b.field?' - '+b.field:''),
    onChange: (id)=>{ window.NM_SELECTED_BIZ = ALL_BUSINESSES[id] || null; updateNewMatchUI(); }
  });
}
async function confirmNewMatch(){
  const buyer = window.NM_SELECTED_BUYER, biz = window.NM_SELECTED_BIZ;
  const statusBox = document.getElementById('nmStatus');
  if (!buyer || !biz){ statusBox.style.color='#b3402c'; statusBox.textContent='יש לבחור גם קונה וגם עסק'; return; }
  const btn = document.getElementById('nmSaveBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'בודק...'; }
  try {
    const { data: existing, error: existErr } = await window.supabaseClient
      .from('matches').select('id,status').eq('business_id', biz.id).eq('buyer_id', buyer.id).maybeSingle();
    if (existErr) throw new Error(existErr.message);
    if (existing){
      statusBox.style.color = '#8a5a00';
      statusBox.innerHTML = `כבר קיימת התאמה בין הקונה לעסק הזה (סטטוס: ${esc(existing.status||'—')}). <a href="javascript:void(0)" onclick="location.href='match-detail.html?id=${existing.id}'" style="color:#1d4e89;font-weight:700;">פתח את ההתאמה הקיימת</a>`;
      if (btn){ btn.disabled = false; btn.textContent = '➕ צור התאמה'; }
      return;
    }
    const { data: newMatch, error: insErr } = await window.supabaseClient
      .from('matches').insert({ business_id: biz.id, buyer_id: buyer.id, status: 'התאמה חדשה', match_source: 'ידני - מרכז ההתאמות', created_by: CURRENT_PROFILE.id })
      .select('*').single();
    if (insErr) throw new Error(insErr.message);
    ALL_MATCHES.push(newMatch);
    document.getElementById('modalRoot').innerHTML = '';
    toast('ההתאמה נוצרה בהצלחה');
    buildQuickViews(); render();
    location.href = 'match-detail.html?id=' + newMatch.id;
  } catch(e){
    statusBox.style.color='#b3402c';
    statusBox.textContent = 'שגיאה ביצירת ההתאמה: ' + (e.message||String(e));
    if (btn){ btn.disabled = false; btn.textContent = '➕ צור התאמה'; }
  }
}

function openQuickTaskModal(matchId){
  const m = ALL_MATCHES.find(x=>x.id===matchId);
  const defaultDate = m.next_action_at ? new Date(m.next_action_at).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay"><div class="modal">
      <div class="modal-head"><h3>➕ משימה חדשה</h3><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body">
        <div class="field"><label>כותרת</label><input type="text" id="qtTitle" value="${esc(m.next_action || 'מעקב אחר ההתאמה')}"></div>
        <div class="field"><label>תאריך יעד</label><input type="date" id="qtDate" value="${defaultDate}"></div>
      </div>
      <div class="modal-foot"><button class="btn-ghost" data-close>ביטול</button><button class="btn-primary" onclick="saveQuickTask('${matchId}')">שמור</button></div>
    </div></div>`;
  document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click', ()=> document.getElementById('modalRoot').innerHTML=""));
}
async function saveQuickTask(matchId){
  const m = ALL_MATCHES.find(x=>x.id===matchId);
  const title = document.getElementById('qtTitle').value.trim();
  const due = document.getElementById('qtDate').value;
  if (!title){ toast('נא להזין כותרת'); return; }
  const { data, error } = await window.supabaseClient.from('tasks').insert({
    title, due_date: due||null, match_id: m.id, business_id: m.business_id, buyer_id: m.buyer_id,
    assigned_to: CURRENT_PROFILE.id, source: 'matches_workspace'
  }).select().single();
  if (error){ toast('שגיאה: '+error.message); return; }
  ALL_TASKS.push(data);
  document.getElementById('modalRoot').innerHTML = '';
  toast('המשימה נשמרה');
  buildQuickViews(); render();
}

function openQuickNoteModal(matchId, defaultAction){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay"><div class="modal">
      <div class="modal-head"><h3>${defaultAction==='התקיימה שיחת טלפון'?'☎️ תיעוד שיחה':'📝 הוספת הערה'}</h3><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body">
        <div class="field"><label>תיאור</label><textarea id="qnText" rows="4" placeholder="מה נאמר / מה קרה..."></textarea></div>
      </div>
      <div class="modal-foot"><button class="btn-ghost" data-close>ביטול</button><button class="btn-primary" onclick="saveQuickNote('${matchId}','${defaultAction}')">שמור</button></div>
    </div></div>`;
  document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click', ()=> document.getElementById('modalRoot').innerHTML=""));
}
async function saveQuickNote(matchId, actionType){
  const text = document.getElementById('qnText').value.trim();
  const { error } = await window.supabaseClient.from('match_activity_log').insert({
    match_id: matchId, action_type: actionType, description: text || actionType, performed_by: CURRENT_PROFILE.id
  });
  if (error){ toast('שגיאה: '+error.message); return; }
  await window.supabaseClient.from('matches').update({ last_action: actionType, last_action_at: new Date().toISOString() }).eq('id', matchId);
  document.getElementById('modalRoot').innerHTML = '';
  toast('נשמר בהצלחה');
  const m = ALL_MATCHES.find(x=>x.id===matchId); if (m) m.updated_at = new Date().toISOString();
  render();
}

document.querySelectorAll('.view-toggle-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentView = btn.dataset.view;
    document.querySelectorAll('.view-toggle-btn').forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });
});
document.getElementById('searchBox').addEventListener('input', e=>{ searchTerm = e.target.value; render(); });

(async function init(){
  const profile = await requireAuth();
  if (!profile) return;
  CURRENT_PROFILE = profile;
  document.getElementById('whoAmI').textContent = `מחובר: ${profile.full_name || profile.email} (${profile.role})`;
  loadEverything();
})();
</script>
