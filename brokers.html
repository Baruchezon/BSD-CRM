<!DOCTYPE html>

<script>
(function(){
  try{
    var PAGE_BUILD = '202609032230';
    window.PAGE_BUILD = PAGE_BUILD;
    var loopGuard = sessionStorage.getItem('bsd_ver_reload_guard');
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        var serverBuild = (v.version || '').replace(/\D/g,'');
        if (serverBuild && serverBuild !== PAGE_BUILD && loopGuard !== serverBuild){
          sessionStorage.setItem('bsd_ver_reload_guard', serverBuild);
          var url = new URL(location.href);
          url.searchParams.set('_cb', Date.now());
          location.replace(url.toString());
        }
      })
      .catch(function(){});
  } catch(e){}
})();
</script>

<style>
  .wrap{padding:24px 28px 60px;max-width:1300px;margin:0 auto;}
  .nav{display:flex;gap:6px;flex-wrap:wrap;}
  .nav a{color:#cfd6e6;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:.85rem;}
  .nav a.active{background:rgba(255,255,255,.12);color:#fff;font-weight:700;}
  .nav a:hover{color:#fff;}

  .back-bar{margin-bottom:14px;}
  .back-bar a{display:inline-flex;align-items:center;gap:6px;color:var(--navy);text-decoration:none;font-size:.85rem;font-weight:700;border:1px solid #d8d3c4;border-radius:8px;padding:7px 14px;background:#fff;}
  .back-bar a:hover{background:#f7f5ee;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .toolbar h2{margin:0;color:var(--navy);font-size:1.3rem;}
  .add-btns{display:flex;gap:8px;}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-family:inherit;font-size:.85rem;cursor:pointer;font-weight:700;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-broker{background:#7a3fd1;color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:#fff;border:1px solid #d8d3c4;color:var(--navy);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .filters input, .filters select{padding:9px 12px;border:1px solid #d8d3c4;border-radius:8px;font-family:inherit;font-size:.85rem;}
  .filters input[type=text]{min-width:220px;}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 8px 20px rgba(14,27,52,.10), 0 2px 6px rgba(14,27,52,.06);}
  thead th{background:var(--navy);color:#fff;padding:12px 14px;font-size:.8rem;text-align:right;white-space:nowrap;}
  tbody td{padding:11px 14px;border-bottom:1px solid #f0ede4;font-size:.85rem;}
  tbody tr:hover{background:#faf8f2;}
  tbody tr.row-signed{background:#16a34a !important;border-right:10px solid #0b5e29;}
  tbody tr.row-signed td{color:#fff !important;font-weight:700;}
  tbody tr.row-signed:hover{background:#128a3e !important;}
  tbody tr.row-sent{background:#fdeaea !important;border-right:10px solid #e08a80;}
  tbody tr.row-sent td{color:#8a2c1f !important;font-weight:600;}
  tbody tr.row-sent:hover{background:#fbdada !important;}
  .row-menu-btn{border:1.5px solid #d8d3c4;background:#f7f5ee;color:#333;cursor:pointer;font-size:1.1rem;font-weight:700;padding:2px 8px;border-radius:8px;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .row-menu-btn:hover{background:#eee8d8;}
  .row-actions-menu{display:none;position:absolute;top:100%;right:0;margin-top:4px;background:#152645;border:1px solid rgba(255,255,255,.15);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.45);min-width:180px;z-index:70;overflow:hidden;}
  .row-actions-menu a{display:block;color:#fff;text-decoration:none;padding:11px 16px;font-size:.85rem;border-top:1px solid rgba(255,255,255,.08);}
  .row-actions-menu a:first-child{border-top:none;}
  .proportional-table{table-layout:fixed;min-width:1050px;}
  .proportional-table th, .proportional-table td{overflow-wrap:break-word;}
  @media (max-width: 700px){ .proportional-table{table-layout:auto;min-width:0;} }
  .empty-row td{text-align:center;color:#999;padding:30px;}
  .primary-name{font-weight:700;color:var(--navy);}
  .looking-cell{white-space:normal;word-break:break-word;max-width:320px;line-height:1.4;color:#555;}

  /* Badge - "מתווך / סוכן": בולט ועקבי, זהה לכל מקום אחר שבו יופיע המתווך במערכת */
  .broker-badge{display:inline-flex;align-items:center;gap:4px;background:#7a3fd1;color:#fff;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:12px;letter-spacing:.2px;white-space:nowrap;}
  .agr-badge{padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;white-space:nowrap;}
  .agr-none{background:#f1f1f1;color:#777;}
  .agr-sent{background:#fdeccb;color:#8a5a10;}
  .agr-signed{background:#dff0e4;color:#245c40;}
  .status-active{background:#dff0e4;color:#245c40;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;}
  .status-blocked{background:#fdeceb;color:#8a2c1f;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;}

  .overlay{position:fixed;inset:0;background:rgba(14,27,52,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:50;padding:40px 20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .modal h3{margin:0 0 18px;color:var(--navy);border-right:4px solid var(--gold);padding-right:10px;display:flex;align-items:center;gap:10px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid .full{grid-column:1/3;}
  .field label{display:block;font-size:.78rem;color:#666;margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid #d8d3c4;border-radius:8px;font-family:inherit;font-size:.85rem;}
  .field textarea{resize:vertical;min-height:60px;}
  .section-h{grid-column:1/3;font-size:.8rem;font-weight:700;color:var(--gold);margin:10px 0 -4px;text-transform:uppercase;letter-spacing:.5px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .doc-log-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid #f0ede4;font-size:.8rem;}
  .doc-log-row:last-child{border-bottom:none;}
  @media (max-width:640px){
    .overlay{padding:0;align-items:stretch;}
    .modal{max-width:100%;width:100%;min-height:100%;border-radius:0;padding:16px 14px 100px;}
    .modal h3{margin:0 0 8px;font-size:1.1rem;}
    .form-grid{gap:8px;}
    .section-h{margin:6px 0 -2px;}
    .modal-actions{position:fixed;bottom:0;right:0;left:0;background:#fff;padding:12px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.12);margin-top:0;z-index:5;}
  }
</style>

<script>
let ALL_BROKERS = [];
let ARCHIVED_BROKERS = [];
let ALL_USERS = [];
let CURRENT_PROFILE = null;
let DOC_COUNT_BY_BROKER = {};   // broker_id -> מספר שליחות בפועל (broker_document_log)
let VIEW_MODE = 'active';

function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleDateString('he-IL'); }catch(e){ return iso; } }
function fmtDateTime(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleString('he-IL'); }catch(e){ return iso; } }
function toast(msg){
  let box = document.getElementById('toastBox');
  if (!box){
    box = document.createElement('div');
    box.id = 'toastBox';
    box.style.cssText = 'position:fixed;bottom:24px;left:24px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:380px;';
    document.body.appendChild(box);
  }
  const isError = /שגיאה|error/i.test(msg);
  const el = document.createElement('div');
  el.style.cssText = `background:${isError ? '#b00020' : 'var(--navy,#0e1b34)'};color:#fff;padding:14px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:flex-start;gap:10px;line-height:1.5;`;
  const textSpan = document.createElement('span');
  textSpan.style.flex = '1';
  textSpan.textContent = msg;
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '×';
  closeBtn.style.cssText = 'background:none;border:none;color:#fff;font-size:1.1rem;cursor:pointer;line-height:1;padding:0;';
  closeBtn.onclick = () => el.remove();
  el.appendChild(textSpan);
  el.appendChild(closeBtn);
  box.appendChild(el);
  setTimeout(()=>{ if (el.parentElement) el.remove(); }, isError ? 8000 : 3500);
}

// --- כפתור חזרה: קורא ?from= בדיוק כמו הדפוס הקיים ב-leads-hub/leads/businesses ---
function renderBackBar(){
  const params = new URLSearchParams(location.search);
  const from = params.get('from');
  const backBar = document.getElementById('backBar');
  if (!from){ backBar.style.display = 'none'; return; }
  const map = { 'leads-hub': 'leads-hub.html', 'app': 'app.html', 'businesses': 'businesses.html', 'leads': 'leads.html', 'matches-workspace': 'matches-workspace.html' };
  const target = map[from] || 'app.html';
  backBar.innerHTML = `<a href="${esc(target)}">← חזרה</a>`;
  backBar.style.display = 'block';
}

// --- הרשאות (מראה בדיוק את מדיניות ה-RLS בסופאבייס, כך שהממשק לא "מבטיח" יותר ממה שהשרת יאפשר בפועל) ---
function isBrokerViewer(){
  return !!CURRENT_PROFILE && ['admin','manager','agent_authorized'].includes(CURRENT_PROFILE.role);
}
function canEditBroker(b){
  if (!CURRENT_PROFILE) return false;
  if (['admin','manager'].includes(CURRENT_PROFILE.role)) return true;
  if (!b) return isBrokerViewer(); // יצירת מתווך חדש
  return b.created_by === CURRENT_PROFILE.id || b.handled_by === CURRENT_PROFILE.id;
}
function canDeleteBroker(){
  return !!CURRENT_PROFILE && ['admin','manager'].includes(CURRENT_PROFILE.role);
}

function brokerBadge(){
  return `<span class="broker-badge">🔵 מתווך / סוכן</span>`;
}
function agreementBadgeHtml(status){
  const s = status || 'אין הסכם';
  const cls = s === 'יש הסכם חתום' ? 'agr-signed' : s === 'נשלח הסכם לחתימה' ? 'agr-sent' : 'agr-none';
  return `<span class="agr-badge ${cls}">${esc(s)}</span>`;
}
function statusBadgeHtml(status){
  return status === 'חסום' ? `<span class="status-blocked">🚫 חסום</span>` : `<span class="status-active">✅ פעיל</span>`;
}

async function logBrokerAudit(brokerId, actionType, oldValue, newValue, details){
  try{
    await window.supabaseClient.from('broker_audit_log').insert({
      broker_id: brokerId, action_type: actionType, actor_id: CURRENT_PROFILE.id,
      old_value: oldValue || null, new_value: newValue || null, details: details || null
    });
  }catch(e){ console.error('[logBrokerAudit] שגיאה (לא חוסם את הפעולה עצמה):', e); }
}

function userName(id){
  const u = ALL_USERS.find(x=>x.id===id);
  return u ? (u.full_name || [u.first_name,u.last_name].filter(Boolean).join(' ') || u.email) : '—';
}
function userOptions(selected){
  return ALL_USERS.map(u => `<option value="${u.id}" ${u.id===selected?'selected':''}>${esc(u.full_name || [u.first_name,u.last_name].filter(Boolean).join(' ') || u.email)}</option>`).join('');
}
function fieldRow(id,label,value,type='text'){
  return `<div class="field"><label>${label}</label><input type="${type}" id="${id}" value="${esc(value??'')}"></div>`;
}
function textareaRow(id,label,value,minHeight){
  return `<div class="field full"><label>${label}</label><textarea id="${id}" style="min-height:${minHeight||70}px;">${esc(value??'')}</textarea></div>`;
}

async function setViewMode(mode){
  VIEW_MODE = mode;
  document.getElementById('viewActiveBtn').className = mode==='active' ? 'btn btn-primary' : 'btn btn-ghost';
  document.getElementById('viewArchiveBtn').className = mode==='archive' ? 'btn btn-primary' : 'btn btn-ghost';
  if (mode==='archive' && ARCHIVED_BROKERS.length===0){ await loadArchivedBrokers(); }
  renderTable();
}

async function loadBrokers(){
  const { data, error } = await window.supabaseClient
    .from('brokers').select('*').eq('is_archived', false).order('updated_at', { ascending:false });
  if (error){ toast('שגיאה בטעינת מתווכים: ' + error.message); return; }
  ALL_BROKERS = data || [];
  await loadDocCounts();
  renderTable();
}
async function loadArchivedBrokers(){
  const { data, error } = await window.supabaseClient
    .from('brokers').select('*').eq('is_archived', true).order('archived_at', { ascending:false });
  if (error){ toast('שגיאה בטעינת ארכיון מתווכים: ' + error.message); return; }
  ARCHIVED_BROKERS = data || [];
}
async function loadDocCounts(){
  DOC_COUNT_BY_BROKER = {};
  if (!ALL_BROKERS.length) return;
  const ids = ALL_BROKERS.map(b=>b.id);
  const { data } = await window.supabaseClient.from('broker_document_log').select('broker_id').in('broker_id', ids);
  (data||[]).forEach(r => { DOC_COUNT_BY_BROKER[r.broker_id] = (DOC_COUNT_BY_BROKER[r.broker_id]||0)+1; });
}

function renderTable(){
  const list = VIEW_MODE==='archive' ? ARCHIVED_BROKERS : ALL_BROKERS;
  const search = (document.getElementById('fSearch').value||'').trim().toLowerCase();
  const fStatus = document.getElementById('fStatus').value;
  const fAgreement = document.getElementById('fAgreement').value;
  const fActivity = document.getElementById('fActivity').value;

  let filtered = list.filter(b => {
    if (fStatus!=='all' && b.status!==fStatus) return false;
    if (fAgreement!=='all' && (b.agreement_status||'אין הסכם')!==fAgreement) return false;
    const docCount = DOC_COUNT_BY_BROKER[b.id]||0;
    if (fActivity==='with' && docCount===0) return false;
    if (fActivity==='without' && docCount>0) return false;
    if (search){
      const name = (b.full_name || [b.first_name,b.last_name].filter(Boolean).join(' ')).toLowerCase();
      const hay = [name, b.phone, b.email, b.city, b.looking_for].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const body = document.getElementById('brokersBody');
  if (!filtered.length){
    body.innerHTML = `<tr class="empty-row"><td colspan="8">${VIEW_MODE==='archive' ? 'אין מתווכים בארכיון' : 'אין מתווכים תואמים'}</td></tr>`;
    return;
  }
  body.innerHTML = filtered.map(b => {
    const name = b.full_name || [b.first_name,b.last_name].filter(Boolean).join(' ') || '(ללא שם)';
    const docCount = DOC_COUNT_BY_BROKER[b.id]||0;
    const agrStatus = b.agreement_status || 'אין הסכם';
    const rowCls = agrStatus === 'יש הסכם חתום' ? 'row-signed' : (agrStatus === 'נשלח הסכם לחתימה' ? 'row-sent' : '');
    const canEdit = canEditBroker(b);
    const canDelete = canDeleteBroker() && !b.is_archived;
    const canSendAgr = canEdit && agrStatus !== 'יש הסכם חתום';
    return `<tr class="${rowCls}" style="cursor:pointer;" onclick="openBrokerForm('${b.id}')">
      <td>
        <div style="display:flex;align-items:flex-start;gap:8px;">
          <div style="position:relative;flex-shrink:0;" onclick="event.stopPropagation()">
            <button type="button" class="row-menu-btn" onclick="toggleFormsMenu(event)" title="פעולות">⋮</button>
            <div class="row-actions-menu bsd-forms-menu">
              <a href="javascript:void(0)" onclick="openBrokerForm('${b.id}')">${canEdit ? '✏️ ערוך' : '👁️ צפייה'}</a>
              ${canSendAgr ? `<a href="javascript:void(0)" onclick="sendAgreementForBroker('${b.id}')">📄 שלח הסכם</a>` : ''}
              ${canDelete ? `<a href="javascript:void(0)" onclick="archiveBroker('${b.id}')" style="color:#ffb4b4;">🗑️ מחק</a>` : ''}
            </div>
          </div>
          <div><div class="primary-name">${esc(name)}</div>${brokerBadge()}</div>
        </div>
      </td>
      <td>${esc(b.phone||'—')}</td>
      <td>${esc(b.email||'—')}</td>
      <td>${esc(b.city||'—')}</td>
      <td class="looking-cell">${esc(b.looking_for||'—')}</td>
      <td>${agreementBadgeHtml(b.agreement_status)}</td>
      <td>${statusBadgeHtml(b.status)}</td>
      <td style="text-align:center;font-weight:700;">${docCount}</td>
    </tr>`;
  }).join('');
}

// --- כרטיס מתווך (יצירה/עריכה) ---
function openBrokerForm(id){
  const b = id ? [...ALL_BROKERS, ...ARCHIVED_BROKERS].find(x=>x.id===id) : null;
  if (b && !isBrokerViewer()){ toast('אין לך הרשאה לצפות בכרטיס מתווך'); return; }
  if (!b && !canEditBroker(null)){ toast('אין לך הרשאה ליצור מתווך חדש'); return; }
  const editable = canEditBroker(b);

  const modal = document.getElementById('modalBox');
  modal.innerHTML = `
    <h3>${b ? 'עריכת מתווך' : 'הוספת מתווך'} ${brokerBadge()}</h3>
    ${b && b.status==='חסום' ? `<div style="background:#fdeceb;border:1px solid #e08a80;border-radius:8px;padding:10px 12px;font-size:.82rem;color:#8a2c1f;margin-bottom:10px;">🚫 <b>מתווך חסום</b> — לא ניתן לבחור אותו כנמען חדש לשליחת חומר.</div>` : ''}
    ${b ? `<div class="field full" style="background:#f7f5ef;border-radius:8px;padding:10px 12px;font-size:.8rem;color:#665;">הוזן ע"י: <b>${esc(userName(b.created_by))}</b> בתאריך ${fmtDate(b.created_at)}</div>` : ''}
    <form id="brokerForm">
      <div class="form-grid">
        <div class="field"><label>מטפל כרגע</label><select id="handled_by" ${editable?'':'disabled'}>${userOptions(b?.handled_by)}</select></div>
        <div class="section-h">פרטי קשר</div>
        ${fieldRow('first_name','שם פרטי *', b?.first_name)}
        ${fieldRow('last_name','שם משפחה *', b?.last_name)}
        ${fieldRow('phone','טלפון *', b?.phone)}
        ${fieldRow('email','דוא"ל', b?.email, 'email')}
        ${fieldRow('city','עיר מגורים', b?.city)}
        ${fieldRow('address','כתובת', b?.address)}
        <div class="section-h">אודות</div>
        ${textareaRow('short_note','כמה מילים עליו', b?.short_note, 50)}
        <div class="field full" style="background:#f7f0ff;border:1px solid #e0cdfa;border-radius:8px;padding:10px 12px;">
          <label style="font-weight:700;color:#5a2f9e;">🔎 מה המתווך מחפש</label>
          <textarea id="looking_for" style="min-height:80px;">${esc(b?.looking_for||'')}</textarea>
        </div>
        ${textareaRow('notes','הערות חופשיות', b?.notes, 90)}
        <div class="section-h">הסכם וסטטוס</div>
        <div class="field"><label>סטטוס הסכם</label>
          <select id="agreement_status" ${editable?'':'disabled'}>
            <option value="אין הסכם" ${(!b?.agreement_status || b.agreement_status==='אין הסכם')?'selected':''}>אין הסכם</option>
            <option value="נשלח הסכם לחתימה" ${b?.agreement_status==='נשלח הסכם לחתימה'?'selected':''}>הסכם נשלח לחתימה</option>
            <option value="יש הסכם חתום" ${b?.agreement_status==='יש הסכם חתום'?'selected':''}>יש הסכם חתום</option>
          </select>
          ${(b && editable && b.agreement_status !== 'יש הסכם חתום') ? `<button type="button" class="btn btn-ghost" style="margin-top:6px;font-size:.78rem;padding:5px 12px;" onclick="sendAgreementForBroker('${b.id}')">📄 שלח הסכם</button>` : ''}
        </div>
        <div class="field"><label>סטטוס מתווך</label>
          <select id="broker_status" ${['admin','manager'].includes(CURRENT_PROFILE?.role) ? '' : 'disabled'}>
            <option value="פעיל" ${(!b?.status || b.status==='פעיל')?'selected':''}>פעיל</option>
            <option value="חסום" ${b?.status==='חסום'?'selected':''}>חסום</option>
          </select>
        </div>
        ${b ? `<div class="field full"><label>עסקים ומסמכים שהועברו</label><div id="brokerDocLogBox" style="border:1px solid #e5e1d5;border-radius:8px;max-height:220px;overflow-y:auto;">טוען...</div></div>` : ''}
      </div>
      <div class="modal-actions">
        ${(b && canDeleteBroker() && !b.is_archived) ? `<button type="button" class="btn btn-ghost" style="color:#a33;margin-left:auto;" onclick="archiveBroker('${b.id}')">📁 העבר לארכיון</button>` : ''}
        ${(b && b.is_archived && canDeleteBroker()) ? `<button type="button" class="btn btn-ghost" onclick="restoreBroker('${b.id}')">↩️ שחזר מהארכיון</button>` : ''}
        <button type="button" class="btn btn-ghost" onclick="closeModal()">ביטול</button>
        ${editable ? `<button type="button" class="btn btn-primary" onclick="saveBroker('${b?b.id:''}')">שמור</button>` : ''}
      </div>
    </form>`;
  document.getElementById('overlay').classList.add('open');
  if (b) loadBrokerDocLog(b.id);
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }

async function loadBrokerDocLog(brokerId){
  const box = document.getElementById('brokerDocLogBox');
  if (!box) return;
  const { data, error } = await window.supabaseClient
    .from('broker_document_log')
    .select('id, business_id, business_number, file_name, document_type, channel, sent_by, sent_at, businesses(internal_name, business_number)')
    .eq('broker_id', brokerId).order('sent_at', { ascending:false });
  if (error){ box.innerHTML = `<div style="padding:10px;color:#a33;font-size:.8rem;">שגיאה בטעינת היסטוריה: ${esc(error.message)}</div>`; return; }
  if (!data || !data.length){ box.innerHTML = `<div style="padding:14px;color:#999;font-size:.8rem;text-align:center;">אין עדיין עסקים או מסמכים שהועברו למתווך זה</div>`; return; }
  box.innerHTML = data.map(r => {
    const bizName = r.businesses?.internal_name || '—';
    const bizNum = r.businesses?.business_number || r.business_number || '';
    const channelLabel = r.channel==='whatsapp' ? '📱 WhatsApp' : '📧 מייל';
    return `<div class="doc-log-row">
      <div><b>${esc(bizName)}</b>${bizNum ? ' ('+esc(bizNum)+')' : ''}<br><span style="color:#888;">${esc(r.file_name||r.document_type||'מסמך')}</span></div>
      <div style="text-align:left;white-space:nowrap;">${channelLabel}<br><span style="color:#888;">${fmtDateTime(r.sent_at)}</span><br><span style="color:#888;">ע"י ${esc(userName(r.sent_by))}</span></div>
    </div>`;
  }).join('');
}

async function saveBroker(id){
  const first_name = document.getElementById('first_name').value.trim();
  const last_name = document.getElementById('last_name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if (!first_name || !last_name || !phone){ toast('שגיאה: שם פרטי, שם משפחה וטלפון הם שדות חובה'); return; }

  // אזהרת כפילות (לא חוסמת) - טלפון/אימייל זהים למתווך קיים אחר
  const email = document.getElementById('email').value.trim();
  const dup = ALL_BROKERS.find(b => b.id!==id && ((phone && b.phone===phone) || (email && b.email && b.email===email)));
  if (dup && !confirm(`קיים כבר מתווך עם אותו טלפון/אימייל (${dup.first_name} ${dup.last_name}). להמשיך בכל זאת?`)) return;

  const payload = {
    first_name, last_name, full_name: `${first_name} ${last_name}`,
    phone, email: email || null,
    city: document.getElementById('city').value.trim() || null,
    address: document.getElementById('address').value.trim() || null,
    short_note: document.getElementById('short_note').value.trim() || null,
    looking_for: document.getElementById('looking_for').value.trim() || null,
    notes: document.getElementById('notes').value.trim() || null,
    agreement_status: document.getElementById('agreement_status').value,
    status: document.getElementById('broker_status').value,
    handled_by: document.getElementById('handled_by').value || null,
    updated_at: new Date().toISOString()
  };

  if (id){
    const before = ALL_BROKERS.find(b=>b.id===id) || ARCHIVED_BROKERS.find(b=>b.id===id);
    const { error } = await window.supabaseClient.from('brokers').update(payload).eq('id', id);
    if (error){ toast('שגיאה בשמירה: ' + error.message); return; }
    const changed = {};
    Object.keys(payload).forEach(k => { if (before && before[k]!==payload[k]) changed[k] = { from: before[k], to: payload[k] }; });
    await logBrokerAudit(id, 'edited', before, payload, Object.keys(changed).length ? JSON.stringify(changed) : null);
    toast('המתווך עודכן בהצלחה');
  } else {
    payload.created_by = CURRENT_PROFILE.id;
    const { data, error } = await window.supabaseClient.from('brokers').insert(payload).select().single();
    if (error){ toast('שגיאה ביצירת מתווך: ' + error.message); return; }
    await logBrokerAudit(data.id, 'created', null, payload, null);
    toast('המתווך נוצר בהצלחה');
  }
  closeModal();
  await loadBrokers();
  if (VIEW_MODE==='archive') await loadArchivedBrokers();
  renderTable();
}

async function archiveBroker(id){
  if (!confirm('להעביר את המתווך הזה לארכיון? היסטוריית ההתאמות, המסמכים וה-Audit Log יישמרו במלואם.')) return;
  const before = ALL_BROKERS.find(b=>b.id===id);
  const { error } = await window.supabaseClient.from('brokers').update({
    is_archived: true, archived_at: new Date().toISOString(), archived_by: CURRENT_PROFILE.id
  }).eq('id', id);
  if (error){ toast('שגיאה בהעברה לארכיון: ' + error.message); return; }
  await logBrokerAudit(id, 'archived', before, null, null);
  toast('המתווך הועבר לארכיון');
  closeModal();
  await loadBrokers();
  await loadArchivedBrokers();
  renderTable();
}
async function restoreBroker(id){
  const { error } = await window.supabaseClient.from('brokers').update({
    is_archived: false, archived_at: null, archived_by: null
  }).eq('id', id);
  if (error){ toast('שגיאה בשחזור: ' + error.message); return; }
  await logBrokerAudit(id, 'restored', null, null, null);
  toast('המתווך שוחזר מהארכיון');
  closeModal();
  await loadBrokers();
  await loadArchivedBrokers();
  renderTable();
}

// 03.09.2026 (מודול מתווכים, סבב 3 - הסכם): שימוש באותה תשתית הסכמים חיצונית
// בדיוק כמו sendAgreementForLead ב-leads.html (bsd-contracts) - לא נבנה מנגנון
// הסכמים מקביל. type='buyer' בכוונה - הסכם הסודיות של מתווך זהה במהותו לזה
// של קונה (NDA לפני חשיפת פרטי עסק), ואין תבנית ייעודית נפרדת למתווכים.
async function sendAgreementForBroker(id){
  const b = ALL_BROKERS.find(x=>x.id===id);
  if (!b){ toast('רשומה לא נמצאה'); return; }
  const personName = b.full_name || [b.first_name,b.last_name].filter(Boolean).join(' ') || '';
  const params = new URLSearchParams({ type: 'buyer', name: personName, phone: b.phone || '', biz: b.looking_for || '' });
  window.open('https://baruchezon.github.io/bsd-contracts/bsd-admin-prep.html?' + params.toString(), '_blank');

  if (b.agreement_status !== 'יש הסכם חתום'){
    const { error } = await window.supabaseClient.from('brokers')
      .update({ agreement_status: 'נשלח הסכם לחתימה' }).eq('id', id);
    if (!error){
      b.agreement_status = 'נשלח הסכם לחתימה';
      await logBrokerAudit(id, 'agreement_sent', null, { agreement_status: 'נשלח הסכם לחתימה' }, null);
      renderTable();
      closeModal();
      toast('נפתח מסך הכנת ההסכם; המתווך סומן כ"הסכם נשלח לחתימה"');
    }
  }
}

document.getElementById('fSearch').addEventListener('input', renderTable);
document.getElementById('fStatus').addEventListener('change', renderTable);
document.getElementById('fAgreement').addEventListener('change', renderTable);
document.getElementById('fActivity').addEventListener('change', renderTable);
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id==='overlay') closeModal(); });

(async function init(){
  CURRENT_PROFILE = await requireAuth();
  renderBackBar();
  const headerEl = document.getElementById('headerUserInfo');
  if (headerEl && CURRENT_PROFILE) headerEl.textContent = CURRENT_PROFILE.full_name || CURRENT_PROFILE.email;

  if (!isBrokerViewer()){
    document.getElementById('noAccessBox').style.display = 'block';
    document.getElementById('noAccessBox').textContent = 'אין לך הרשאה לצפות ברשימת המתווכים / סוכנים. פנה למנהל המערכת אם לדעתך זו טעות.';
    return;
  }
  document.getElementById('brokersModuleBox').style.display = 'block';
  if (!canEditBroker(null)) document.getElementById('newBrokerBtn').style.display = 'none';
  if (['admin','manager'].includes(CURRENT_PROFILE?.role)) document.getElementById('brokerReportsLink').style.display = 'inline-block';

  const { data: users } = await window.supabaseClient.from('profiles').select('id, full_name, first_name, last_name, email');
  ALL_USERS = users || [];

  await loadBrokers();
})();
</script>
