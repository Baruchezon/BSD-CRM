<!doctype html>
<html lang="he" dir="rtl">
<head>
<script>
(function(){
  try{
    var PAGE_BUILD = '202611240635';
    window.PAGE_BUILD = PAGE_BUILD;
    var guardKey = 'bsd_ver_reload_guard:' + (location.pathname.split('/').pop() || 'index');
    function readGuard(){ try { return localStorage.getItem(guardKey); } catch(e){ try { return sessionStorage.getItem(guardKey); } catch(e2){ return 'storage-blocked'; } } }
    function writeGuard(v){ try { localStorage.setItem(guardKey, v); return true; } catch(e){ try { sessionStorage.setItem(guardKey, v); return true; } catch(e2){ return false; } } }
    var loopGuard = readGuard();
    if (location.protocol === 'file:') return;
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        var serverBuild = (v.version || '').replace(/\D/g,'');
        if (serverBuild && serverBuild !== PAGE_BUILD && loopGuard !== serverBuild){
          if (!writeGuard(serverBuild)) return;
          var url = new URL(location.href);
          url.searchParams.set('_cb', Date.now());
          location.replace(url.toString());
        }
      })
      .catch(function(){});
  } catch(e){}
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>בקשות להערכות שווי – BSD CRM</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--wine:#3A0F20;--wine2:#5a1a33;--cream:#F7EFE2;--cream2:#fffaf1;--gold:#C9A24A;--gold2:#e8cf8a;--ink:#2b1a20;--muted:#8a7468}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Heebo,Rubik,Arial,sans-serif}
.top{background:linear-gradient(135deg,var(--wine),var(--wine2));color:var(--cream);border-bottom:3px solid var(--gold)}
.top-in{max-width:1180px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:1.45rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--gold2);margin-top:2px}
.back{background:transparent;color:var(--cream);border:1px solid var(--gold);border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;text-decoration:none;white-space:nowrap}
.back:hover{background:rgba(201,162,74,.18)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.demo{background:#fff3cd;border:1px dashed var(--gold);color:#6b4e00;border-radius:12px;padding:8px 12px;font-weight:700;margin-bottom:12px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 1.6fr;gap:12px;margin-bottom:16px}
.kpi{background:var(--cream2);border:1px solid #ead9bb;border-radius:16px;padding:14px 16px;box-shadow:0 4px 14px rgba(58,15,32,.06)}
.kpi b{display:block;font-size:2rem;color:var(--wine);line-height:1.05}
.kpi span{display:block;color:var(--muted);font-size:.84rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.main{background:linear-gradient(135deg,var(--wine),var(--wine2));border-color:var(--gold)}
.kpi.main b{color:var(--gold2)}.kpi.main span{color:var(--cream)}
.months{background:var(--cream2);border:1px solid #ead9bb;border-radius:16px;padding:10px 14px;max-height:132px;overflow:auto}
.months h3{margin:0 0 6px;font-size:.85rem;color:var(--wine)}
.mrow{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:.8rem;margin:3px 0}
.mname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{background:#efe3cc;border-radius:99px;height:8px;overflow:hidden}.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine2));border-radius:99px}
.mrow b{text-align:left;color:var(--wine)}
.slices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:6px 0 16px}
.slice{position:relative;border:0;border-radius:18px;padding:16px 12px 14px;color:#fff;font:inherit;cursor:pointer;text-align:center;
  box-shadow:0 7px 0 rgba(30,6,16,.45),0 14px 24px rgba(58,15,32,.22),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s}
.slice::after{content:"";position:absolute;inset:4px 8px auto 8px;height:42%;border-radius:14px 14px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0));pointer-events:none}
.slice:hover{transform:translateY(-3px)}
.slice:active,.slice.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,6,16,.45),0 6px 12px rgba(58,15,32,.2),inset 0 2px 0 rgba(255,255,255,.3)}
.slice.on{outline:3px solid var(--gold);outline-offset:3px}
.slice .ico{display:block;font-size:1.9rem;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.slice .st{display:block;font-weight:800;font-size:1rem;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.t1{background:linear-gradient(160deg,#8e1f45,#3A0F20)}
.t2{background:linear-gradient(160deg,#d4a73c,#9a6a12)}
.t3{background:linear-gradient(160deg,#1f7a6b,#0c4a41)}
.t4{background:linear-gradient(160deg,#3d5fa8,#1d2f63)}
.t5{background:linear-gradient(160deg,#c45a3a,#7a2a14)}
.panel{background:var(--cream2);border:1px solid #ead9bb;border-radius:16px;padding:12px 14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(58,15,32,.06)}
.sp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--wine);font-size:1.05rem}
.x{border:0;background:#efe3cc;color:var(--wine);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
.brow{width:100%;display:grid;grid-template-columns:minmax(0,1.5fr) 2fr 90px 120px;gap:10px;align-items:center;border:0;background:transparent;padding:6px 8px;border-radius:10px;font:inherit;text-align:right;cursor:pointer;color:var(--ink)}
.brow:hover{background:#f3e7d1}.brow.on{background:#f0dcb0}
.bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bbar{background:#efe3cc;border-radius:99px;height:12px;overflow:hidden}.bbar i{display:block;height:100%;border-radius:99px}
.bnum{font-weight:800;color:var(--wine);white-space:nowrap}.bavg{color:var(--muted);font-size:.82rem;white-space:nowrap}
.list-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.list-head h2{margin:0;font-size:1.05rem;color:var(--wine);white-space:nowrap}
.list-head .cnt{background:var(--gold);color:var(--wine);border-radius:99px;padding:1px 9px;font-size:.8rem;font-weight:800}
.list-head input[type=search]{flex:1;min-width:180px;border:1px solid #e0cda8;border-radius:10px;padding:8px 12px;font:inherit;background:#fff}
.chip{background:var(--wine);color:var(--cream);border-radius:99px;padding:4px 6px 4px 12px;font-size:.82rem;white-space:nowrap}
.chip button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;margin-right:6px;cursor:pointer}
.hid{font-size:.8rem;color:var(--muted);white-space:nowrap}
.cols,.vrow{display:grid;grid-template-columns:88px minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1fr) 124px;gap:10px;align-items:center}
.cols{font-size:.75rem;color:var(--muted);padding:4px 12px;font-weight:700}
.vrow{width:100%;border:0;font:inherit;text-align:right;color:var(--ink);padding:7px 12px;cursor:pointer;background:#fff;border-bottom:1px solid #f0e4cf}
.vrow:nth-child(even){background:#fbf3e4}
.vrow:hover{background:#f3e2bf}
.vrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88rem}
.vrow.test,.vrow.arch{opacity:.55}
.c-size{color:#5b4a40;font-size:.82rem !important}
.c-num{font-weight:800;color:var(--wine)}.c-val{font-weight:700;color:#5a3b00}.c-date{color:var(--muted);font-size:.8rem !important;direction:ltr;text-align:right}
.anon{color:#b29d8f;font-style:italic}
.c-val,#sumAvg,.bavg,.money{unicode-bidi:isolate}
.c-val{direction:ltr;text-align:right}
.rows{border-radius:12px;overflow:hidden;border:1px solid #ead9bb}
.empty{padding:28px;text-align:center;color:var(--muted);background:#fff}
.muted{color:var(--muted)}.small{font-size:.75rem;margin-top:6px}
.drawer{position:fixed;inset:0;background:rgba(30,6,16,.45);display:flex;justify-content:flex-start;z-index:40}
.sheet{width:min(520px,100%);background:var(--cream2);height:100%;overflow:auto;padding:0 0 24px;box-shadow:12px 0 40px rgba(0,0,0,.25)}
.sheet-top{position:sticky;top:0;background:var(--wine);color:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:2px solid var(--gold)}
.sheet-top button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;font:inherit}
#sheetBody{padding:4px 18px}
#sheetBody h2{color:var(--wine);margin:12px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetBody h3{color:var(--wine);font-size:.9rem;margin:16px 0 4px;border-bottom:1px solid var(--gold2);padding-bottom:3px}
.dr{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:5px 0;border-bottom:1px dashed #ecdcc0;font-size:.88rem}
.dr span{color:var(--muted)}.dr b{font-weight:600}.dr a{color:var(--wine)}
.tag{display:inline-block;background:var(--gold);color:var(--wine);border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:800;margin-left:6px}
.sheet-actions{margin-top:18px}.ghost{border:1px solid #d9c49a;background:#fff;color:var(--wine);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.toast{position:fixed;bottom:16px;left:16px;background:var(--wine);color:var(--cream);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;z-index:50}
@media(max-width:980px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.months{grid-column:1/-1}.slices{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.slices{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{display:none}.vrow{grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);row-gap:2px}.c-size{display:none}.c-name,.c-date{grid-column:auto}.brow{grid-template-columns:minmax(0,1fr) 1fr 70px}.bavg{display:none}.wrap{padding:12px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>📊 בקשות להערכות שווי<small>מחשבון הערכת השווי באתר BSD · כל בקשה נשמרת, גם בלי שם</small></h1>
  <a class="back" href="leads-hub.html">חזרה ללידים</a>
</div></header>
<div class="wrap">
  <div class="demo" id="demoBanner" hidden>תצוגה מקומית עם נתוני דמה בלבד (לא נתונים אמיתיים)</div>
  <section class="summary">
    <div class="kpi main"><b id="sumTotal">0</b><span>הערכות שווי בוצעו (סה״כ)</span></div>
    <div class="kpi"><b id="sumMonth">0</b><span>החודש</span></div>
    <div class="kpi"><b id="sumContact">0</b><span>השאירו פרטים</span></div>
    <div class="kpi"><b id="sumAvg" dir="ltr">—</b><span>שווי ממוצע (אמצע הטווח)</span></div>
    <div class="months"><h3>לפי חודש</h3><div id="months"></div></div>
  </section>
  <section class="slices" id="slices" aria-label="חיתוכים"></section>
  <section class="panel" id="slicePanel" hidden></section>
  <section id="listPanel">
    <div class="list-head">
      <h2>כל הבקשות</h2><span class="cnt" id="listCount">0</span>
      <span class="chip" id="filterChip" hidden></span>
      <input type="search" id="search" placeholder="חיפוש: מספר, שם, טלפון, תחום">
      <label class="hid"><input type="checkbox" id="showHidden"> הצג בדיקות ומוסתרים</label>
    </div>
    <div class="cols"><span>מספר</span><span>תחום העסק</span><span>ההערכה שהתקבלה</span><span>עובדים · מחזור</span><span>שם</span><span>תאריך ושעה</span></div>
    <div class="rows" id="list"></div>
  </section>
</div>
<div class="drawer" id="drawer" hidden><aside class="sheet" role="dialog" aria-modal="true" aria-label="פרטי הערכת שווי">
  <div class="sheet-top"><b>פרטי הבקשה</b><button type="button" data-close-drawer aria-label="סגירה">✕ סגירה</button></div>
  <div id="sheetBody"></div>
</aside></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="js/config.js?v=202611231330"></script>
<script src="js/supabaseClient.js?v=202611181930"></script>
<script src="js/auth.js?v=202611240635"></script>
<script src="js/valuation-requests.js?v=202611242030"></script>
</body>
</html>
