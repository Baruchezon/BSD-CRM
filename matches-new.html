<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<script>
// בדיקת גרסה אוטומטית - עוקפת בעיות קאשינג של דפדפני מובייל (ראו הסבר ב-match-detail.html)
(function(){
  try{
    var PAGE_BUILD = '202608251230';
    window.PAGE_BUILD = PAGE_BUILD;
    var loopGuard = sessionStorage.getItem('bsd_ver_reload_guard');
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        var serverBuild = (v.version || '').replace(/\D/g,'');
        if (serverBuild && serverBuild !== PAGE_BUILD && loopGuard !== serverBuild){
          sessionStorage.setItem('bsd_ver_reload_guard', serverBuild);
          var url = new URL(location.href);
          url.searchParams.set('_cb', Date.now());
          location.replace(url.toString());
        }
      }).catch(function(){});
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>התאמות חדש (קריאה בלבד) | BSD CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<style>
  :root{
    --navy:#0e1b34; --navy-light:#16264a; --gold:#c9a24b; --gold-light:#e8cf8a;
    --bg:#f6f5ef; --card:#ffffff; --text:#1c2333; --muted:#6b7280; --line:#e3ddcf;
    --c-green-bg:#e2f6ea; --c-green-fg:#166534; --c-red-bg:#fbe2df; --c-red-fg:#a32d21;
    --c-orange-bg:#fdedcf; --c-orange-fg:#95590a; --c-blue-bg:#dfeafc; --c-blue-fg:#1d4e89;
    --c-gray-bg:#e7e7ea; --c-gray-fg:#54575f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  .ro-banner{background:#fdf3d9;border-bottom:2px solid var(--gold);color:#7a5a10;text-align:center;font-size:12.5px;font-weight:700;padding:7px 12px;}

  .topbar{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;padding:14px 20px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:40;}
  .topbar h1{margin:0;font-size:17px;}
  .topbar .sub{margin:2px 0 0;font-size:11px;color:var(--gold-light);}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .who{font-size:12px;color:var(--gold-light);}
  .back-btn,.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;font-family:inherit;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;text-decoration:none;}
  .back-btn:hover,.logout-btn:hover{background:rgba(255,255,255,0.1);}

  .view-toggle{display:flex;gap:6px;margin:16px auto 0;max-width:960px;padding:0 16px;}
  .view-toggle-btn{padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);}
  .view-toggle-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .filters{max-width:960px;margin:10px auto 0;padding:0 16px;display:flex;gap:8px;}
  .filters input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;background:#fff;}

  .page{max-width:960px;margin:14px auto 40px;padding:0 16px;}
  .loading, .empty-state, .blocked-state{text-align:center;color:var(--muted);padding:40px 20px;background:var(--card);border-radius:14px;border:1px dashed var(--line);font-size:14px;}
  .blocked-state{max-width:460px;margin:60px auto;color:var(--c-red-fg);border-color:#f2c2bd;background:var(--c-red-bg);}

  .chip{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
  .chip-green{background:var(--c-green-bg);color:var(--c-green-fg);}
  .chip-red{background:var(--c-red-bg);color:var(--c-red-fg);}
  .chip-orange{background:var(--c-orange-bg);color:var(--c-orange-fg);}
  .chip-blue{background:var(--c-blue-bg);color:var(--c-blue-fg);}
  .chip-gray{background:var(--c-gray-bg);color:var(--c-gray-fg);}
  .biz-number{background:var(--navy);color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px;display:inline-block;}

  .group-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 4px rgba(14,27,52,0.07);overflow:hidden;margin-bottom:14px;}
  .group-header{padding:14px 16px;border-bottom:1px solid var(--line);}
  .group-header .g-name{font-size:15.5px;font-weight:800;color:var(--navy);}
  .group-header .g-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .group-body{padding:10px 14px 14px;}

  .mini-row{border:1px solid var(--line);border-inline-start-width:5px;border-inline-start-style:solid;border-radius:9px;padding:9px 11px;margin-bottom:7px;cursor:pointer;background:#fff;}
  .mini-row:hover{background:#faf8f0;}
  .mini-row .mm-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;}
  .mini-row .mm-name{font-weight:800;color:var(--navy);font-size:13.5px;}
  .mini-row .mm-facts{font-size:11.5px;color:var(--muted);margin-top:4px;}

  .overlay{position:fixed;inset:0;background:rgba(14,27,52,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;}
  .modal-head h3{margin:0;font-size:15px;color:var(--navy);}
  .modal-close{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .modal-body{padding:16px 18px;}
  .modal-foot{padding:12px 18px 18px;text-align:left;}

  .fact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;font-size:12.5px;margin-bottom:10px;}
  @media(max-width:480px){.fact-grid{grid-template-columns:1fr;}}
  .fact{display:flex;gap:5px;}
  .fact .fk{color:var(--muted);min-width:96px;flex-shrink:0;}
  .fact .fv{font-weight:600;}

  .sec-title{font-size:13px;font-weight:800;color:var(--navy);margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--gold);}
  .sec-title:first-child{margin-top:0;}
  .row-line{padding:7px 0;border-bottom:1px solid #f1eee2;font-size:12.5px;}
  .row-line:last-child{border-bottom:none;}
  .row-line .rl-meta{color:var(--muted);font-size:11px;margin-top:2px;}
  .btn-ghost{background:#f1eee2;color:var(--text);border:none;padding:9px 16px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<div class="ro-banner">🧪 מסך "התאמות חדש" — מחובר לנתוני האמת של BSD CRM, קריאה בלבד. שלב הכתיבה טרם הופעל. זמין לאדמין בלבד בשלב זה.</div>

<div class="topbar">
  <div>
    <h1>📁 התאמות חדש</h1>
    <p class="sub">תצוגה חדשה על נתוני האמת · קריאה בלבד</p>
  </div>
  <div class="topbar-right">
    <span class="who" id="whoAmI"></span>
    <a class="back-btn" href="app.html">🔙 ללוח הבקרה</a>
    <button class="logout-btn" onclick="bsdLogout()">יציאה</button>
  </div>
</div>

<div id="mainWrap" style="display:none;">
  <div class="view-toggle">
    <button class="view-toggle-btn active" data-view="buyers">👥 לפי קונים</button>
    <button class="view-toggle-btn" data-view="businesses">🏢 לפי עסקים</button>
  </div>
  <div class="filters">
    <input type="text" id="searchBox" placeholder="חיפוש לפי שם, מספר עסק או מספר לקוח...">
  </div>
  <div class="page" id="mainContent">
    <div class="loading">טוען נתונים אמיתיים…</div>
  </div>
</div>

<div class="page" id="blockedWrap" style="display:none;">
  <div class="blocked-state">🔒 מסך זה זמין כרגע רק למשתמש אדמין, בזמן שלב הבדיקה.</div>
</div>

<div id="modalRoot"></div>

<script>
/*
 * READ-ONLY BY CONSTRUCTION: every Supabase call in this file is .select(...).
 * There is no .insert/.update/.delete/.upsert anywhere in this script.
 * Auth reuses the site's own requireAuth() (js/auth.js) — same session as
 * every other BSD-CRM page, no separate login, and requireAuth() itself only
 * ever does a profiles SELECT (verified in js/auth.js), so this page adds
 * zero writes even on entry.
 */
let CURRENT_PROFILE = null;
let STATUS_COLORS = {};
const STATUS_PALETTE = ["blue","green","orange","gray"];
function colorForStatus(s){
  if(!s) return "gray";
  if(!STATUS_COLORS[s]) STATUS_COLORS[s] = STATUS_PALETTE[Object.keys(STATUS_COLORS).length % STATUS_PALETTE.length];
  return STATUS_COLORS[s];
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){ if(!iso) return "—"; const d = new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString('he-IL'); }
function fmtDateTime(iso){ if(!iso) return "—"; const d = new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString('he-IL')+" "+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }

let ALL_LEADS = [], ALL_BUSINESSES = {}, ALL_MATCHES = [], ALL_PROFILES = {}, ALL_TASKS = [];
let currentView = "buyers";
let searchTerm = "";

async function loadEverything(){
  const sb = window.supabaseClient;
  const [{data: leads}, {data: businesses}, {data: matches}, {data: profiles}, {data: tasks}] = await Promise.all([
    sb.from('leads').select('id,full_name,phone,phone2,client_number,agreement_status,created_by,handled_by,type').eq('type','buyer'),
    sb.from('businesses').select('id,internal_name,business_number,field,agreement_status,created_by,handled_by'),
    sb.from('matches').select('*'),
    sb.from('profiles').select('id,full_name,role'),
    sb.from('tasks').select('id,match_id,business_id,buyer_id,title,status,due_date,assigned_to').order('due_date',{ascending:true})
  ]);
  ALL_LEADS = leads || [];
  (businesses||[]).forEach(b=> ALL_BUSINESSES[b.id]=b);
  ALL_MATCHES = matches || [];
  (profiles||[]).forEach(p=> ALL_PROFILES[p.id]=p);
  ALL_TASKS = tasks || [];
  render();
}
function userName(id){ if(!id) return null; const p = ALL_PROFILES[id]; return p ? (p.full_name||p.role) : null; }
function leadById(id){ return ALL_LEADS.find(l=>l.id===id); }
function bizLabel(bizId){
  const b = ALL_BUSINESSES[bizId];
  if(!b) return "—";
  return `${b.business_number?`<span class="biz-number">#${esc(b.business_number.replace('BSD-B-',''))}</span> `:""}${esc(b.internal_name||"")}`;
}
function bizLabelPlain(bizId){
  const b = ALL_BUSINESSES[bizId];
  if(!b) return "—";
  return `${b.business_number?"#"+b.business_number.replace('BSD-B-','')+" ":""}${b.internal_name||""}`;
}

function render(){ if(currentView==="buyers") renderByBuyers(); else renderByBusinesses(); }

function matchFacts(m){
  const color = colorForStatus(m.status);
  const days = daysSince(m.last_action_at || m.updated_at);
  const handler = userName(m.current_handler);
  return `<span class="chip chip-${color}">${esc(m.status||"—")}</span> · מטפל: ${handler?esc(handler):'<span class="chip chip-red">ללא מטפל</span>'}${days!==null?" · "+days+" ימים ללא עדכון":""}`;
}

function renderByBuyers(){
  const wrap = document.getElementById("mainContent");
  const q = searchTerm.trim();
  let leads = ALL_LEADS.filter(l=>{
    const myMatches = ALL_MATCHES.filter(m=>m.buyer_id===l.id);
    if(myMatches.length===0) return false;
    if(!q) return true;
    if((l.full_name||"").includes(q) || (l.client_number||"").includes(q)) return true;
    return myMatches.some(m=>bizLabelPlain(m.business_id).includes(q));
  });
  if(leads.length===0){ wrap.innerHTML = `<div class="empty-state">לא נמצאו קונים עם התאמות תואמות לסינון.</div>`; return; }

  wrap.innerHTML = leads.map(l=>{
    const myMatches = ALL_MATCHES.filter(m=>m.buyer_id===l.id);
    return `
    <div class="group-card">
      <div class="group-header">
        <div class="g-name">${esc(l.full_name||"—")} ${l.client_number?`<span class="chip chip-gray">${esc(l.client_number)}</span>`:""}</div>
        <div class="g-meta">📞 ${esc(l.phone||"—")} · הסכם: <span class="chip chip-${l.agreement_status==='יש הסכם חתום'?'green':l.agreement_status==='נשלח הסכם לחתימה'?'orange':'red'}">${esc(l.agreement_status||"אין הסכם")}</span> · ${myMatches.length} התאמות</div>
      </div>
      <div class="group-body">
        ${myMatches.map(m=>`
          <div class="mini-row" data-match="${m.id}">
            <div class="mm-top"><span class="mm-name">${bizLabel(m.business_id)}</span></div>
            <div class="mm-facts">${matchFacts(m)}</div>
          </div>
        `).join("")}
      </div>
    </div>`;
  }).join("");

  wrap.querySelectorAll("[data-match]").forEach(el=> el.addEventListener("click", ()=>openMatchCard(el.dataset.match)));
}

function renderByBusinesses(){
  const wrap = document.getElementById("mainContent");
  const q = searchTerm.trim();
  let bizIds = Object.keys(ALL_BUSINESSES).filter(bid=>{
    const myMatches = ALL_MATCHES.filter(m=>m.business_id===bid);
    if(myMatches.length===0) return false;
    if(!q) return true;
    const b = ALL_BUSINESSES[bid];
    if((b.internal_name||"").includes(q) || (b.business_number||"").includes(q)) return true;
    return myMatches.some(m=>{ const l=leadById(m.buyer_id); return l && (l.full_name||"").includes(q); });
  });
  if(bizIds.length===0){ wrap.innerHTML = `<div class="empty-state">לא נמצאו עסקים עם התאמות תואמות לסינון.</div>`; return; }

  wrap.innerHTML = bizIds.map(bid=>{
    const b = ALL_BUSINESSES[bid];
    const myMatches = ALL_MATCHES.filter(m=>m.business_id===bid);
    return `
    <div class="group-card">
      <div class="group-header">
        <div class="g-name">${bizLabel(bid)}</div>
        <div class="g-meta">${esc(b.field||"")} · הסכם מוכר: <span class="chip chip-${b.agreement_status==='יש הסכם חתום'?'green':b.agreement_status==='נשלח הסכם לחתימה'?'orange':'red'}">${esc(b.agreement_status||"אין הסכם")}</span> · ${myMatches.length} קונים מקושרים</div>
      </div>
      <div class="group-body">
        ${myMatches.map(m=>{
          const l = leadById(m.buyer_id);
          return `
          <div class="mini-row" data-match="${m.id}">
            <div class="mm-top"><span class="mm-name">${esc(l?l.full_name:"—")}${l&&l.client_number?` <span class="chip chip-gray">${esc(l.client_number)}</span>`:""}</span></div>
            <div class="mm-facts">${matchFacts(m)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");

  wrap.querySelectorAll("[data-match]").forEach(el=> el.addEventListener("click", ()=>openMatchCard(el.dataset.match)));
}

async function openMatchCard(matchId){
  const sb = window.supabaseClient;
  const m = ALL_MATCHES.find(x=>x.id===matchId);
  if(!m) return;
  const l = leadById(m.buyer_id);
  const b = ALL_BUSINESSES[m.business_id];

  const [{data: history}, {data: distributions}, {data: audit}] = await Promise.all([
    sb.from('match_status_history').select('*').eq('match_id', matchId).order('changed_at',{ascending:false}),
    sb.from('anon_distributions').select('*').eq('match_id', matchId).order('sent_at',{ascending:false}),
    sb.from('audit_log').select('*').eq('table_name','matches').eq('record_id', matchId).order('occurred_at',{ascending:false})
  ]);
  const tasks = ALL_TASKS.filter(t=>t.match_id===matchId);
  const color = colorForStatus(m.status);
  const handler = userName(m.current_handler);
  const creator = userName(m.transferred_by || m.created_by);

  document.getElementById("modalRoot").innerHTML = `
    <div class="overlay">
      <div class="modal">
        <div class="modal-head"><h3>📁 כרטיס התאמה — ${bizLabel(m.business_id)} ⇄ ${esc(l?l.full_name:"—")}</h3><button class="modal-close" data-close>✕</button></div>
        <div class="modal-body">
          <div style="margin-bottom:10px;"><span class="chip chip-${color}">${esc(m.status||"—")}</span></div>
          <div class="fact-grid">
            <div class="fact"><span class="fk">📞 טלפון קונה:</span><span class="fv">${esc(l?l.phone:"—")}</span></div>
            <div class="fact"><span class="fk">🧑‍💼 מטפל נוכחי:</span><span class="fv">${handler?esc(handler):'<span class="chip chip-red">ללא מטפל</span>'}</span></div>
            <div class="fact"><span class="fk">📝 הסכם קונה:</span><span class="fv"><span class="chip chip-${l&&l.agreement_status==='יש הסכם חתום'?'green':l&&l.agreement_status==='נשלח הסכם לחתימה'?'orange':'red'}">${esc(l?l.agreement_status||"אין הסכם":"—")}</span></span></div>
            <div class="fact"><span class="fk">🔓 רמת חשיפה:</span><span class="fv">${m.disclosure_level===3?"מלא":m.disclosure_level===2?"מורחב":"אנונימי"}</span></div>
            <div class="fact"><span class="fk">👤 נוצרה ע"י:</span><span class="fv">${creator?esc(creator):"—"} (${fmtDate(m.created_at)})</span></div>
            <div class="fact"><span class="fk">🕓 עדכון אחרון:</span><span class="fv">${fmtDateTime(m.updated_at)}</span></div>
            <div class="fact" style="grid-column:1/-1;"><span class="fk">➡️ פעולה הבאה:</span><span class="fv">${esc(m.next_action||"—")}${m.next_action_at?" · "+fmtDate(m.next_action_at):""}</span></div>
            ${m.meeting_date?`<div class="fact" style="grid-column:1/-1;"><span class="fk">📅 תאריך פגישה:</span><span class="fv">${fmtDate(m.meeting_date)}</span></div>`:""}
            ${m.meeting_summary?`<div class="fact" style="grid-column:1/-1;"><span class="fk">📝 סיכום פגישה:</span><span class="fv">${esc(m.meeting_summary)}</span></div>`:""}
            ${m.notes?`<div class="fact" style="grid-column:1/-1;"><span class="fk">📝 הערות:</span><span class="fv">${esc(m.notes)}</span></div>`:""}
          </div>

          <div class="sec-title">📎 חומרים שנשלחו (מתוך anon_distributions)</div>
          ${(distributions&&distributions.length) ? distributions.map(d=>`
            <div class="row-line">${esc(d.subject||d.distribution_type||"חומר")} · ערוץ: ${esc(d.channel)} · <span class="chip chip-${d.delivery_status==='sent'?'green':d.delivery_status==='failed'?'red':'orange'}">${esc(d.delivery_status)}</span>
              <div class="rl-meta">${fmtDateTime(d.sent_at)}</div>
            </div>`).join("") : `<div class="row-line rl-meta">לא נמצאו רשומות שליחה עבור התאמה זו.</div>`}

          <div class="sec-title">✅ משימות (${tasks.length})</div>
          ${tasks.length ? tasks.map(t=>`
            <div class="row-line">${esc(t.title)} <span class="chip chip-${t.status==='הושלמה'?'green':'gray'}">${esc(t.status)}</span>
              <div class="rl-meta">אחראי: ${esc(userName(t.assigned_to)||"—")} · יעד: ${fmtDate(t.due_date)}</div>
            </div>`).join("") : `<div class="row-line rl-meta">אין משימות מקושרות.</div>`}

          <div class="sec-title">🕒 היסטוריית סטטוס (match_status_history)</div>
          ${(history&&history.length) ? history.map(h=>`
            <div class="row-line">${esc(h.status)} ${h.note?"— "+esc(h.note):""}
              <div class="rl-meta">${fmtDateTime(h.changed_at)} · ${esc(userName(h.changed_by)||"—")}</div>
            </div>`).join("") : `<div class="row-line rl-meta">אין היסטוריית סטטוס עבור התאמה זו.</div>`}

          <div class="sec-title">📋 Audit Log (matches)</div>
          ${(audit&&audit.length) ? audit.map(a=>`
            <div class="row-line">${esc(a.action)}
              <div class="rl-meta">${fmtDateTime(a.occurred_at)} · ${esc(userName(a.actor_id)||"—")}</div>
            </div>`).join("") : `<div class="row-line rl-meta">אין רשומות Audit עבור התאמה זו.</div>`}
        </div>
        <div class="modal-foot"><button class="btn-ghost" data-close>סגור</button></div>
      </div>
    </div>
  `;
  document.querySelectorAll("[data-close]").forEach(el=>el.addEventListener("click", ()=> document.getElementById("modalRoot").innerHTML=""));
}

document.querySelectorAll(".view-toggle-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentView = btn.dataset.view;
    document.querySelectorAll(".view-toggle-btn").forEach(b=>b.classList.toggle("active", b===btn));
    render();
  });
});
document.getElementById("searchBox").addEventListener("input", e=>{ searchTerm = e.target.value; render(); });

(async function init(){
  const profile = await requireAuth();
  if(!profile) return; // requireAuth() already redirected to login.html
  CURRENT_PROFILE = profile;

  if(profile.role !== 'admin'){
    document.getElementById("blockedWrap").style.display = "block";
    document.getElementById("whoAmI").textContent = `מחובר: ${profile.full_name || profile.email} (${profile.role})`;
    return;
  }

  document.getElementById("whoAmI").textContent = `מחובר: ${profile.full_name || profile.email} (${profile.role})`;
  document.getElementById("mainWrap").style.display = "block";
  loadEverything();
})();
</script>
</body>
</html>
