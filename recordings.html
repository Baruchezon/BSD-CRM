<script>
// בדיקת גרסה אוטומטית - עוקפת בעיות קאשינג של דפדפני מובייל (ראו הסבר ב-match-detail.html)
(function(){
  try{
    var KEY = 'bsd_ver_seen';
    var seen = sessionStorage.getItem(KEY);
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        if (seen && seen !== v.version){
          sessionStorage.setItem(KEY, v.version);
          var url = new URL(location.href);
          url.searchParams.set('_cb', Date.now());
          location.replace(url.toString());
        } else if (!seen){
          sessionStorage.setItem(KEY, v.version);
        }
      })
      .catch(function(){});
  } catch(e){}
})();
</script>

<style>
  .wrap{padding:24px 28px 60px;max-width:900px;margin:0 auto;}
  .wrap h2{color:var(--navy);margin-bottom:4px;}
  .wrap .sub{color:#8a93ab;font-size:.85rem;margin-bottom:22px;}
  .rec-card{background:#fff;border-radius:14px;padding:18px 22px;margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 20px rgba(14,27,52,.10),0 2px 6px rgba(14,27,52,.06);}
  .rec-title{font-weight:700;color:var(--navy);font-size:1.05rem;}
  .rec-meta{color:#8a93ab;font-size:.78rem;margin:3px 0 8px;}
  .rec-summary{font-size:.85rem;color:#444;margin-bottom:10px;}
  .rec-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .rec-actions .btn{padding:7px 14px;font-size:.8rem;}
  .empty{color:#999;font-size:.85rem;padding:20px 0;text-align:center;}
  .rec-tabs{display:flex;gap:8px;}
  .rec-tab{border:1.5px solid #d8d3c4;background:#fff;color:#3a3f4d;}
  .rec-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .rec-filters{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end;}
  .rec-type-badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px;background:#eee;color:#555;margin-inline-start:8px;vertical-align:middle;}
  .rec-owner{color:#8a93ab;font-size:.78rem;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:.92rem;font-weight:700;color:#3a3f4d;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1.5px solid #d8d3c4;border-radius:8px;font-family:inherit;font-size:1rem;box-sizing:border-box;}
  .field textarea{min-height:78px;resize:vertical;}
  .overlay{position:fixed;inset:0;background:rgba(14,27,52,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:50;padding:40px 20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.4);box-sizing:border-box;overflow-x:hidden;}
  .modal *{box-sizing:border-box;max-width:100%;}
  .modal h3{margin:0 0 16px;color:var(--navy);border-right:4px solid var(--gold);padding-right:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  @media(max-width:640px){
    .overlay{padding:0;align-items:stretch;}
    .modal{max-width:100%;width:100%;min-height:100%;border-radius:0;padding:20px 16px 100px;}
  }
</style>
</head>

    <a href="leads.html" style="color:#cfd6e6;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:.85rem;">קונים ומשקיעים</a>

<div class="wrap">
  <h2>🎙️ הקלטות</h2>
  <div class="sub">הקלטות כלליות שלא משויכות לעסק, קונה או התאמה ספציפיים</div>

  <div id="recTabs" class="rec-tabs" style="display:none;margin-bottom:18px;">
    <button class="btn btn-ghost rec-tab active" id="tabMine" onclick="switchRecTab('mine')">ההקלטות שלי</button>
    <button class="btn btn-ghost rec-tab" id="tabAll" onclick="switchRecTab('all')">🗂️ הקלטות משתמשים</button>
  </div>

  <div id="mineView">
    <div id="newRecBtnWrap"></div>
    <div id="recordingsList"><div class="empty">טוען...</div></div>
  </div>

  <div id="allView" style="display:none;">
    <div class="rec-filters">
      <div class="field" style="margin-bottom:0;flex:1;min-width:160px;">
        <label>משתמש</label>
        <select id="filterUser" onchange="renderAllRecordings()"><option value="">כל המשתמשים</option></select>
      </div>
      <div class="field" style="margin-bottom:0;flex:1;min-width:160px;">
        <label>מיון</label>
        <select id="sortAll" onchange="renderAllRecordings()">
          <option value="date_desc">תאריך - החדש קודם</option>
          <option value="date_asc">תאריך - הישן קודם</option>
          <option value="user">לפי משתמש</option>
        </select>
      </div>
    </div>
    <div id="allRecordingsList"><div class="empty">טוען...</div></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div id="toastBox"></div>

<script src="js/config.js?v=202608111530"></script>
<script src="js/supabaseClient.js?v=202608111530"></script>
<script src="js/auth.js?v=202608111530"></script>
<script src="js/standaloneRecording.js?v=202608132300"></script>
<script>
let CURRENT_PROFILE = null;
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleDateString('he-IL'); }catch(e){ return iso; } }
function toast(msg){
  const isError = /שגיאה|error/i.test(msg);
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:24px;left:24px;z-index:200;background:${isError ? '#b00020' : 'var(--navy)'};color:#fff;padding:14px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:380px;`;
  el.textContent = msg;
  document.getElementById('toastBox').appendChild(el);
  setTimeout(()=>{ if (el.parentElement) el.remove(); }, isError ? 8000 : 3500);
}

function startGeneralRecording(){
  window.openStandaloneRecording({
    type: 'general', id: 'general', label: 'הקלטה כללית',
    currentProfile: CURRENT_PROFILE,
    onSaved: loadRecordings
  });
}

async function loadRecordings(){
  const box = document.getElementById('recordingsList');
  let q = window.supabaseClient.from('match_meetings').select('*').is('match_id', null).is('business_id', null).is('buyer_id', null).is('deleted_at', null).order('meeting_date', {ascending:false});
  const { data, error } = await q;
  if (error){ box.innerHTML = `<div class="empty" style="color:#a02c1d;">שגיאה: ${esc(error.message)}</div>`; return; }
  if (!data || !data.length){ box.innerHTML = '<div class="empty">אין עדיין הקלטות. לחץ "הקלטה חדשה" כדי להתחיל.</div>'; return; }
  box.innerHTML = data.map(m=>`
    <div class="rec-card">
      <div class="rec-title">🎙️ ${esc(m.title || m.meeting_type || 'הקלטה')}</div>
      <div class="rec-meta">${fmtDate(m.meeting_date)} ${m.start_time?('· '+m.start_time.slice(0,5)):''}${m.location?(' · '+esc(m.location)):''}</div>
      ${m.summary_text ? `<div class="rec-summary">${esc(m.summary_text).slice(0,220)}${m.summary_text.length>220?'…':''}</div>` : ''}
      <div class="rec-actions">
        <button class="btn btn-ghost" onclick='window.viewStandaloneMeetingPdf(${JSON.stringify(m)})'>👁️ צפה</button>
        <button class="btn btn-ghost" onclick='window.downloadStandaloneMeetingPdf(${JSON.stringify(m)})'>📄 הורד PDF</button>
        <button class="btn btn-ghost" onclick='window.sendStandaloneMeetingEmail(${JSON.stringify(m)}, ${JSON.stringify(m.title||m.meeting_type)}, CURRENT_PROFILE)'>✉️ שלח</button>
      </div>
    </div>`).join('');
}

let ALL_RECORDINGS = [];

function switchRecTab(tab){
  document.getElementById('tabMine').classList.toggle('active', tab==='mine');
  document.getElementById('tabAll').classList.toggle('active', tab==='all');
  document.getElementById('mineView').style.display = tab==='mine' ? '' : 'none';
  document.getElementById('allView').style.display = tab==='all' ? '' : 'none';
  if (tab==='all' && !ALL_RECORDINGS.length) loadAllRecordings();
}

function recTypeLabel(m){
  if (m.match_id) return 'התאמה';
  if (m.business_id) return 'עסק';
  if (m.buyer_id) return 'קונה';
  return 'כללי';
}

async function loadAllRecordings(){
  const box = document.getElementById('allRecordingsList');
  box.innerHTML = '<div class="empty">טוען...</div>';
  const { data, error } = await window.supabaseClient
    .from('match_meetings')
    .select('*, profiles!created_by(full_name, email)')
    .is('deleted_at', null)
    .order('meeting_date', {ascending:false});
  if (error){ box.innerHTML = `<div class="empty" style="color:#a02c1d;">שגיאה: ${esc(error.message)}</div>`; return; }
  ALL_RECORDINGS = data || [];
  const userSel = document.getElementById('filterUser');
  const seen = new Map();
  ALL_RECORDINGS.forEach(m=>{
    const p = m.profiles;
    const label = p ? ((p.full_name && p.full_name.trim()) ? p.full_name : p.email) : 'לא ידוע';
    if (m.created_by && !seen.has(m.created_by)) seen.set(m.created_by, label);
  });
  const currentVal = userSel.value;
  userSel.innerHTML = '<option value="">כל המשתמשים</option>' +
    [...seen.entries()].sort((a,b)=>a[1].localeCompare(b[1],'he')).map(([id,label])=>`<option value="${id}">${esc(label)}</option>`).join('');
  userSel.value = currentVal;
  renderAllRecordings();
}

function renderAllRecordings(){
  const box = document.getElementById('allRecordingsList');
  const userFilter = document.getElementById('filterUser').value;
  const sortMode = document.getElementById('sortAll').value;
  let list = ALL_RECORDINGS.slice();
  if (userFilter) list = list.filter(m=>m.created_by===userFilter);
  const ownerLabel = m => { const p=m.profiles; return p ? ((p.full_name && p.full_name.trim()) ? p.full_name : p.email) : 'לא ידוע'; };
  if (sortMode==='date_asc') list.sort((a,b)=>(a.meeting_date||'').localeCompare(b.meeting_date||''));
  else if (sortMode==='user') list.sort((a,b)=>ownerLabel(a).localeCompare(ownerLabel(b),'he') || (b.meeting_date||'').localeCompare(a.meeting_date||''));
  else list.sort((a,b)=>(b.meeting_date||'').localeCompare(a.meeting_date||''));
  if (!list.length){ box.innerHTML = '<div class="empty">אין הקלטות תואמות.</div>'; return; }
  box.innerHTML = list.map(m=>`
    <div class="rec-card">
      <div class="rec-title">🎙️ ${esc(m.title || m.meeting_type || 'הקלטה')}<span class="rec-type-badge">${recTypeLabel(m)}</span></div>
      <div class="rec-meta">${fmtDate(m.meeting_date)} ${m.start_time?('· '+m.start_time.slice(0,5)):''}${m.location?(' · '+esc(m.location)):''}</div>
      <div class="rec-owner">👤 ${esc(ownerLabel(m))}</div>
      ${m.summary_text ? `<div class="rec-summary">${esc(m.summary_text).slice(0,220)}${m.summary_text.length>220?'…':''}</div>` : ''}
      <div class="rec-actions">
        <button class="btn btn-ghost" onclick='window.viewStandaloneMeetingPdf(${JSON.stringify(m)})'>👁️ צפה</button>
        <button class="btn btn-ghost" onclick='window.downloadStandaloneMeetingPdf(${JSON.stringify(m)})'>📄 הורד PDF</button>
        <button class="btn btn-ghost" onclick='window.sendStandaloneMeetingEmail(${JSON.stringify(m)}, ${JSON.stringify(m.title||m.meeting_type)}, CURRENT_PROFILE)'>✉️ שלח</button>
      </div>
    </div>`).join('');
}

(async function init(){
  CURRENT_PROFILE = await requireAuth();
  if (!CURRENT_PROFILE) return;
  document.getElementById('headerUserInfo').textContent = ((CURRENT_PROFILE.full_name && CURRENT_PROFILE.full_name.trim()) ? CURRENT_PROFILE.full_name : CURRENT_PROFILE.email) + ' · ' + new Date().toLocaleDateString('he-IL') + ' ' + new Date().toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
  if (CURRENT_PROFILE.role === 'admin' || CURRENT_PROFILE.role === 'manager'){
    document.getElementById('recTabs').style.display = 'flex';
  }
  if (CURRENT_PROFILE.can_record !== false){
    document.getElementById('newRecBtnWrap').innerHTML = '<button class="btn btn-primary" style="margin-bottom:20px;" onclick="startGeneralRecording()">🔴 הקלטה חדשה</button>';
  } else {
    document.getElementById('newRecBtnWrap').innerHTML = '<div class="sub" style="margin-bottom:10px;">אין לך הרשאה להקליט - ניתן לצפות בהקלטות קיימות בלבד.</div>';
  }
  await loadRecordings();
})();
</script>
</body>
</html>
