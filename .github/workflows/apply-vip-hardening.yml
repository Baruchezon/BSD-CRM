name: Apply VIP Hardening Patch

on:
  push:
    branches: [feature/vip-clients]
    paths:
      - 'tools/patch-vip-hardening.py'
      - '.github/workflows/apply-vip-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vip-clients
          fetch-depth: 0
      - name: Apply deterministic VIP hardening patch
        run: python tools/patch-vip-hardening.py
      - name: Validate patched sources
        run: |
          python -m py_compile tools/patch-vip-hardening.py
          git diff --check
          grep -q 'vip_login_attempts' migrations/2026-09-17_vip_clients.sql
          grep -q 'active_seconds' migrations/2026-09-17_vip_clients.sql
          grep -q 'LOGIN_MAX_FAILURES' supabase/functions/vip-api/index.ts
          grep -q 'session_time' supabase/functions/vip-api/index.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check patched Edge Function
        run: deno check supabase/functions/vip-api/index.ts
      - name: Commit patch to feature branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'BSD VIP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add migrations/2026-09-17_vip_clients.sql supabase/functions/vip-api/index.ts .github/scripts/test-vip-migration.sql
          git commit -m 'Harden VIP login and track active session time'
          git push origin HEAD:feature/vip-clients
