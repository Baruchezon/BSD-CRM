name: Apply VIP Admin Metrics Patch

on:
  push:
    branches: [feature/vip-clients]
    paths:
      - 'tools/patch-vip-admin-metrics.py'
      - '.github/workflows/apply-vip-admin-metrics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vip-clients
          fetch-depth: 0
      - name: Patch VIP admin metrics
        run: python tools/patch-vip-admin-metrics.py
      - name: Validate patched admin page
        run: |
          git diff --check
          grep -q 'זמן באתר' vip-admin.html
          grep -q 'active_seconds' vip-admin.html
          grep -q 'business_label' vip-admin.html
      - name: Commit patch to feature branch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'BSD VIP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add vip-admin.html
          git commit -m 'Show VIP active time and viewed businesses in admin'
          git push origin HEAD:feature/vip-clients
