name: Apply VIP Final Admin Patch

on:
  push:
    branches: [feature/vip-clients]
    paths:
      - 'tools/patch-vip-final-admin.py'
      - '.github/workflows/apply-vip-final-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vip-clients
          fetch-depth: 0
      - name: Apply final VIP admin patch
        run: python tools/patch-vip-final-admin.py
      - name: Validate patched sources
        run: |
          git diff --check
          grep -q 'vip-interest:' supabase/functions/vip-api/index.ts
          grep -q 'file_label' supabase/functions/vip-api/index.ts
          grep -q 'recent_sessions' supabase/functions/vip-api/index.ts
          grep -q 'שלח ב WhatsApp' vip-admin.html
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check supabase/functions/vip-api/index.ts
      - name: Commit patch to feature branch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'BSD VIP Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/vip-api/index.ts vip-admin.html
          git commit -m 'Complete VIP admin alerts and detailed activity audit'
          git push origin HEAD:feature/vip-clients
