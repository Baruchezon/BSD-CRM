# VIP preview safety suite v5 final clean branch
name: VIP Preview Checks

on:
  pull_request:
    paths:
      - 'js/vip-crm-integration.js'
      - 'js/vip-ui-fixes.js'
      - 'js/config.js'
      - 'vip-admin.html'
      - 'migrations/2026-09-17_vip_clients.sql'
      - 'supabase/functions/vip-api/**'
      - '.github/scripts/test-vip-migration.sql'
      - '.github/scripts/test-vip-ui-fixes.mjs'
      - '.github/workflows/vip-preview-checks.yml'
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function TypeScript
        run: deno check supabase/functions/vip-api/index.ts
      - name: Check CRM integration JavaScript syntax
        run: node --check js/vip-crm-integration.js
      - name: Check config JavaScript syntax
        run: node --check js/config.js
      - name: Check VIP UI JavaScript syntax
        run: node --check js/vip-ui-fixes.js
      - name: Test VIP UI mutation safety
        run: node --test .github/scripts/test-vip-ui-fixes.mjs
      - name: Verify VIP safety and management gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q "confidentiality_level <> 1" migrations/2026-09-17_vip_clients.sql
          grep -q "document_type, '') <> 'anonymous_summary'" migrations/2026-09-17_vip_clients.sql
          grep -q "enable row level security" migrations/2026-09-17_vip_clients.sql
          grep -q "revoke all on public.vip_accounts from anon, authenticated" migrations/2026-09-17_vip_clients.sql
          grep -q "vip_login_attempts" migrations/2026-09-17_vip_clients.sql
          grep -q "active_seconds" migrations/2026-09-17_vip_clients.sql
          grep -q "LOGIN_MAX_FAILURES" supabase/functions/vip-api/index.ts
          grep -q "session_time" supabase/functions/vip-api/index.ts
          grep -q "vip-interest:" supabase/functions/vip-api/index.ts
          grep -q "recent_sessions" supabase/functions/vip-api/index.ts
          grep -q "file_label" supabase/functions/vip-api/index.ts
          grep -q "active_seconds" vip-admin.html
          grep -q "שלח ב WhatsApp" vip-admin.html
      - name: Ensure no service role key is committed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, sys
          roots = [Path('js'), Path('supabase/functions'), Path('migrations'), Path('vip-admin.html')]
          patterns = [
              re.compile(r'sb_secret_[A-Za-z0-9._-]{20,}'),
              re.compile(r'SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*["\'][A-Za-z0-9._-]{20,}["\']'),
          ]
          bad = []
          files = []
          for root in roots:
              if root.is_file(): files.append(root)
              elif root.exists(): files += [p for p in root.rglob('*') if p.is_file()]
          for p in files:
              try: text = p.read_text(errors='ignore')
              except Exception: continue
              for pat in patterns:
                  if pat.search(text): bad.append(str(p))
          if bad:
              print('Potential committed service-role secret in:', ', '.join(sorted(set(bad))))
              sys.exit(1)
          PY

  database-safety-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply VIP migration to isolated PostgreSQL and test safety rules
        run: psql -h 127.0.0.1 -U postgres -d postgres -f .github/scripts/test-vip-migration.sql
