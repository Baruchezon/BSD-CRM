name: VIP Preview Checks

on:
  pull_request:
    paths:
      - 'js/vip-crm-integration.js'
      - 'js/config.js'
      - 'vip-admin.html'
      - 'migrations/2026-09-17_vip_clients.sql'
      - 'supabase/functions/vip-api/**'
      - '.github/workflows/vip-preview-checks.yml'
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function TypeScript
        run: deno check supabase/functions/vip-api/index.ts
      - name: Check CRM integration JavaScript syntax
        run: node --check js/vip-crm-integration.js
      - name: Check config JavaScript syntax
        run: node --check js/config.js
      - name: Verify VIP migration safety gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q "confidentiality_level <> 1" migrations/2026-09-17_vip_clients.sql
          grep -q "document_type, '') <> 'anonymous_summary'" migrations/2026-09-17_vip_clients.sql
          grep -q "enable row level security" migrations/2026-09-17_vip_clients.sql
          grep -q "revoke all on public.vip_accounts from anon, authenticated" migrations/2026-09-17_vip_clients.sql
      - name: Ensure no service role key is committed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, sys
          roots = [Path('js'), Path('supabase/functions'), Path('migrations'), Path('vip-admin.html')]
          patterns = [
              re.compile(r'sb_secret_[A-Za-z0-9._-]{20,}'),
              re.compile(r'SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*["\'][A-Za-z0-9._-]{20,}["\']'),
          ]
          bad = []
          files = []
          for root in roots:
              if root.is_file(): files.append(root)
              elif root.exists(): files += [p for p in root.rglob('*') if p.is_file()]
          for p in files:
              try: text = p.read_text(errors='ignore')
              except Exception: continue
              for pat in patterns:
                  if pat.search(text): bad.append(str(p))
          if bad:
              print('Potential committed service-role secret in:', ', '.join(sorted(set(bad))))
              sys.exit(1)
          PY
