name: Add BSD site admin link
on:
  push:
    paths:
      - '.github/workflows/add-site-admin-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep site admin navigation current
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.html')
          s = app.read_text(encoding='utf-8')
          for old in [
              'href="site-admin.html"',
              'href="site-admin.html?v=2026090703"',
              'href="site-admin.html?v=2026090704"'
          ]:
              if old in s:
                  s = s.replace(old, 'href="site-admin.html?v=2026090710"', 1)
          if 'href="site-admin.html?v=2026090710"' not in s:
              marker = '<a href="users.html" style="display:block;color:#fff;text-decoration:none;padding:11px 16px;font-size:.85rem;border-top:1px solid rgba(255,255,255,.08);">👥 משתמשים</a>'
              link = '<a href="site-admin.html?v=2026090710" style="display:block;color:#fff;text-decoration:none;padding:11px 16px;font-size:.85rem;border-top:1px solid rgba(255,255,255,.08);">🌐 ניהול אתר BSD</a>'
              if marker not in s:
                  raise SystemExit('navigation marker not found')
              s = s.replace(marker, marker + '\n      ' + link, 1)
          app.write_text(s, encoding='utf-8')

          page = Path('site-admin.html')
          h = page.read_text(encoding='utf-8')
          old_head = '<div class="cardhead"><h3>תוכן וכתבות</h3></div>'
          new_head = '<div class="cardhead"><h3>תוכן וכתבות</h3><a class="btn primary" href="site-content-editor.html?v=2026090710">ניהול תוכן מלא</a></div>'
          if old_head in h:
              h = h.replace(old_head, new_head, 1)
          elif 'site-content-editor.html' not in h:
              raise SystemExit('content panel marker not found')
          h = h.replace('site-admin-v2.js?v=2026090703','site-admin-v2.js?v=2026090710')
          h = h.replace('site-admin-v2.js?v=2026090704','site-admin-v2.js?v=2026090710')
          h = h.replace('site-admin-v2.js?v=2026090705','site-admin-v2.js?v=2026090710')
          page.write_text(h, encoding='utf-8')
          PY
          git config user.name "BSD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.html site-admin.html
          git diff --cached --quiet || git commit -m "Connect BSD content editor"
          git push
