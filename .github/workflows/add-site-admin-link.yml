name: Add BSD site admin link
on:
  push:
    paths:
      - '.github/workflows/add-site-admin-link.yml'
      - 'js/site-content-ai.js'
      - 'js/site-content-finalize.js'
      - 'js/site-admin-v2.js'
      - 'js/site-admin-v3-fixes.js'
      - 'js/site-analytics.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify site admin JavaScript syntax
        run: |
          node --check js/site-content-ai.js
          node --check js/site-content-finalize.js
          node --check js/site-admin-v2.js
          node --check js/site-admin-v3-fixes.js
          node --check js/site-analytics.js
      - name: Keep site admin navigation current
        run: |
          python - <<'PY'
          from pathlib import Path

          VERSION = '2026091307'

          app = Path('app.html')
          s = app.read_text(encoding='utf-8')
          import re
          if re.search(r'href="site-admin\.html(?:\?v=\d+)?"', s):
              s = re.sub(r'href="site-admin\.html(?:\?v=\d+)?"', f'href="site-admin.html?v={VERSION}"', s, count=1)
          else:
              marker = '<a href="users.html" style="display:block;color:#fff;text-decoration:none;padding:11px 16px;font-size:.85rem;border-top:1px solid rgba(255,255,255,.08);">👥 משתמשים</a>'
              link = f'<a href="site-admin.html?v={VERSION}" style="display:block;color:#fff;text-decoration:none;padding:11px 16px;font-size:.85rem;border-top:1px solid rgba(255,255,255,.08);">🌐 ניהול אתר BSD</a>'
              if marker not in s:
                  raise SystemExit('navigation marker not found')
              s = s.replace(marker, marker + '\n      ' + link, 1)
          app.write_text(s, encoding='utf-8')

          page = Path('site-admin.html')
          h = page.read_text(encoding='utf-8')
          h = re.sub(r'site-admin-v3\.html\?v=\d+', f'site-admin-v3.html?v={VERSION}', h)
          page.write_text(h, encoding='utf-8')

          v3 = Path('site-admin-v3.html')
          v = v3.read_text(encoding='utf-8')
          if 'js/site-admin-v3-fixes.js' not in v:
              v = v.replace('</body>', f'<script src="js/site-admin-v3-fixes.js?v={VERSION}"></script></body>', 1)
          else:
              v = re.sub(r'js/site-admin-v3-fixes\.js\?v=\d+', f'js/site-admin-v3-fixes.js?v={VERSION}', v)
          v3.write_text(v, encoding='utf-8')

          editor = Path('site-content-editor.html')
          e = editor.read_text(encoding='utf-8')
          if 'js/site-content-ai.js' not in e:
              e = e.replace('</body>', f'<script src="js/site-content-ai.js?v={VERSION}"></script></body>', 1)
          else:
              e = re.sub(r'js/site-content-ai\.js\?v=\d+', f'js/site-content-ai.js?v={VERSION}', e)
          if 'js/site-content-finalize.js' not in e:
              e = e.replace('</body>', f'<script src="js/site-content-finalize.js?v={VERSION}"></script></body>', 1)
          else:
              e = re.sub(r'js/site-content-finalize\.js\?v=\d+', f'js/site-content-finalize.js?v={VERSION}', e)
          editor.write_text(e, encoding='utf-8')
          PY
          git config user.name "BSD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.html site-admin.html site-admin-v3.html site-content-editor.html
          git diff --cached --quiet || git commit -m "Refresh BSD content editor assets"
          git push
