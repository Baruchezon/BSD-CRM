<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<script>
// בדיקת גרסה אוטומטית - אותו מנגנון בדיוק כמו בכל שאר דפי המערכת (ראו הסבר
// ב-match-detail.html) - נוסף כאן כדי שהדף החדש הזה לא יסבול מאותה בעיה
// שהתגלתה היום בדפים אחרים (PAGE_BUILD לא מתעדכן = לא נתפס דף מקאש ישן).
(function(){
  try{
    var PAGE_BUILD = '202608192351';
    window.PAGE_BUILD = PAGE_BUILD;
    var loopGuard = sessionStorage.getItem('bsd_ver_reload_guard');
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){
        var serverBuild = (v.version || '').replace(/\D/g,'');
        if (serverBuild && serverBuild !== PAGE_BUILD && loopGuard !== serverBuild){
          sessionStorage.setItem('bsd_ver_reload_guard', serverBuild);
          var url = new URL(location.href);
          url.searchParams.set('_cb', Date.now());
          location.replace(url.toString());
        }
      })
      .catch(function(){});
  } catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ליד חדש - BSD CRM</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --navy:#0e1b34; --gold:#d4af6a; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#0e1b34 0%,#1c2f4d 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  /* עיצוב זהה במכוון לתבנית של task-alert.html (שכבר עובדת היטב ומידתית
     בטלפון) - כרטיס ממורכז, לא "מרחף" עם ריפוד ריק גדול למעלה. */
  .card{
    width:100%; max-width:480px; background:#fff; border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.4); overflow:hidden;
    animation:pop .35s ease; max-height:92vh; display:flex; flex-direction:column;
  }
  @keyframes pop{ from{transform:scale(.92);opacity:0;} to{transform:scale(1);opacity:1;} }
  .card-top{ background:var(--navy); color:#fff; padding:20px 24px 16px; text-align:center; flex-shrink:0; }
  .card-top .icon{ font-size:2.4rem; margin-bottom:4px; }
  .card-top .kicker{ font-size:.8rem; color:var(--gold); font-weight:700; letter-spacing:.5px; }
  .card-body{ padding:20px 24px 6px; overflow-y:auto; }
  .lead-name{ font-size:1.3rem; font-weight:800; color:var(--navy); margin:0 0 12px; line-height:1.35; text-align:center; }
  .lead-name.unnamed{ color:#a3673a; font-style:italic; }
  .info-row{ display:flex; justify-content:space-between; gap:10px; font-size:.88rem; padding:8px 0; border-bottom:1px solid #f0eee6; }
  .info-row:last-of-type{ border-bottom:none; }
  .info-row .k{ color:#8a8578; flex-shrink:0; }
  .info-row .v{ color:#2a2f3a; font-weight:600; text-align:left; direction:ltr; }
  .info-row .v.rtl{ direction:rtl; text-align:right; }
  .type-badge{ display:inline-block; padding:3px 12px; border-radius:20px; font-size:.78rem; font-weight:700; }
  .type-buyer{ background:#e3edfa; color:#2b6fc9; }
  .type-seller{ background:#faf1d9; color:#8a6d1f; }
  .type-partner{ background:#f0e5fb; color:#7a3fd1; }
  .review-flag{ background:#fff3d6; color:#8a6d1f; border:1px solid #e8cf8a; border-radius:8px; padding:8px 10px; font-size:.8rem; margin-top:10px; }
  .msg-box{ background:#f7f5ee; border-radius:10px; padding:12px 14px; margin:12px 0 2px; font-size:.85rem; color:#40485c; text-align:right; white-space:pre-wrap; max-height:110px; overflow-y:auto; }
  .saved-note{ display:flex; align-items:center; gap:6px; justify-content:center; color:#2e7d4f; font-size:.82rem; font-weight:700; margin:14px 0 2px; }
  .duplicate-note{ background:#eef4fb; border:1px solid #cddcef; border-radius:8px; padding:10px 12px; font-size:.8rem; color:#2b537d; margin:12px 0 2px; text-align:right; }
  .actions{ padding:16px 24px 22px; display:flex; flex-direction:column; gap:9px; flex-shrink:0; }
  button.action{
    border:none; border-radius:12px; padding:14px 16px; font-family:inherit;
    font-size:.95rem; font-weight:700; cursor:pointer;
    box-shadow:
      0 1px 0 rgba(255,255,255,.3) inset,
      0 -2px 4px rgba(0,0,0,.1) inset,
      0 3px 0 rgba(14,27,52,.18),
      0 6px 14px rgba(14,27,52,.14);
    transform:translateY(0);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, filter .16s ease;
  }
  button.action:hover{ transform:translateY(-2px); filter:brightness(1.04); }
  button.action:active{ transform:translateY(1px); filter:brightness(.98); }
  .btn-confirm{ background:linear-gradient(180deg,#3fa96b,#2e7d4f); color:#fff; }
  .btn-edit{ background:#eef1f6; color:var(--navy); }
  .btn-reject{ background:#fff; color:#a02c1d; border:1.5px solid #e4b3ac !important; }
  .loading, .error-state{ padding:60px 24px; text-align:center; color:#fff; }
  .spinner{ width:34px;height:34px;border:3px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{transform:rotate(360deg);} }
  .done-state{ padding:50px 24px; text-align:center; }
  .done-state .icon{ font-size:3rem; }
  .done-state p{ color:var(--navy); font-weight:700; font-size:1.1rem; margin-top:10px; }
</style>
</head>
<body>

<div id="root" class="card">
  <div class="loading">
    <div class="spinner"></div>
    טוען ליד...
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
const params = new URLSearchParams(location.search);
const leadId = params.get('id');
const kind = params.get('kind') || 'new'; // 'new' | 'repeat'
const root = document.getElementById('root');

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtDate(d){
  if (!d) return '';
  try { return new Date(d).toLocaleString('he-IL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return d; }
}

async function requireLogin(){
  const { data: { user } } = await window.supabaseClient.auth.getUser();
  if (!user){
    location.href = `login.html?redirect=${encodeURIComponent(location.pathname + location.search)}`;
    return null;
  }
  return user;
}

function typeLabel(type){
  return type === 'seller' ? 'רוצה למכור עסק' : type === 'partner' ? 'משקיע' : 'מחפש לרכוש עסק';
}
function typeBadgeClass(type){
  return type === 'seller' ? 'type-seller' : type === 'partner' ? 'type-partner' : 'type-buyer';
}

async function loadLead(){
  if (!leadId){
    root.innerHTML = `<div class="error-state">
      <div style="font-size:2.5rem;">⚠️</div>
      <p style="color:#40485c;margin-top:10px;">לא סופק מזהה ליד.</p>
      <button class="action btn-edit" style="margin-top:16px;" onclick="location.href='leads.html'">לרשימת הלידים</button>
    </div>`;
    return;
  }
  const user = await requireLogin();
  if (!user) return;

  const { data: lead, error } = await window.supabaseClient.from('leads').select('*').eq('id', leadId).maybeSingle();
  if (error || !lead){
    root.innerHTML = `<div class="error-state">
      <div style="font-size:2.5rem;">❓</div>
      <p style="color:#40485c;margin-top:10px;">הליד לא נמצא (ייתכן שנמחק).</p>
      <button class="action btn-edit" style="margin-top:16px;" onclick="location.href='leads.html'">לרשימת הלידים</button>
    </div>`;
    return;
  }
  renderLead(lead);
}

function renderLead(lead){
  const name = lead.full_name || 'שם לא זוהה';
  const isUnnamed = name === 'שם לא זוהה';
  const iconIntro = kind === 'repeat' ? '🔁' : '🆕';
  const kickerText = kind === 'repeat' ? 'פנייה חוזרת מהאתר' : 'ליד חדש מהאתר';
  // ניחוש "מטרה" מתוך ההערות שנכתבו ע"י הפונקציה האוטומטית (השורה הראשונה הרלוונטית),
  // כדי לא לשכפל שדה DB חדש רק בשביל תצוגה - כל המידע כבר בהערות.
  const notesPreview = (lead.notes || '').split('\n').filter(l => l.trim() && !l.startsWith('⚠️') && !l.startsWith('[')).slice(0,3).join('\n');

  root.innerHTML = `
    <div class="card-top">
      <div class="icon">${iconIntro}</div>
      <div class="kicker">${kickerText}</div>
    </div>
    <div class="card-body">
      <p class="lead-name ${isUnnamed ? 'unnamed' : ''}">${esc(name)}</p>
      <div class="info-row"><span class="k">סוג</span><span class="v rtl"><span class="type-badge ${typeBadgeClass(lead.type)}">${typeLabel(lead.type)}</span></span></div>
      ${lead.phone ? `<div class="info-row"><span class="k">טלפון</span><span class="v">${esc(lead.phone)}</span></div>` : ''}
      ${lead.email ? `<div class="info-row"><span class="k">אימייל</span><span class="v">${esc(lead.email)}</span></div>` : ''}
      ${lead.city ? `<div class="info-row"><span class="k">עיר</span><span class="v rtl">${esc(lead.city)}</span></div>` : ''}
      <div class="info-row"><span class="k">מקור</span><span class="v rtl">${esc(lead.source || '—')}</span></div>
      <div class="info-row"><span class="k">התקבל</span><span class="v rtl">${fmtDate(lead.created_at)}</span></div>
      ${notesPreview ? `<div class="msg-box">${esc(notesPreview)}</div>` : ''}
      ${(lead.notes || '').includes('⚠️ לא ניתן היה לסווג') ? '<div class="review-flag">⚠️ המערכת לא הצליחה לסווג את הפנייה בוודאות (קונה/מוכר/משקיע) - נדרשת בדיקה ידנית לפני שממשיכים.</div>' : ''}
      ${kind === 'repeat' ? `<div class="duplicate-note">🔁 הטלפון/מייל של הפנייה הזו כבר שייכים לרשומה קיימת - הפנייה החדשה צורפה כהערה לרשומה הזו, לא נוצר כרטיס כפול.</div>` : ''}
      <div class="saved-note">✅ הליד שמור במערכת</div>
    </div>
    <div class="actions">
      <button class="action btn-confirm" onclick="confirmAndClose()">✅ אשר - הליד ברשימה</button>
      <button class="action btn-edit" onclick="editLead()">✏️ ערוך את הליד</button>
      <button class="action btn-reject" onclick="rejectLead()">🗑️ דחה ומחק ליד</button>
    </div>
  `;
}

function confirmAndClose(){
  // הליד כבר שמור בפועל בבסיס הנתונים ברגע שההתראה נשלחה - "אישור" כאן הוא
  // רק מעבר לרשימת הלידים כדי לראות אותו שם, בלי ?open= בכתובת (כדי לא
  // לגרום לטופס העריכה להיפתח שוב אוטומטית).
  location.href = 'leads.html';
}

function editLead(){
  location.href = `leads.html?open=${encodeURIComponent(leadId)}`;
}

async function rejectLead(){
  if (!confirm('למחוק את הליד הזה לגמרי? הפעולה אינה הפיכה.')) return;
  root.innerHTML = `<div class="loading" style="color:var(--navy);"><div class="spinner" style="border-color:rgba(14,27,52,.2);border-top-color:var(--navy);"></div>מוחק...</div>`;
  // מוחקים גם משימות פתוחות שקושרו לליד הזה (כמו "צור קשר עם ליד חדש מהאתר"),
  // אחרת נשארת משימה יתומה שמצביעה על ליד שכבר לא קיים.
  await window.supabaseClient.from('tasks').delete().eq('related_type', 'lead').eq('related_id', leadId);
  const { error } = await window.supabaseClient.from('leads').delete().eq('id', leadId);
  if (error){
    root.innerHTML = `<div class="error-state" style="color:var(--navy);">
      <div style="font-size:2.5rem;">⚠️</div>
      <p style="margin-top:10px;">שגיאה במחיקה: ${esc(error.message)}</p>
      <button class="action btn-edit" style="margin-top:16px;" onclick="location.href='leads.html'">לרשימת הלידים</button>
    </div>`;
    return;
  }
  root.innerHTML = `
    <div class="done-state">
      <div class="icon">🗑️</div>
      <p>הליד נמחק.</p>
      <button class="action btn-edit" style="margin-top:16px;" onclick="location.href='leads.html'">לרשימת הלידים</button>
    </div>
  `;
}

loadLead();
</script>
</body>
</html>
