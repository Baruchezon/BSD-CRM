<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>BSD ניהול תוכן וכתבות</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=2026090706"></script><script src="js/supabaseClient.js?v=2026090706"></script>
<style>
:root{--bg:#071423;--panel:#0d2033;--line:#244c68;--text:#f5f8fc;--muted:#9cb0c4;--gold:#d8ad4f;--blue:#5aa7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Heebo,sans-serif}.wrap{max-width:1260px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top h1{margin:0}.top p{margin:4px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #31546d;background:#102942;color:#fff;border-radius:10px;padding:9px 13px;font:inherit;cursor:pointer;text-decoration:none}.btn.primary{background:linear-gradient(135deg,#e0bd6a,#c38e2f);color:#111;border:0;font-weight:800}.btn.danger{background:#43222a;border-color:#874554}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:16px;overflow:hidden}.cardhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.cardbody{padding:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.input,.select,.textarea{width:100%;background:#081a2a;color:#fff;border:1px solid #2a506a;border-radius:10px;padding:10px 12px;font:inherit}.toolbar .input{max-width:360px}.toolbar .select{max-width:180px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:right;padding:10px;border-bottom:1px solid #173650;font-size:13px}.table th{font-size:12px;color:#a5b5c5}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px}.tag.on{background:#113b2a;color:#a8f2c5}.tag.warn{background:#392c1a;color:#ffe0a2}.overlay{display:none;position:fixed;inset:0;background:rgba(1,7,12,.78);z-index:20;align-items:center;justify-content:center;padding:14px}.overlay.show{display:flex}.modal{width:min(980px,100%);max-height:95vh;overflow:auto;background:#0b1c2d;border:1px solid #345b76;border-radius:17px}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid var(--line)}.modalbody{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:#aab8c6;margin-bottom:5px}.textarea.body{min-height:300px;font-family:Consolas,monospace;direction:rtl}.muted{color:var(--muted);font-size:11px}.notice{padding:10px 12px;border-radius:10px;background:#122b43;color:#cfe1f3;margin-bottom:12px}.loading{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#102a42;border:1px solid #37617e;border-radius:999px;padding:9px 16px;z-index:50}.toast{position:fixed;bottom:18px;left:18px;z-index:60;background:#12344b;border:1px solid #35637d;border-radius:10px;padding:11px 14px;opacity:0;transition:.2s}.toast.show{opacity:1}.toast.err{background:#40202a;border-color:#93485c}@media(max-width:760px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start}.table{min-width:760px}}
</style></head><body>
<div id="loading" class="loading">טוען תוכן</div><div class="wrap"><header class="top"><div><h1>תוכן וכתבות</h1><p>ניהול כתבות, SEO ותמונות מתוך BSD</p></div><div class="actions"><a class="btn" href="site-admin.html">חזרה לניהול האתר</a><button class="btn primary" id="newBtn">כתבה חדשה</button></div></header>
<div class="card"><div class="cardhead"><b>מרכז הידע</b><span id="count" class="muted"></span></div><div class="cardbody"><div class="toolbar"><input id="search" class="input" placeholder="חיפוש לפי כותרת, מילת מפתח או URL"><select id="filter" class="select"><option value="all">הכל</option><option value="published">מפורסם</option><option value="draft">טיוטה</option></select></div></div><div class="tablewrap"><table class="table"><thead><tr><th>כותרת</th><th>סטטוס</th><th>מילת מפתח</th><th>SEO</th><th>מקור</th><th>עודכן</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div id="modal" class="overlay"><div class="modal"><div class="modalhead"><h3 id="modalTitle">עריכת כתבה</h3><button class="btn" id="closeBtn">סגור</button></div><div class="modalbody"><div id="sourceNotice" class="notice" hidden></div><input type="hidden" id="id"><div class="grid"><div class="field full"><label>כותרת</label><input class="input" id="title"></div><div class="field"><label>Slug</label><input class="input" id="slug"></div><div class="field"><label>סטטוס</label><select class="select" id="status"><option value="draft">טיוטה</option><option value="published">מפורסם</option></select></div><div class="field"><label>מילת מפתח מרכזית</label><input class="input" id="keyword"></div><div class="field"><label>מחבר</label><input class="input" id="author" value="BSD"></div><div class="field full"><label>תקציר</label><textarea class="textarea" id="excerpt"></textarea></div><div class="field full"><label>SEO Title</label><input class="input" id="seoTitle"></div><div class="field full"><label>Meta Description</label><textarea class="textarea" id="seoDescription"></textarea></div><div class="field full"><label>URL מקור קיים</label><input class="input" id="sourceUrl" placeholder="לא משנים כתובת קיימת בלי בדיקה"></div><div class="field full"><label>תמונת כותרת URL</label><input class="input" id="imageUrl"></div><div class="field full"><label>הנחיה לתמונת AI</label><textarea class="textarea" id="imagePrompt"></textarea></div><div class="field full"><label>תוכן הכתבה HTML</label><textarea class="textarea body" id="body" placeholder="אפשר לכתוב HTML פשוט כגון h2, p, ul, strong"></textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveBtn">שמור</button><button class="btn" id="openSourceBtn">פתח מקור</button></div></div></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), S={profile:null,items:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,e=false){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' err':'');clearTimeout(toast.x);toast.x=setTimeout(()=>t.classList.remove('show'),3000)}
function seoScore(c){let s=0;if((c.seo_title||'').length>=25)s+=35;if((c.seo_description||'').length>=80)s+=35;if(c.focus_keyword)s+=20;if(c.slug)s+=10;return s}
async function auth(){const c=window.supabaseClient;const {data:s}=await c.auth.getSession();if(!s?.session){location.href='login.html';return null}const {data:p,error}=await c.from('profiles').select('id,role,status').eq('id',s.session.user.id).single();if(error)throw error;if(!p||p.status==='blocked'||!['admin','manager'].includes(p.role))throw new Error('אין הרשאה לניהול תוכן');return p}
async function load(){const {data,error}=await window.supabaseClient.from('site_content').select('*').order('updated_at',{ascending:false});if(error)throw error;S.items=data||[];render()}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const a=S.items.filter(x=>(f==='all'||x.status===f)&&(!q||[x.title,x.focus_keyword,x.slug,x.source_url].some(v=>String(v||'').toLowerCase().includes(q))));$('count').textContent=a.length+' פריטים';$('rows').innerHTML=a.length?a.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="muted">${esc(x.slug)}</div></td><td>${x.status==='published'?'<span class="tag on">מפורסם</span>':'<span class="tag warn">טיוטה</span>'}</td><td>${esc(x.focus_keyword||'')}</td><td>${seoScore(x)}%</td><td>${x.source_url?'<a class="btn" target="_blank" href="'+esc(x.source_url)+'">פתח</a>':'<span class="muted">לא זוהה</span>'}</td><td>${x.updated_at?new Date(x.updated_at).toLocaleDateString('he-IL'):''}</td><td><button class="btn" data-edit="${esc(x.id)}">ערוך</button></td></tr>`).join(''):'<tr><td colspan="7">אין תוכן</td></tr>'}
function clearForm(){['id','title','slug','keyword','excerpt','seoTitle','seoDescription','sourceUrl','imageUrl','imagePrompt','body'].forEach(id=>$(id).value='');$('author').value='BSD';$('status').value='draft';$('sourceNotice').hidden=true;$('openSourceBtn').style.display='none';$('modalTitle').textContent='כתבה חדשה'}
function edit(id){const x=S.items.find(i=>i.id===id);if(!x)return;$('id').value=x.id;$('title').value=x.title||'';$('slug').value=x.slug||'';$('status').value=x.status||'draft';$('keyword').value=x.focus_keyword||'';$('author').value=x.author_name||'BSD';$('excerpt').value=x.excerpt||'';$('seoTitle').value=x.seo_title||'';$('seoDescription').value=x.seo_description||'';$('sourceUrl').value=x.source_url||'';$('imageUrl').value=x.featured_image_url||'';$('imagePrompt').value=x.featured_image_prompt||'';$('body').value=x.editor_html||x.body_html||'';$('modalTitle').textContent='עריכת כתבה';$('sourceNotice').hidden=!x.source_url;$('sourceNotice').textContent=x.source_url?'זו כתבה קיימת באתר. כתובת המקור נשמרת כדי לא לפגוע ב SEO.':'';$('openSourceBtn').style.display=x.source_url?'inline-block':'none';$('modal').classList.add('show')}
async function save(){const id=$('id').value;const p={content_type:'article',status:$('status').value,title:$('title').value.trim(),slug:$('slug').value.trim(),focus_keyword:$('keyword').value.trim()||null,author_name:$('author').value.trim()||'BSD',excerpt:$('excerpt').value.trim()||null,seo_title:$('seoTitle').value.trim()||null,seo_description:$('seoDescription').value.trim()||null,source_url:$('sourceUrl').value.trim()||null,featured_image_url:$('imageUrl').value.trim()||null,featured_image_prompt:$('imagePrompt').value.trim()||null,editor_html:$('body').value,body_html:$('body').value,ai_status:'manual',updated_by:S.profile.id,updated_at:new Date().toISOString()};if(!p.title||!p.slug)return toast('חובה למלא כותרת ו Slug',true);if(p.status==='published')p.published_at=new Date().toISOString();let r;if(id)r=await window.supabaseClient.from('site_content').update(p).eq('id',id);else{p.created_by=S.profile.id;r=await window.supabaseClient.from('site_content').insert(p)}if(r.error)return toast('שמירה נכשלה: '+r.error.message,true);toast('נשמר');$('modal').classList.remove('show');await load()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(b)edit(b.dataset.edit)});$('newBtn').onclick=()=>{clearForm();$('modal').classList.add('show')};$('closeBtn').onclick=()=>$('modal').classList.remove('show');$('saveBtn').onclick=save;$('openSourceBtn').onclick=()=>{const u=$('sourceUrl').value.trim();if(u)window.open(u,'_blank')};$('search').oninput=render;$('filter').onchange=render;
(async()=>{try{S.profile=await auth();if(!S.profile)return;await load()}catch(e){toast(e.message||String(e),true)}finally{$('loading').hidden=true}})();
</script><script src="js/site-content-ai.js?v=2026090713"></script></body></html>
