<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>BSD CRM - כניסה למערכת</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
  /* גובר במפורש על .login-card button (שהופך כפתורים לרוחב מלא) - רק לכפתור הצגת/הסתרת הסיסמה */
  .login-card button.pwd-toggle-btn{
    width:auto !important;
    height:auto !important;
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    background:none !important;
    border:none !important;
    box-shadow:none !important;
    cursor:pointer;
    font-size:1.1rem;
    padding:4px !important;
    line-height:1;
    min-height:0 !important;
  }
  .login-card button.pwd-toggle-btn:hover{ background:none !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>BSD CRM</h1>
    <p class="tagline">משביחים עסקים, מלווים בנאמנות, ומובילים לעסקה הנכונה</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="אימייל" required autocomplete="username" list="emailHistory">
      <datalist id="emailHistory"></datalist>
      <div style="position:relative;">
        <input type="password" id="password" placeholder="סיסמה" required autocomplete="current-password" style="padding-left:40px;">
        <button type="button" id="togglePwd" class="pwd-toggle-btn">👁️</button>
      </div>
      <button type="submit" id="loginBtn">כניסה למערכת</button>
    </form>
    <div class="login-error" id="loginError"></div>
    <div style="text-align:center;margin-top:12px;">
      <button type="button" id="forgotPwdLink" style="background:none;border:none;color:var(--gold,#c9a24b);font-family:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline;padding:4px;">שכחתי סיסמה</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
(async function checkExistingSession(){
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (session) window.location.href = 'app.html';
})();

// זיכרון אימיילים קודמים (לא סיסמאות!) - מציג רשימת השלמה אוטומטית של הדפדפן
// כשלוחצים על שדה האימייל, מבוסס על עד 6 הכתובות האחרונות שהתחברת איתן בהצלחה.
function getEmailHistory(){
  try { return JSON.parse(localStorage.getItem('bsd_email_history') || '[]'); }
  catch(e){ return []; }
}
function addToEmailHistory(email){
  let history = getEmailHistory().filter(e => e !== email);
  history.unshift(email);
  history = history.slice(0, 6);
  localStorage.setItem('bsd_email_history', JSON.stringify(history));
}
function renderEmailHistory(){
  const list = document.getElementById('emailHistory');
  list.innerHTML = getEmailHistory().map(e => `<option value="${e}">`).join('');
}
renderEmailHistory();
const history0 = getEmailHistory();
if (history0.length > 0){ document.getElementById('email').value = history0[0]; }

document.getElementById('togglePwd').addEventListener('click', function(){
  const pwd = document.getElementById('password');
  if (pwd.type === 'password'){ pwd.type = 'text'; this.textContent = '🙈'; }
  else { pwd.type = 'password'; this.textContent = '👁️'; }
});

document.getElementById('forgotPwdLink').addEventListener('click', function(){
  const overlay = document.createElement('div');
  overlay.id = 'forgotPwdOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(14,27,52,.6);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:14px;max-width:380px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:inherit;">
      <h3 style="margin:0 0 6px;color:#0e1b34;">שכחתי סיסמה</h3>
      <p style="color:#666;font-size:.82rem;margin:0 0 14px;">הזן את כתובת האימייל שלך במערכת. אם היא קיימת, תישלח אליה סיסמה זמנית חדשה.</p>
      <input type="email" id="forgotEmail" placeholder="אימייל" style="width:100%;padding:10px 12px;border:1px solid #d8d3c4;border-radius:8px;font-family:inherit;margin-bottom:10px;box-sizing:border-box;">
      <div id="forgotMsg" style="font-size:.8rem;min-height:18px;margin-bottom:8px;"></div>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button type="button" id="forgotCancelBtn" style="background:#fff;border:1px solid #d8d3c4;color:#0e1b34;padding:9px 18px;border-radius:8px;font-family:inherit;cursor:pointer;">ביטול</button>
        <button type="button" id="forgotSendBtn" style="background:#c9a24b;color:#1c2333;border:none;padding:9px 18px;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;">שלח סיסמה חדשה</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('forgotCancelBtn').addEventListener('click', () => overlay.remove());

  document.getElementById('forgotSendBtn').addEventListener('click', async function(){
    const email = document.getElementById('forgotEmail').value.trim();
    const msg = document.getElementById('forgotMsg');
    const btn = this;
    if (!email){ msg.style.color = '#b00020'; msg.textContent = 'נא להזין כתובת אימייל'; return; }
    btn.disabled = true;
    btn.textContent = 'שולח...';
    msg.style.color = '#666';
    msg.textContent = '';
    try {
      const resp = await fetch(window.BSD_CONFIG.SUPABASE_URL + '/functions/v1/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': window.BSD_CONFIG.SUPABASE_PUBLISHABLE_KEY },
        body: JSON.stringify({ email })
      });
      await resp.json().catch(() => ({}));
    } catch (e) { /* עדיין מציגים הודעה גנרית, ראה הערה למטה */ }
    // הודעה גנרית קבועה בכל מקרה - כדי לא לחשוף אילו כתובות אימייל קיימות במערכת
    msg.style.color = '#2e6b4a';
    msg.textContent = 'אם הכתובת קיימת במערכת, נשלחה אליה סיסמה זמנית חדשה.';
    btn.textContent = 'נשלח';
    setTimeout(() => overlay.remove(), 3500);
  });
});

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  btn.disabled = true;
  btn.textContent = 'מתחבר...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const result = await bsdLogin(email, password);

  if (!result.ok) {
    errBox.textContent = result.message;
    btn.disabled = false;
    btn.textContent = 'כניסה למערכת';
    return;
  }

  addToEmailHistory(email);
  window.location.href = 'app.html';
});
</script>
</body>
</html>
