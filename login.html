<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>BSD CRM - כניסה למערכת</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css?v=202608021650">
<style>
  /* גובר במפורש על .login-card button (שהופך כפתורים לרוחב מלא) - רק לכפתור הצגת/הסתרת הסיסמה */
  .login-card button.pwd-toggle-btn{
    width:auto !important;
    height:auto !important;
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    background:none !important;
    border:none !important;
    box-shadow:none !important;
    cursor:pointer;
    font-size:1.1rem;
    padding:4px !important;
    line-height:1;
    min-height:0 !important;
  }
  .login-card button.pwd-toggle-btn:hover{ background:none !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>BSD CRM</h1>
    <p class="tagline">משביחים עסקים, מלווים בנאמנות, ומובילים לעסקה הנכונה</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="אימייל" required autocomplete="username" list="emailHistory">
      <datalist id="emailHistory"></datalist>
      <div style="position:relative;">
        <input type="password" id="password" placeholder="סיסמה" required autocomplete="current-password" style="padding-left:40px;">
        <button type="button" id="togglePwd" class="pwd-toggle-btn">👁️</button>
      </div>
      <button type="submit" id="loginBtn">כניסה למערכת</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<script src="js/config.js?v=202608021650"></script>
<script src="js/supabaseClient.js?v=202608021650"></script>
<script src="js/auth.js?v=202608021650"></script>
<script>
(async function checkExistingSession(){
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (!session) return;

  if (sessionStorage.getItem('bsd_skip_fp_gate')){
    sessionStorage.removeItem('bsd_skip_fp_gate');
    return;
  }

  let showGate = false;
  try {
    showGate = isFingerprintRegistered() && await isFingerprintAvailable();
  } catch(e){ console.error('fingerprint gate check failed, continuing to app.html', e); }

  if (showGate){
    showQuickUnlockGate();
  } else {
    window.location.href = 'app.html';
  }
})();

function showQuickUnlockGate(){
  const card = document.querySelector('.login-card');
  card.innerHTML = `
    <h1>BSD CRM</h1>
    <div style="font-size:2.6rem;margin:10px 0 4px;">🔓</div>
    <p class="tagline" style="margin-bottom:6px;">אתה עדיין מחובר</p>
    <p style="color:#6c7488;font-size:.85rem;margin-bottom:22px;">אמת עם טביעת אצבע כדי להיכנס</p>
    <button id="quickUnlockBtn" style="background:#0e1b34;color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;margin-bottom:12px;">🔓 כניסה עם טביעת אצבע</button>
    <button id="quickUnlockPwdBtn" style="background:none;border:none;color:#999;font-size:.82rem;cursor:pointer;text-decoration:underline;display:block;margin:0 auto 8px;">היכנס עם סיסמה במקום</button>
    <button id="quickUnlockForgetBtn" style="background:none;border:none;color:#bbb;font-size:.75rem;cursor:pointer;text-decoration:underline;display:block;margin:0 auto;">בטל כניסה עם טביעת אצבע במכשיר זה</button>
    <div id="quickUnlockError" style="color:#b00020;font-size:.8rem;margin-top:12px;"></div>
  `;
  document.getElementById('quickUnlockBtn').addEventListener('click', async function(){
    const errEl = document.getElementById('quickUnlockError');
    errEl.textContent = '';
    try {
      const ok = await verifyFingerprint();
      if (ok) window.location.href = 'app.html';
      else errEl.textContent = 'האימות נכשל, נסה שוב';
    } catch(e){
      errEl.textContent = 'האימות בוטל או נכשל';
    }
  });
  document.getElementById('quickUnlockPwdBtn').addEventListener('click', function(){
    sessionStorage.setItem('bsd_skip_fp_gate', '1');
    location.reload();
  });
  document.getElementById('quickUnlockForgetBtn').addEventListener('click', async function(){
    forgetFingerprint();
    await bsdFullLogout();
  });
}

// זיכרון אימיילים קודמים (לא סיסמאות!) - מציג רשימת השלמה אוטומטית של הדפדפן
// כשלוחצים על שדה האימייל, מבוסס על עד 6 הכתובות האחרונות שהתחברת איתן בהצלחה.
function getEmailHistory(){
  try { return JSON.parse(localStorage.getItem('bsd_email_history') || '[]'); }
  catch(e){ return []; }
}
function addToEmailHistory(email){
  let history = getEmailHistory().filter(e => e !== email);
  history.unshift(email);
  history = history.slice(0, 6);
  localStorage.setItem('bsd_email_history', JSON.stringify(history));
}
function renderEmailHistory(){
  const list = document.getElementById('emailHistory');
  list.innerHTML = getEmailHistory().map(e => `<option value="${e}">`).join('');
}
renderEmailHistory();
const history0 = getEmailHistory();
if (history0.length > 0){ document.getElementById('email').value = history0[0]; }

document.getElementById('togglePwd').addEventListener('click', function(){
  const pwd = document.getElementById('password');
  if (pwd.type === 'password'){ pwd.type = 'text'; this.textContent = '🙈'; }
  else { pwd.type = 'password'; this.textContent = '👁️'; }
});

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';
  btn.disabled = true;
  btn.textContent = 'מתחבר...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const result = await bsdLogin(email, password);

  if (!result.ok) {
    errBox.textContent = result.message;
    btn.disabled = false;
    btn.textContent = 'כניסה למערכת';
    return;
  }

  addToEmailHistory(email);

  let showFpOffer = false;
  try {
    showFpOffer = !isFingerprintRegistered() && await isFingerprintAvailable();
  } catch(e){ console.error('fingerprint check failed, continuing to app.html', e); }

  if (showFpOffer){
    showFingerprintOfferModal(email);
  } else {
    window.location.href = 'app.html';
  }
});

function showFingerprintOfferModal(email){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(14,27,52,.6);display:flex;align-items:center;justify-content:center;z-index:9999;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:28px 30px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:'Heebo','Rubik',sans-serif;direction:rtl;">
      <div style="font-size:2.2rem;margin-bottom:8px;">👆</div>
      <div style="font-weight:700;color:#0e1b34;font-size:1.02rem;margin-bottom:8px;">להקל על הכניסה במכשיר הזה?</div>
      <div style="color:#6c7488;font-size:.85rem;margin-bottom:20px;">בפעם הבאה תוכל להיכנס עם טביעת אצבע במקום להקליד סיסמה</div>
      <button id="fpEnableBtn" style="background:#0e1b34;color:#fff;border:none;border-radius:8px;padding:12px 26px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;margin-bottom:10px;">🔒 הפעל כניסה עם טביעת אצבע</button>
      <button id="fpSkipBtn" style="background:none;border:none;color:#999;font-size:.82rem;cursor:pointer;text-decoration:underline;">לא עכשיו</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('fpEnableBtn').addEventListener('click', async function(){
    try { await registerFingerprint(email); }
    catch(e){ console.error(e); }
    window.location.href = 'app.html';
  });
  document.getElementById('fpSkipBtn').addEventListener('click', function(){
    window.location.href = 'app.html';
  });
}
</script>
</body>
</html>
