<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>שיחות טלפון | BSD CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="js/config.js?v=20260930archive1"></script>
<script src="js/supabaseClient.js?v=202608111530"></script>
<script src="js/auth.js?v=202609241200"></script>
<script src="js/phoneCalls.js?v=202610141200"></script>
<style>
 body{font-family:Arial,Helvetica,sans-serif;background:#f7f4ec;margin:0;color:#1f2d3d}
 header{background:#1f2d3d;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
 header a{color:#f3d27a} main{max-width:900px;margin:0 auto;padding:12px}
 .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
 .stat{background:#fff;border:1px solid #e3dccb;border-radius:10px;padding:10px;text-align:center;cursor:pointer}
 .stat b{display:block;font-size:1.5rem} .stat.on{outline:2px solid #c9a227}
 button{font-family:inherit;font-size:.85rem;border:1px solid #c9b98f;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<header><b>📞 שיחות טלפון – קו 077</b><a href="leads-hub.html">חזרה ללידים</a></header>
<main>
 <div class="stats">
  <div class="stat on" data-f="all"><b id="sAll">–</b>כל השיחות (30 יום)</div>
  <div class="stat" data-f="missed"><b id="sMissed">–</b>לא נענו – ממתינות לחזרה</div>
  <div class="stat" data-f="today"><b id="sToday">–</b>היום</div>
  <div class="stat" data-f="research"><b id="sResearch">–</b>ממתינות למחקר</div>
 </div>
 <div id="list">טוען…</div>
</main>
<script>
(async function(){
  if (!(await requireAuth())) return;
  const P = window.bsdPhoneCalls, sb = window.supabaseClient, list = document.getElementById('list');
  let rows = [], filter = 'all';
  const todayIL = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jerusalem' });
  const isToday = c => new Date(c.started_at).toLocaleDateString('en-CA', { timeZone: 'Asia/Jerusalem' }) === todayIL();
  async function load(){
    const since = new Date(Date.now() - 30*864e5).toISOString();
    const { data, error } = await sb.from('phone_calls').select('*').eq('is_test', false).gte('started_at', since).order('started_at', { ascending: false }).limit(500);
    if (error){ list.textContent = 'אין הרשאה או שגיאה בטעינה: ' + error.message; return; }
    rows = data || [];
    document.getElementById('sAll').textContent = rows.length;
    document.getElementById('sMissed').textContent = rows.filter(c => c.missed && !c.handled_at).length;
    document.getElementById('sToday').textContent = rows.filter(isToday).length;
    document.getElementById('sResearch').textContent = rows.filter(c => c.research_status === 'queued' || c.research_status === 'in_progress').length;
    render();
  }
  function render(){
    const f = { all: () => true, missed: c => c.missed && !c.handled_at, today: isToday, research: c => c.research_status === 'queued' || c.research_status === 'in_progress' }[filter];
    const shown = rows.filter(f);
    list.innerHTML = shown.length ? shown.map(c => P.callRow(c, { leadLink: true })).join('') : '<p>אין שיחות להצגה.</p>';
  }
  document.querySelectorAll('.stat').forEach(s => s.addEventListener('click', () => {
    document.querySelectorAll('.stat').forEach(x => x.classList.remove('on')); s.classList.add('on'); filter = s.dataset.f; render();
  }));
  P.wire(list, load);
  await load();
})();
</script>
</body>
</html>
