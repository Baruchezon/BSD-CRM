<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>איתן | מרכז ניהול ובקרה לפרויקט</title>
<style>
:root{
  --navy:#0b1b2d;
  --navy2:#102943;
  --blue:#1377c9;
  --blue2:#2b8bd8;
  --sky:#eaf4fd;
  --gold:#d8ad4e;
  --gold2:#f0cf79;
  --green:#18a26d;
  --purple:#7b35c8;
  --ink:#10233e;
  --muted:#728197;
  --line:#d9e4ee;
  --bg:#edf4f9;
  --card:#ffffff;
  --shadow:0 8px 26px rgba(28,63,96,.10);
  --shadow2:0 4px 14px rgba(22,58,92,.08);
}
*{box-sizing:border-box}
html{background:#e8f0f6}
body{
  margin:0;
  background:
    radial-gradient(circle at 72% -20%,rgba(255,255,255,.98),rgba(255,255,255,0) 38%),
    linear-gradient(135deg,#eef6fb 0%,#e7f0f6 45%,#f9fbfd 100%);
  font-family:Arial,"Noto Sans Hebrew",sans-serif;
  color:var(--ink);
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
svg{display:block}
.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:222px;
  background:
    radial-gradient(circle at 45% 86%,rgba(43,93,132,.32),transparent 28%),
    linear-gradient(180deg,#0a1a2b 0%,#0b2137 54%,#071521 100%);
  color:#fff;
  z-index:20;
  overflow:auto;
  box-shadow:8px 0 26px rgba(10,28,45,.11);
}
.sideBrand{
  height:174px;
  padding:18px 18px 10px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.06)
}
.crown{
  font-size:28px;
  color:var(--gold);
  height:28px;
  line-height:28px;
}
.bsdLogo{
  font-family:Georgia,"Times New Roman",serif;
  color:#ddb756;
  font-weight:700;
  font-size:58px;
  letter-spacing:2px;
  line-height:.92;
  text-shadow:0 2px 0 rgba(255,255,255,.05);
}
.brandEnglish{
  font-size:8px;
  font-weight:800;
  margin-top:6px;
  letter-spacing:.25px;
}
.brandHeb{
  font-size:11px;
  color:#d4dde6;
  margin-top:7px;
}
.sideNav{padding:8px 8px 160px}
.navBtn{
  width:100%;
  border:0;
  color:#dbe5ef;
  background:transparent;
  min-height:49px;
  padding:0 16px;
  border-radius:8px;
  display:flex;
  direction:rtl;
  flex-direction:row-reverse;
  align-items:center;
  justify-content:flex-end;
  gap:16px;
  text-align:right;
  font-size:14px;
  margin:2px 0;
  transition:.16s ease;
  position:relative;
}
.navBtn .navIcon{width:24px;height:24px;display:grid;place-items:center;flex:none}
.navBtn .navIcon svg{width:23px;height:23px;stroke:currentColor}
.navBtn:hover{background:rgba(53,111,158,.20);color:#fff}
.navBtn.active{
  background:linear-gradient(90deg,#214e74 0%,#2f6089 100%);
  color:#fff;
  box-shadow:inset 4px 0 0 #13a7ef,0 5px 14px rgba(0,0,0,.16);
}
.sideBottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:146px;
  padding:26px 18px 18px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  text-align:center;
  background:
    linear-gradient(180deg,transparent 0%,rgba(1,11,20,.78) 45%,rgba(4,13,22,.96) 100%),
    radial-gradient(ellipse at 50% 85%,#244a69 0 5%,transparent 6%);
  overflow:hidden;
}
.sideBottom:before,
.sideBottom:after{
  content:"";
  position:absolute;
  bottom:33px;
  width:120px;
  height:58px;
  background:linear-gradient(135deg,transparent 0 46%,#173750 47% 60%,transparent 61%);
  opacity:.8;
}
.sideBottom:before{left:-22px;transform:rotate(-8deg)}
.sideBottom:after{right:-10px;transform:scaleX(-1) rotate(-10deg)}
.mottoGold{position:relative;z-index:1;color:#e0b74f;font-size:10px;letter-spacing:.35px}
.mottoHeb{position:relative;z-index:1;color:#fff;font-size:13px;margin-top:8px}

.app{
  margin-left:222px;
  min-height:100vh;
}
.topbar{
  min-height:104px;
  padding:15px 30px 8px;
  display:grid;
  grid-template-columns:minmax(290px,1fr) minmax(320px,420px) 180px;
  gap:20px;
  align-items:start;
}
.welcome{direction:rtl;text-align:right}
.welcome h1{
  margin:5px 0 6px;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  color:#132846;
}
.welcome p{margin:0;color:#243c59;font-size:15px}
.searchWrap{
  margin-top:2px;
  height:43px;
  background:#fff;
  border:1px solid #d5e3ef;
  border-radius:12px;
  display:flex;
  align-items:center;
  padding:0 14px;
  box-shadow:var(--shadow2);
  direction:rtl;
}
.searchWrap svg{width:20px;height:20px;stroke:#0c2744;flex:none}
.searchWrap input{
  border:0;
  outline:0;
  width:100%;
  min-width:0;
  padding:0 10px;
  color:var(--ink);
  background:transparent;
  text-align:right;
}
.searchWrap input::placeholder{color:#8b99aa}
.userArea{
  display:flex;
  justify-content:flex-end;
  align-items:flex-start;
  gap:18px;
  padding-top:1px;
}
.bell{
  width:38px;height:38px;
  border:0;background:transparent;
  display:grid;place-items:center;
  position:relative;color:#0d2745;
}
.bell svg{width:24px;height:24px;stroke:currentColor}
.badgeCount{
  position:absolute;top:-4px;right:-4px;
  background:#e84a3a;color:#fff;
  width:19px;height:19px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;font-weight:800;
  box-shadow:0 2px 6px rgba(0,0,0,.2)
}
.avatar{
  width:43px;height:43px;border-radius:50%;
  background:#081a2c;color:#fff;
  display:grid;place-items:center;
  font-weight:800;font-size:18px;
  box-shadow:0 4px 12px rgba(10,30,50,.16)
}
.sign{
  grid-column:3;
  margin-top:-4px;
  text-align:left;
  color:#17324f;
  font-family:cursive;
  font-size:18px;
  transform:rotate(-3deg);
  border-bottom:2px solid var(--gold);
  justify-self:end;
  padding:0 8px 2px;
}

.content{
  padding:0 26px 18px;
  max-width:1460px;
  margin:0 auto;
}
.dashboard{display:block}
.kpiGrid{
  display:grid;
  grid-template-columns:1.12fr repeat(4,1fr);
  gap:12px;
  margin-bottom:12px;
}
.kpiCard,.progressCard,.panel,.miniPanel,.actionCard,.bottomCard{
  background:rgba(255,255,255,.96);
  border:1px solid rgba(212,225,237,.94);
  border-radius:10px;
  box-shadow:var(--shadow2);
}
.progressCard{
  min-height:114px;
  padding:17px 15px;
  display:flex;
  align-items:center;
  gap:13px;
}
.donut{
  width:72px;height:72px;border-radius:50%;
  position:relative;
  background:conic-gradient(#0f7aa5 calc(var(--pct)*1%),#dceaf3 0);
  flex:none;
}
.donut:after{
  content:"";
  position:absolute;inset:10px;border-radius:50%;background:#fff;
}
.donut strong{
  position:absolute;inset:0;z-index:2;display:grid;place-items:center;
  font-size:18px
}
.progressText b{display:block;font-size:15px;margin-bottom:7px}
.progressText span{color:var(--muted);font-size:12px}
.kpiCard{
  min-height:114px;
  padding:14px 16px;
  display:grid;
  grid-template-columns:54px 1fr;
  gap:12px;
  align-items:center;
}
.kpiIcon{
  width:54px;height:54px;border-radius:13px;
  display:grid;place-items:center
}
.kpiIcon svg{width:29px;height:29px;stroke:currentColor}
.kpiBody strong{display:block;font-size:21px;line-height:1}
.kpiBody span{display:block;margin-top:8px;font-size:13px;color:#263d58}
.kpiBody button{
  margin-top:10px;padding:0;border:0;background:transparent;
  color:#0874dc;font-size:11px
}

.heroTasks{
  display:grid;
  grid-template-columns:1fr 390px;
  gap:12px;
  margin-bottom:12px;
}
.hero{
  min-height:238px;
  border-radius:9px;
  position:relative;
  overflow:hidden;
  color:#fff;
  background:
    linear-gradient(90deg,rgba(5,20,35,.97) 0%,rgba(8,29,49,.84) 33%,rgba(13,36,59,.45) 64%,rgba(10,31,49,.10) 100%),
    radial-gradient(circle at 78% 24%,rgba(255,191,104,.65) 0 1.2%,rgba(255,186,98,.18) 3%,transparent 14%),
    linear-gradient(175deg,#91a7b9 0 44%,#39516a 45% 48%,#233b55 49% 58%,#132b43 59% 67%,#0d2238 68% 100%);
  box-shadow:var(--shadow);
}
.hero:before,
.hero:after{
  content:"";
  position:absolute;bottom:0;
  width:62%;height:48%;
  background:#0b2137;
  clip-path:polygon(0 100%,8% 84%,17% 92%,28% 66%,39% 84%,52% 42%,62% 73%,75% 35%,86% 68%,100% 45%,100% 100%);
  opacity:.72;
}
.hero:before{right:-5%}
.hero:after{left:-15%;transform:scaleX(-1);opacity:.45;height:40%}
.person{
  position:absolute;right:31%;bottom:36px;width:26px;height:78px;z-index:2;
}
.person:before{
  content:"";position:absolute;top:0;left:7px;width:13px;height:13px;border-radius:50%;background:#050c13
}
.person:after{
  content:"";position:absolute;top:12px;left:8px;width:10px;height:39px;background:#050c13;
  box-shadow:-7px 15px 0 -4px #050c13,7px 15px 0 -4px #050c13,-5px 47px 0 -4px #050c13,5px 47px 0 -4px #050c13;
  transform:rotate(2deg)
}
.heroContent{position:relative;z-index:3;padding:50px 40px}
.heroContent h2{margin:0 0 8px;font-size:29px}
.heroContent p{margin:0 0 22px;font-size:18px;color:#e7edf3}
.goldButton{
  border:0;
  color:#fff;
  font-weight:800;
  background:linear-gradient(180deg,#f0cb6e 0%,#d7a740 100%);
  border-radius:24px;
  padding:12px 30px;
  min-width:187px;
  box-shadow:0 5px 0 #a47c2c,0 8px 16px rgba(0,0,0,.18);
}
.goldButton:active{transform:translateY(2px);box-shadow:0 3px 0 #a47c2c}
.handNote{
  position:absolute;z-index:4;right:18px;bottom:26px;
  width:210px;text-align:center;font-family:cursive;font-size:18px;
  transform:rotate(-6deg);opacity:.96
}
.handNote span{display:block;font-size:15px;margin-top:4px}

.tasksPanel{padding:11px 13px 10px}
.panelTitle{
  height:35px;
  border-bottom:1px solid #e2e8ee;
  display:flex;align-items:center;justify-content:space-between;
  font-weight:900;font-size:15px
}
.panelTitle svg{width:21px;height:21px;stroke:#102f50}
.taskRow{
  display:grid;
  grid-template-columns:22px 1fr auto;
  align-items:center;
  gap:8px;
  min-height:39px;
  border-bottom:1px solid #e8edf2;
  font-size:12px;
}
.taskCheck{
  appearance:none;width:19px;height:19px;border:1px solid #aebbc7;border-radius:3px;background:#fff
}
.taskDate{font-size:10px;color:#dc5c59;white-space:nowrap}
.panelLink{
  width:100%;
  border:0;background:transparent;color:#0874db;
  font-size:11px;text-align:center;padding:10px 0 2px
}

.actionGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:12px;
}
.actionCard{
  min-height:118px;
  border:0;
  padding:14px 12px;
  text-align:center;
  transition:.15s ease;
}
.actionCard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.actionCard .actionIcon{
  width:43px;height:43px;border-radius:11px;margin:0 auto 8px;
  display:grid;place-items:center;
  box-shadow:0 4px 9px rgba(0,0,0,.08)
}
.actionCard .actionIcon svg{width:27px;height:27px;stroke:currentColor}
.actionCard strong{display:block;font-size:15px}
.actionCard small{display:block;margin-top:5px;color:#334b65;font-size:11px}
.actionCard.green{background:linear-gradient(135deg,#dff6ed,#edfdf8)}
.actionCard.green .actionIcon{color:#128a5e;background:#cff4e5}
.actionCard.blue{background:linear-gradient(135deg,#dceafe,#eef5ff)}
.actionCard.blue .actionIcon{color:#086cd2;background:#d6e7ff}
.actionCard.purple{background:linear-gradient(135deg,#eadcff,#f7ecff)}
.actionCard.purple .actionIcon{color:#7130be;background:#ead9ff}
.actionCard.gold{background:linear-gradient(135deg,#f9edcf,#fff7e8)}
.actionCard.gold .actionIcon{color:#815b13;background:#f7e7be}

.infoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:12px;
}
.miniPanel{padding:10px 13px;min-height:238px}
.listHead{
  min-height:34px;border-bottom:1px solid #e2e8ee;
  display:flex;align-items:center;justify-content:space-between;
  font-weight:900;font-size:14px
}
.listHead svg{width:21px;height:21px;stroke:#12304f}
.fileRow,.draftRow,.formRow{
  min-height:39px;
  display:grid;
  align-items:center;
  border-bottom:1px solid #e6edf3;
  font-size:12px;
  gap:8px
}
.fileRow{grid-template-columns:26px 1fr auto}
.draftRow{grid-template-columns:1fr auto}
.formRow{grid-template-columns:22px 1fr auto}
.fileType{
  width:22px;height:22px;border-radius:3px;color:#fff;display:grid;place-items:center;
  font-size:8px;font-weight:900
}
.fileType.pdf{background:#e64a42}.fileType.doc{background:#2c77d7}.fileType.xls{background:#1e9a65}.fileType.ppt{background:#e26732}
.smallDate{font-size:10px;color:#6f8093}
.pillStatus{
  border-radius:12px;padding:5px 8px;font-size:10px;white-space:nowrap
}
.pillStatus.blue{background:#dceafe;color:#1364bc}
.pillStatus.gray{background:#edf2f7;color:#6d7d90}
.pillStatus.green{background:#d7f6e8;color:#118357}
.pillStatus.progress{background:#e2efff;color:#0e6dd4}
.pillStatus.pending{background:#eef1f4;color:#6f7c8d}

.bottomGrid{
  display:grid;
  grid-template-columns:1fr 1.05fr 1.1fr;
  gap:12px;
  margin-bottom:8px;
}
.bottomCard{
  min-height:69px;
  border:0;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:right;
}
.bottomCard .leftLabel{display:flex;align-items:center;gap:14px}
.bottomCard .bigIcon{width:44px;height:44px;display:grid;place-items:center}
.bottomCard .bigIcon svg{width:36px;height:36px;stroke:currentColor}
.bottomCard strong{display:block;font-size:14px}
.bottomCard small{display:block;color:#4c6077;font-size:11px;margin-top:3px}
.bottomCard.green{background:linear-gradient(135deg,#daf5e9,#edfdf6)}
.bottomCard.gold{background:linear-gradient(135deg,#f8ebc9,#fff7e7)}
.bottomCard.blue{background:linear-gradient(135deg,#dbeafd,#eef6ff)}
.chev{font-size:28px;color:#256291}
.footer{
  text-align:center;
  color:#173a5d;
  font-size:11px;
  line-height:1.4;
  padding:3px 0 0
}

/* Internal views */
.viewPage{display:none}
.viewPage.active{display:block}
.pageHead{
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  margin:2px 0 14px
}
.pageHead h2{margin:0;font-size:26px}
.pageHead p{margin:5px 0 0;color:var(--muted)}
.primaryBtn{
  border:0;border-radius:10px;padding:10px 17px;color:#fff;font-weight:800;
  background:linear-gradient(180deg,#2b8bd8,#1768ad);
  box-shadow:0 4px 0 #0c4e84
}
.primaryBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #0c4e84}
.whiteCard{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow2);padding:16px;margin-bottom:12px
}
.compactKpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.compactKpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow2)}
.compactKpi b{display:block;font-size:21px}.compactKpi span{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.tableWrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow2)}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:11px 10px;border-bottom:1px solid #e8eef3;text-align:right;font-size:12px}
th{background:#f6f9fb;color:#35516d}
input,select,textarea{
  border:1px solid #cfdce7;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)
}
.questionCard{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow2)
}
.qTop{display:grid;grid-template-columns:38px 1fr 140px;gap:10px;align-items:start}
.qNum{width:38px;height:38px;border-radius:9px;background:#102943;color:#fff;display:grid;place-items:center;font-weight:900}
.questionCard h3{font-size:15px;margin:4px 0 8px}
.questionCard textarea{width:100%;min-height:86px}
.flow{
  display:flex;align-items:center;gap:9px;overflow:auto;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow2)
}
.node{
  min-width:120px;padding:17px 10px;border-radius:12px;
  text-align:center;background:#eaf4fb;border:1px solid #cddfea;box-shadow:0 4px 0 #d5e4ee
}
.arrow{font-size:23px;color:var(--gold)}
.simpleList{
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;
  display:flex;justify-content:space-between;gap:10px;box-shadow:var(--shadow2)
}
.tag{font-size:10px;border-radius:12px;padding:5px 8px;background:#fff1ce;color:#8a6417}

.modal{
  display:none;position:fixed;inset:0;background:rgba(3,14,25,.76);z-index:50;
  place-items:center;padding:18px
}
.modal.open{display:grid}
.modalBox{
  width:min(720px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 28px 70px rgba(0,0,0,.28)
}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formGrid label{display:grid;gap:5px;font-size:11px;font-weight:800}
.formGrid .wide{grid-column:1/-1}
.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.secondaryBtn{border:1px solid #cbd8e4;background:#fff;border-radius:9px;padding:9px 14px}
.mobileToggle{display:none}

@media(max-width:1180px){
  .kpiGrid{grid-template-columns:repeat(3,1fr)}
  .progressCard{grid-column:span 1}
  .heroTasks{grid-template-columns:1fr}
  .actionGrid{grid-template-columns:repeat(2,1fr)}
  .infoGrid{grid-template-columns:1fr}
  .bottomGrid{grid-template-columns:1fr}
}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:.2s ease}
  .sidebar.open{transform:none}
  .app{margin-left:0}
  .mobileToggle{display:grid;place-items:center;position:fixed;left:12px;top:12px;z-index:30;width:42px;height:42px;border:0;border-radius:10px;background:#0b2137;color:#fff;box-shadow:var(--shadow)}
  .topbar{grid-template-columns:1fr;min-height:auto;padding:12px 18px 8px}
  .searchWrap{order:3}
  .userArea{position:absolute;top:12px;right:18px}
  .sign{display:none}
  .content{padding:0 14px 16px}
  .kpiGrid{grid-template-columns:repeat(2,1fr)}
  .progressCard{grid-column:1/-1}
  .hero{min-height:260px}
  .heroContent{padding:50px 28px}
  .compactKpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .welcome h1{font-size:24px}
  .welcome p{font-size:13px}
  .userArea{display:none}
  .kpiGrid{grid-template-columns:1fr}
  .progressCard{grid-column:auto}
  .actionGrid{grid-template-columns:1fr 1fr}
  .heroContent h2{font-size:23px}
  .heroContent p{font-size:15px}
  .handNote{display:none}
  .qTop{grid-template-columns:38px 1fr}
  .qTop select{grid-column:1/-1}
  .formGrid{grid-template-columns:1fr}
  .formGrid .wide{grid-column:auto}
}

.officialLogo{width:188px;max-width:100%;height:auto;display:block;margin:0 auto;object-fit:contain}
.driveLink{color:#0874db;text-decoration:none}
.driveLink:hover{text-decoration:underline}
.sourceActions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
@media(max-width:900px){.sourceActions{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.sourceActions{grid-template-columns:1fr 1fr}}


/* Requested layout update: same dashboard, compact menu on the right */
.sidebar{
  left:auto !important;
  right:0 !important;
  width:188px !important;
  box-shadow:-8px 0 26px rgba(10,28,45,.11) !important;

<script>

const PROJECT_FORMS=[
  {id:'meeting-2026-09-29',name:'טופס פגישת איתן',date:'29.09.2026',type:'טופס איסוף נתונים',location:'חומרים שנשלחו',workUrl:'https://docs.google.com/document/d/14W_bw1fTWRVLdNioWhmPuGMeBb7HWPdr/edit?usp=drivesdk&ouid=110577033106453108109&rtpof=true&sd=true',questionCount:34,latest:true},
  {id:'questions-2026-09-20',name:'שאלות לפגישה עם איתן · פרויקט טריגנרציה',date:'20.09.2026',type:'מסמך שאלות',location:'מחיצת איתן',workUrl:'https://drive.google.com/file/d/13T-7bJ1Fe3qEDSPvv1ObeemKt_9fsUct/view?usp=drivesdk',questionCount:null,latest:false}
];
let focusQuestionIndex=Number(localStorage.getItem('eitan-focus-q-index')||0);
let metaOpen=false;
function formsView(){
  const sorted=[...PROJECT_FORMS].sort((a,b)=>b.date.split('.').reverse().join('').localeCompare(a.date.split('.').reverse().join('')));
  return `<div class="formsPageHead"><div><h2>טפסים</h2><p>בחר טופס. החדש ביותר מופיע ראשון.</p></div></div>${sorted.map(f=>`<div class="formListCard ${f.latest?'latest':''}"><div><strong>${esc(f.name)}</strong><small>${esc(f.type)} · מיקום: ${esc(f.location)}${f.latest?' · הטופס הפעיל להיום':''}</small></div><div class="formDate">${esc(f.date)}</div>${f.id==='meeting-2026-09-29'?`<button class="openFormBtn" onclick="openProjectForm('${f.id}')">פתח למילוי</button>`:`<a class="openFormBtn" target="_blank" rel="noopener" href="${esc(f.workUrl)}">פתח</a>`}</div>`).join('')}`;
}
function openProjectForm(id){if(id==='meeting-2026-09-29'){view='formwork';render();setTimeout(()=>document.getElementById('focusAnswer')?.focus(),0)}}

const QUESTIONS_PER_PAGE=3;
function currentFocusPageStart(){
  const maxStart=Math.floor((TODAY_FORM_QUESTIONS.length-1)/QUESTIONS_PER_PAGE)*QUESTIONS_PER_PAGE;
  focusQuestionIndex=Math.max(0,Math.min(maxStart,focusQuestionIndex));
  focusQuestionIndex=Math.floor(focusQuestionIndex/QUESTIONS_PER_PAGE)*QUESTIONS_PER_PAGE;
  return focusQuestionIndex;
}
function currentPageQuestions(){
  const start=currentFocusPageStart();
  return TODAY_FORM_QUESTIONS.slice(start,start+QUESTIONS_PER_PAGE);
}
function jumpFocusSection(section){
  const idx=TODAY_FORM_QUESTIONS.findIndex(q=>q.section===section);
  if(idx>=0){
    focusQuestionIndex=Math.floor(idx/QUESTIONS_PER_PAGE)*QUESTIONS_PER_PAGE;
    localStorage.setItem('eitan-focus-q-index',String(focusQuestionIndex));
    render();
  }
}
function moveFocus(deltaPages){
  const maxStart=Math.floor((TODAY_FORM_QUESTIONS.length-1)/QUESTIONS_PER_PAGE)*QUESTIONS_PER_PAGE;
  focusQuestionIndex=Math.max(0,Math.min(maxStart,focusQuestionIndex+(deltaPages*QUESTIONS_PER_PAGE)));
  localStorage.setItem('eitan-focus-q-index',String(focusQuestionIndex));
  render();
}
function saveFocusAnswer(n,v){setMeetingAnswer(n,v)}
function toggleMeta(){metaOpen=!metaOpen;document.getElementById('metaDrawer')?.classList.toggle('open',metaOpen)}
function manualSaveMeeting(){
  persistMeetingNow();
  const el=document.getElementById('manualSaveFeedback');
  if(el){
    el.textContent='נשמר עכשיו בדפדפן';
    setTimeout(()=>{if(el)el.textContent='';},2500);
  }
}
function compactAnswerField(q){
  const v=todayForm.answers[String(q.n)]||'';
  const longQuestions=[3,4,7,8,9,15,16,17,18,20,23,26,29,31,32,34];
  if(longQuestions.includes(q.n)){
    return `<textarea class="compactTextarea" placeholder="${esc(q.hint)}" oninput="saveFocusAnswer(${q.n},this.value)">${esc(v)}</textarea>`;
  }
  return `<input class="compactInput" value="${esc(v)}" placeholder="${esc(q.hint)}" oninput="saveFocusAnswer(${q.n},this.value)">`;
}
function formWorkView(){
  const pageQs=currentPageQuestions();
  const answered=meetingAnswered();
  const pct=meetingProgress();
  const sectionNames=[...new Set(TODAY_FORM_QUESTIONS.map(x=>x.section))];
  const first=pageQs[0];
  const pageNum=Math.floor(currentFocusPageStart()/QUESTIONS_PER_PAGE)+1;
  const totalPages=Math.ceil(TODAY_FORM_QUESTIONS.length/QUESTIONS_PER_PAGE);
  const maxStart=Math.floor((TODAY_FORM_QUESTIONS.length-1)/QUESTIONS_PER_PAGE)*QUESTIONS_PER_PAGE;

  return `<div class="focusWorkspace">
    <div class="focusTop">
      <button class="backFormsBtn" onclick="route('forms')">חזרה לטפסים</button>
      <div class="focusTitle">
        <strong>טופס פגישת איתן · 29.09.2026</strong>
        <small>${esc(first.section)} · מיקום: חומרים שנשלחו · קובץ Word</small>
      </div>
      <div class="focusStatus">
        <div class="driveStatusRow">
          <button class="manualSaveBtn" onclick="manualSaveMeeting()">שמור</button>
          <span class="savePill" id="driveSaveStatus" style="padding:5px 8px">${esc(driveStatusText)}</span>
          <span class="saveFeedback" id="manualSaveFeedback"></span>
        </div>
        <button class="iconToolBtn" onclick="toggleMeta()">פרטי פגישה</button>
      </div>
      <div class="metaDrawer ${metaOpen?'open':''}" id="metaDrawer">
        <div class="metaCompact">
          <label>תאריך<input value="${esc(todayForm.date)}" readonly></label>
          <label>שם המשתתף<input value="${esc(todayForm.participant)}" oninput="setMeetingMeta('participant',this.value)"></label>
          <label>מיקום<input value="${esc(todayForm.location)}" oninput="setMeetingMeta('location',this.value)"></label>
          <label>משך הפגישה<input value="${esc(todayForm.duration)}" oninput="setMeetingMeta('duration',this.value)"></label>
        </div>
      </div>
    </div>

    <div class="focusProgressBar"><span style="width:${pct}%"></span></div>

    <div class="sectionMiniNav">
      ${sectionNames.map(s=>`<button class="${pageQs.some(q=>q.section===s)?'active':''}" onclick="jumpFocusSection('${esc(s)}')">${esc(s)}</button>`).join('')}
    </div>

    <div class="focusCardsGrid">
      ${pageQs.map(q=>{
        const v=todayForm.answers[String(q.n)]||'';
        return `<div class="compactQuestionCard ${String(v).trim()?'answered':''}" data-meeting-q="${q.n}">
          <div class="compactQNum">${q.n}</div>
          <div class="compactQBody">
            <div class="compactQText">${esc(q.text)}</div>
            <div class="compactQHint">${esc(q.hint)}</div>
            ${compactAnswerField(q)}
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="focusBottom">
      <button class="focusNavBtn" onclick="moveFocus(-1)" ${currentFocusPageStart()===0?'disabled':''}>הקודמות</button>
      <div class="focusCount">
        <b>עמוד ${pageNum} מתוך ${totalPages}</b>

let eitanTokenClient=null;
let eitanDriveAccessToken=null;
let eitanDriveConnected=false;
let eitanDriveFileId=null;
let eitanDriveDocxBuffer=null;
let eitanDriveBusy=false;
let eitanDrivePendingAfterBusy=false;
let eitanDriveSaveTimer=null;
let driveStatusText='⏳ מתחבר ל Google Drive';

function eitanSetDriveStatus(text){
  driveStatusText=text;
  const el=document.getElementById('driveSaveStatus');
  if(el) el.textContent=text;
}
function eitanHeaders(extra){
  const h={Authorization:'Bearer '+eitanDriveAccessToken};
  if(extra) Object.assign(h,extra);
  return h;
}
function eitanMarkPending(){
  try{localStorage.setItem(EITAN_DRIVE_PENDING_KEY,'1')}catch(e){}
}
function eitanClearPending(){
  try{localStorage.setItem(EITAN_DRIVE_PENDING_KEY,'0')}catch(e){}
}
function eitanHasPending(){
  try{return localStorage.getItem(EITAN_DRIVE_PENDING_KEY)==='1'}catch(e){return true}
}
function eitanLoadMeta(){
  try{
    const raw=localStorage.getItem(EITAN_DRIVE_META_KEY);
    if(raw) eitanDriveFileId=JSON.parse(raw).fileId||null;
  }catch(e){}
}
function eitanSaveMeta(){
  try{localStorage.setItem(EITAN_DRIVE_META_KEY,JSON.stringify({fileId:eitanDriveFileId||null}))}catch(e){}
}
function eitanBase64ToArrayBuffer(b64){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function eitanTextOf(node){
  return Array.from(node.getElementsByTagNameNS(EITAN_W_NS,'t')).map(n=>n.textContent||'').join('');
}
function eitanDirect(node,name){
  return Array.from(node.childNodes).filter(n=>n.nodeType===1&&n.namespaceURI===EITAN_W_NS&&n.localName===name);
}
function eitanParagraph(xmlDoc,text,bold){
  const p=xmlDoc.createElementNS(EITAN_W_NS,'w:p');
  const r=xmlDoc.createElementNS(EITAN_W_NS,'w:r');
  if(bold){
    const rPr=xmlDoc.createElementNS(EITAN_W_NS,'w:rPr');
    rPr.appendChild(xmlDoc.createElementNS(EITAN_W_NS,'w:b'));
    r.appendChild(rPr);
  }
  const t=xmlDoc.createElementNS(EITAN_W_NS,'w:t');
  t.setAttributeNS(EITAN_XML_NS,'xml:space','preserve');
  t.textContent=text||'';
  r.appendChild(t); p.appendChild(r);
  return p;
}
function eitanSetCellText(xmlDoc,cell,text){
  eitanDirect(cell,'p').forEach(p=>cell.removeChild(p));
  cell.appendChild(eitanParagraph(xmlDoc,text||'',false));
}
function eitanSetAnswer(xmlDoc,cell,answer){
  eitanDirect(cell,'p').forEach(p=>{
    if(eitanTextOf(p).startsWith(EITAN_ANSWER_PREFIX)) cell.removeChild(p);
  });
  const value=String(answer||'').trim();
  if(value) cell.appendChild(eitanParagraph(xmlDoc,EITAN_ANSWER_PREFIX+value,true));
}
function eitanUpdateXml(xmlText){
  const xmlDoc=new DOMParser().parseFromString(xmlText,'application/xml');
  if(xmlDoc.getElementsByTagName('parsererror').length) throw new Error('xml parse');

  const tables=Array.from(xmlDoc.getElementsByTagNameNS(EITAN_W_NS,'tbl'));

  if(tables[0]){
    const rows=eitanDirect(tables[0],'tr');
    if(rows[1]){
      const cells=eitanDirect(rows[1],'tc');
      if(cells[0]) eitanSetCellText(xmlDoc,cells[0],todayForm.date||'29.09.2026');
      if(cells[1]) eitanSetCellText(xmlDoc,cells[1],todayForm.participant||'איתן');
      if(cells[2]) eitanSetCellText(xmlDoc,cells[2],todayForm.location||'');
      if(cells[3]) eitanSetCellText(xmlDoc,cells[3],todayForm.duration||'');
    }
  }

  for(const tbl of tables){
    for(const row of eitanDirect(tbl,'tr')){
      const cells=eitanDirect(row,'tc');
      if(cells.length<3) continue;
      const n=parseInt(eitanTextOf(cells[0]).trim(),10);
      if(n>=1&&n<=34) eitanSetAnswer(xmlDoc,cells[2],todayForm.answers[String(n)]||'');
    }
  }

  const critical={1:1,2:5,3:12,4:13,5:21,6:22,7:30,8:26,9:27,10:28};
  const summary=tables[tables.length-1];
  if(summary){
    const rows=eitanDirect(summary,'tr');
    for(let i=1;i<rows.length;i++){
      const cells=eitanDirect(rows[i],'tc'), q=critical[i];
      if(cells[2]&&q) eitanSetCellText(xmlDoc,cells[2],todayForm.answers[String(q)]||'');
    }
  }

  const body=xmlDoc.getElementsByTagNameNS(EITAN_W_NS,'body')[0];
  if(body){
    let paras=eitanDirect(body,'p');
    const heading=paras.find(p=>eitanTextOf(p).trim()==='הערות חופשיות והחלטות מהפגישה');
    paras.forEach(p=>{
      if(eitanTextOf(p).startsWith(EITAN_NOTES_PREFIX)) body.removeChild(p);
    });
    if(heading&&String(todayForm.notes||'').trim()){
      const p=eitanParagraph(xmlDoc,EITAN_NOTES_PREFIX+String(todayForm.notes).trim(),true);
      if(heading.nextSibling) body.insertBefore(p,heading.nextSibling); else body.appendChild(p);
    }
  }
  return new XMLSerializer().serializeToString(xmlDoc);
}
function eitanReadXml(xmlText){
  const xmlDoc=new DOMParser().parseFromString(xmlText,'application/xml');
  const result={date:'29.09.2026',participant:'איתן',location:'',duration:'',answers:{},notes:''};
  const tables=Array.from(xmlDoc.getElementsByTagNameNS(EITAN_W_NS,'tbl'));

  if(tables[0]){
    const rows=eitanDirect(tables[0],'tr');
    if(rows[1]){
      const cells=eitanDirect(rows[1],'tc');
      if(cells[0]) result.date=eitanTextOf(cells[0]).trim()||'29.09.2026';
      if(cells[1]) result.participant=eitanTextOf(cells[1]).trim()||'איתן';
      if(cells[2]) result.location=eitanTextOf(cells[2]).trim();
      if(cells[3]) result.duration=eitanTextOf(cells[3]).trim();
    }
  }
  for(const tbl of tables){
    for(const row of eitanDirect(tbl,'tr')){
      const cells=eitanDirect(row,'tc');
      if(cells.length<3) continue;
      const n=parseInt(eitanTextOf(cells[0]).trim(),10);
      if(!(n>=1&&n<=34)) continue;
      const p=eitanDirect(cells[2],'p').find(x=>eitanTextOf(x).startsWith(EITAN_ANSWER_PREFIX));
      if(p) result.answers[String(n)]=eitanTextOf(p).slice(EITAN_ANSWER_PREFIX.length);
    }
  }
  const body=xmlDoc.getElementsByTagNameNS(EITAN_W_NS,'body')[0];
  if(body){
    const p=eitanDirect(body,'p').find(x=>eitanTextOf(x).startsWith(EITAN_NOTES_PREFIX));
    if(p) result.notes=eitanTextOf(p).slice(EITAN_NOTES_PREFIX.length);
  }
  return result;
}
async function eitanBuildBlob(){
  const base=eitanDriveDocxBuffer||eitanBase64ToArrayBuffer(EITAN_TEMPLATE_B64);
  const zip=await JSZip.loadAsync(base);
  const file=zip.file('word/document.xml');
  if(!file) throw new Error('document xml missing');
  const xml=await file.async('text');
  zip.file('word/document.xml',eitanUpdateXml(xml));
  return zip.generateAsync({type:'blob',mimeType:EITAN_DOCX_MIME,compression:'DEFLATE',compressionOptions:{level:6}});
}
async function eitanLoadBuffer(buffer){
  const zip=await JSZip.loadAsync(buffer);
  const xml=await zip.file('word/document.xml').async('text');
  const loaded=eitanReadXml(xml);
  if(!eitanHasPending()){
    todayForm=loaded;
    saveTodayForm();
  }
}
async function eitanFindFile(){
  const q=encodeURIComponent("'"+EITAN_DRIVE_FOLDER_ID+"' in parents and name='"+EITAN_WORK_FILE_NAME+"' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name,modifiedTime,size)',{headers:eitanHeaders()});
  if(!r.ok) throw new Error('search '+r.status);
  const j=await r.json();
  return j.files&&j.files.length?j.files[0]:null;
}
async function eitanDownload(){
  const r=await fetch('https://www.googleapis.com/drive/v3/files/'+eitanDriveFileId+'?alt=media',{headers:eitanHeaders()});
  if(!r.ok) throw new Error('download '+r.status);
  eitanDriveDocxBuffer=await r.arrayBuffer();
  return eitanDriveDocxBuffer;
}
async function eitanCreate(){
  const blob=await eitanBuildBlob();
  const b='-------eitan'+Date.now();
  const metadata={name:EITAN_WORK_FILE_NAME,parents:[EITAN_DRIVE_FOLDER_ID],mimeType:EITAN_DOCX_MIME};
  const body=new Blob([
    '--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',
    JSON.stringify(metadata),
    '\r\n--'+b+'\r\nContent-Type: '+EITAN_DOCX_MIME+'\r\n\r\n',
    blob,
    '\r\n--'+b+'--'
  ],{type:'multipart/related; boundary='+b});
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime,size',{
    method:'POST',headers:eitanHeaders({'Content-Type':'multipart/related; boundary='+b}),body
  });
  if(!r.ok) throw new Error('create '+r.status);
  const j=await r.json();
  eitanDriveFileId=j.id;
  eitanDriveDocxBuffer=await blob.arrayBuffer();
  eitanSaveMeta(); eitanClearPending();
  eitanSetDriveStatus('✓ נשמר ב Google Drive '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}));
}
async function eitanPush(){
  if(!eitanDriveConnected||!eitanDriveAccessToken){
    eitanMarkPending(); eitanSetDriveStatus('⚠ לא מחובר ל Google Drive'); return false;
  }
  if(eitanDriveBusy){eitanDrivePendingAfterBusy=true;return false}
  eitanDriveBusy=true; eitanSetDriveStatus('⏳ שומר ב Google Drive');
  try{
    if(!eitanDriveFileId){
      const f=await eitanFindFile();
      if(f)eitanDriveFileId=f.id;else{await eitanCreate();return true}
    }
    if(!eitanDriveDocxBuffer) await eitanDownload();
    const blob=await eitanBuildBlob();
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+eitanDriveFileId+'?uploadType=media&fields=modifiedTime,size',{
      method:'PATCH',headers:eitanHeaders({'Content-Type':EITAN_DOCX_MIME}),body:blob
    });
    if(!r.ok) throw new Error('save '+r.status);
    await r.json();
    eitanDriveDocxBuffer=await blob.arrayBuffer();
    eitanClearPending(); eitanSaveMeta();
    const time=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    eitanSetDriveStatus('✓ נשמר ב Google Drive '+time);
    const fb=document.getElementById('manualSaveFeedback');
    if(fb){fb.textContent='נשמר ב Google Drive';setTimeout(()=>{const x=document.getElementById('manualSaveFeedback');if(x)x.textContent=''},2200)}
    return true;
  }catch(e){
    console.error(e);eitanMarkPending();eitanSetDriveStatus('⚠ השמירה ל Google Drive נכשלה');return false;
  }finally{
    eitanDriveBusy=false;
    if(eitanDrivePendingAfterBusy){eitanDrivePendingAfterBusy=false;setTimeout(eitanPush,120)}
  }
}
function eitanSchedule(){
  eitanMarkPending();clearTimeout(eitanDriveSaveTimer);
  eitanDriveSaveTimer=setTimeout(()=>{if(eitanDriveConnected)eitanPush();else eitanSilent()},1800);
}
async function eitanAfterConnect(){
  eitanDriveConnected=true;eitanSetDriveStatus('⏳ מסנכרן עם Google Drive');eitanLoadMeta();
  try{
    if(eitanDriveFileId){
      const r=await fetch('https://www.googleapis.com/drive/v3/files/'+eitanDriveFileId+'?fields=id,trashed',{headers:eitanHeaders()});
      if(!r.ok||((await r.json()).trashed))eitanDriveFileId=null;
    }
    if(!eitanDriveFileId){
      const f=await eitanFindFile();
      if(f)eitanDriveFileId=f.id;
    }
    if(!eitanDriveFileId){
      await eitanCreate();
    }else if(eitanHasPending()){
      await eitanDownload();await eitanPush();
    }else{
      const buf=await eitanDownload();await eitanLoadBuffer(buf);eitanClearPending();eitanSaveMeta();
      eitanSetDriveStatus('✓ נטען מ Google Drive');render();
    }
  }catch(e){
    console.error(e);eitanSetDriveStatus('⚠ לחץ שמור לחיבור Google Drive');
  }
}
function eitanConnect(interactive){
  if(typeof google==='undefined'||!google.accounts||!google.accounts.oauth2){
    eitanSetDriveStatus('⏳ Google עדיין נטען');
    if(interactive)setTimeout(()=>eitanConnect(true),700);
    return;
  }
  if(!eitanTokenClient){
    eitanTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:EITAN_GOOGLE_CLIENT_ID,
      scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{
        if(r.error){eitanSetDriveStatus('⚠ לחץ שמור לחיבור Google Drive');return}
        eitanDriveAccessToken=r.access_token;eitanAfterConnect();
      }
    });
  }
  try{eitanTokenClient.requestAccessToken({prompt:interactive?'consent':''})}
  catch(e){eitanSetDriveStatus('⚠ לחץ שמור לחיבור Google Drive')}
}
function eitanSilent(){if(!eitanDriveConnected)eitanConnect(false)}

const TODAY_FORM_KEY='eitan-meeting-form-2026-09-29';
let todayForm=JSON.parse(localStorage.getItem(TODAY_FORM_KEY)||'null')||{
  date:TODAY_FORM_DATE,
  participant:'איתן',
  location:'',
  duration:'',
  answers:{},
  notes:''
};

let lastAutoSaveAt = '';
function persistMeetingNow(){
  try{
    saveTodayForm();
    localStorage.setItem(TODAY_FORM_KEY+'_checkpoint', JSON.stringify({
      savedAt:new Date().toISOString(),
      data:todayForm
    }));
    lastAutoSaveAt = new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const el=document.getElementById('localSaveTime');
    if(el)el.textContent='נשמר מקומית '+lastAutoSaveAt;
  }catch(e){}
}
setInterval(persistMeetingNow,2000);
window.addEventListener('beforeunload',persistMeetingNow);
window.addEventListener('pagehide',persistMeetingNow);

function saveTodayForm(){
  localStorage.setItem(TODAY_FORM_KEY,JSON.stringify(todayForm));
}
function setMeetingAnswer(n,v){
  todayForm.answers[String(n)]=v;
  saveTodayForm();
  const row=document.querySelector(`[data-meeting-q="${n}"]`);
  if(row)row.classList.toggle('answered',String(v).trim().length>0);
  updateMeetingProgress();
}
function setMeetingMeta(k,v){todayForm[k]=v;saveTodayForm()}
function setMeetingNotes(v){todayForm.notes=v;saveTodayForm()}
function meetingAnswered(){
  return TODAY_FORM_QUESTIONS.filter(q=>String(todayForm.answers[String(q.n)]||'').trim()).length;
}
function meetingProgress(){
  return Math.round(meetingAnswered()/TODAY_FORM_QUESTIONS.length*100);
}
function updateMeetingProgress(){
  const el=document.getElementById('meetingProgressLive');
  if(el)el.textContent=`${meetingAnswered()} מתוך 34 · ${meetingProgress()}%`;
}
function jumpMeetingSection(id){
  const el=document.getElementById(id);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}

 else if(view==='questions') html=questionsView();
 else if(view==='documents') html=docsView();
 else if(view==='drafts') html=draftsView();
 else if(view==='market') html=marketView();
 else if(view==='financial') html=financialView();
 else if(view==='diagram') html=diagramView();
 else if(view==='tasks') html=tasksView();
 else if(view==='notes') html=notesView();
 else if(view==='settings') html=settingsView();
 else if(view==='data') html=dataView();
 main.innerHTML=html;
 save();
}

function saveAdd(){
 const type=atype.value,name=aname.value.trim();
 if(!name){alert('יש לרשום שם');return}
 if(type.startsWith('נתון')) s.data.unshift(['d'+Date.now(),name,avalue.value,aunit.value,acat.value,asource.value,'לא מאומת']);
 else if(type==='משימה') s.tasks.unshift({name,owner:'ברוך',status:'פתוח'});
 else if(type==='מסמך') s.docs.unshift({name,category:acat.value,source:asource.value});
 else if(type==='מקור מידע') s.sources.unshift({name,source:asource.value});
 else s.drafts.unshift({name,type,notes:anotes.value});
 s.audit.unshift({at:new Date().toISOString(),action:'הוספת '+type,entity:name});
 ['aname','avalue','aunit','asource','anotes'].forEach(id=>document.getElementById(id).value='');
 modal.classList.remove('open');
 save();
 render();
}

document.getElementById('search').oninput=e=>{
 const q=e.target.value.trim().toLowerCase();
 if(!q) return;
 const docHit=getAllDocs().find(d=>(d.name+' '+(d.source||'')).toLowerCase().includes(q));
 const dataHit=s.data.find(d=>d.join(' ').toLowerCase().includes(q));
 const qHit=s.questions.find(x=>(x.text+' '+x.topic+' '+x.answer).toLowerCase().includes(q));
 if(docHit){docSourceFilter=docHit.source||'';view='documents';render()}
 else if(dataHit){view='data';render()}
 else if(qHit){view='forms';render()}
};
render();
</script>
</body>
</html>
